use_default_settings: true
server:
  secret_key: "CHANGEME-run-the-installer-to-generate-a-secure-key"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
search:
  safe_search: 0
  # Installers write the install locale here (installers/lib/searxng-locale.sh).
  # API clients send no language, so "auto" would mean "all".
  default_lang: "en"
  formats:
    - html
    - json
hostnames:
  # Seznam (below) is a Czech-market fallback; keep its .cz shops out of
  # results unless the install locale is Czech.
  remove:
    - '\.cz$'
engines:
  - name: bing
    # Requalify before enabling: this pin returns first-word-only results.
    # https://github.com/searxng/searxng/pull/6671
    disabled: true
  - name: duckduckgo
    disabled: false
  - name: google
    disabled: false
  - name: brave
    disabled: false
  - name: seznam
    # Independent general-web fallback when major engines block this household IP.
    disabled: false
  - name: wikipedia
    disabled: false
  - name: github
    disabled: false
  - name: stackoverflow
    disabled: false

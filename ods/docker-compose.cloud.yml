# ODS - Cloud / external LLM overlay
#
# Cloud mode keeps the ODS services running but does not launch a local
# llama-server container. Open WebUI, Hermes, Perplexica, and other clients
# route through LLM_API_URL / HERMES_LLM_BASE_URL instead.

services:
  llama-server:
    profiles:
      - local-inference
    restart: "no"

  # Model Router only routes to a local runtime; cloud-only mode has no local
  # model to switch, so gate it behind the same local-inference profile.
  model-router:
    profiles:
      - local-inference
    restart: "no"

  # Pixel's model relay has a hard dependency on model-router. Keep their
  # cloud-mode profile in lockstep so an enabled local install remains a valid
  # Compose project when the operator checks or switches to cloud mode.
  pixel-model-relay:
    profiles:
      - local-inference
    restart: "no"

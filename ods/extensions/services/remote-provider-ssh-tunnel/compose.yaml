x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  remote-provider-ssh-tunnel:
    build:
      context: .
      dockerfile: extensions/services/remote-provider-ssh-tunnel/Dockerfile
    image: ods-remote-provider-ssh-tunnel:local
    container_name: ods-remote-provider-ssh-tunnel
    restart: unless-stopped
    expose: ["18090", "18091", "18092"]
    security_opt: [no-new-privileges:true]
    cap_drop:
      - ALL
    group_add: ["${REMOTE_PROVIDER_DATA_GID:-1000}"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging: *default-logging
    environment:
      - ODS_REMOTE_PROVIDER_ROUTE_PATH=/state/remote-provider/routing-state.json
      - ODS_REMOTE_PROVIDER_SECRET_DIR=/state/remote-provider/secrets
      - ODS_REMOTE_PROVIDER_SSH_STATUS_PORT=18090
      - ODS_REMOTE_PROVIDER_SSH_RECONCILE_INTERVAL=${ODS_REMOTE_PROVIDER_SSH_RECONCILE_INTERVAL:-5}
      - ODS_REMOTE_PROVIDER_SSH_START_GRACE=${ODS_REMOTE_PROVIDER_SSH_START_GRACE:-1}
      - ODS_REMOTE_PROVIDER_SSH_RESTART_COOLDOWN=${ODS_REMOTE_PROVIDER_SSH_RESTART_COOLDOWN:-5}
      - ODS_REMOTE_PROVIDER_SSH_STOP_TIMEOUT=${ODS_REMOTE_PROVIDER_SSH_STOP_TIMEOUT:-5}
    volumes:
      - ${ODS_DATA_DIR:-./data}/remote-provider:/state/remote-provider:ro
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 128M}
        reservations: {cpus: '0.05', memory: 32M}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18090/health',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

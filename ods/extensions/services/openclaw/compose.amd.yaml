# AMD/Lemonade overlay — bypass LiteLLM for Responses API.
#
# This direct route preserves compatibility with Lemonade responses that omit
# optional fields (created_at, output) in SSE response.created events; older
# LiteLLM validation rejected those events and caused HTTP 500 errors.
# Lemonade handles the Responses API correctly on its own — both
# streaming and non-streaming — so bypassing LiteLLM avoids the issue.
services:
  openclaw:
    environment:
      # Windows generates ODS_AGENT_HOST=host.docker.internal for native
      # host services. Linux leaves it unset and keeps using the managed
      # llama-server service on the Compose network.
      - OLLAMA_URL=http://${ODS_AGENT_HOST:-llama-server}:${AMD_INFERENCE_PORT:-8080}/api

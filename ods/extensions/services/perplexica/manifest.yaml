schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: perplexica
  name: Perplexica (Deep Research)
  aliases: []
  container_name: ods-perplexica
  host_env: PERPLEXICA_HOST
  default_host: perplexica
  port: 3000
  external_port_env: PERPLEXICA_PORT
  external_port_default: 3004
  health: /
  ui_path: /
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  # Managed local inference adds llama-server in compose.local.yaml. External
  # model routes omit that overlay and must not plan a local inference service.
  depends_on: [searxng]
  env_vars:
    - key: PERPLEXICA_SEARXNG_API_URL
      required: false
      secret: false
      default: ""
      description: Explicit SearXNG-compatible search endpoint; leave empty to preserve Perplexica's current setting
  llm:
    consumes: true
    route: gateway
    pinning: none
    min_context: 65536
    probe:
      kind: custom
      path: /api/search
      auth: none

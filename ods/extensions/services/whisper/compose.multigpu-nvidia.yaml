services:
  whisper:
    # The GPU itself is reserved by compose.nvidia.yaml via device_ids, which
    # resolves to WHISPER_GPU_UUID here. Do not add a second devices entry: Compose
    # appends reservation lists, so the container would get an extra GPU.
    environment:
      NVIDIA_VISIBLE_DEVICES: "${WHISPER_GPU_UUID:-0}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

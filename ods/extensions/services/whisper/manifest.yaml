schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: whisper
  name: Whisper (STT)
  description: Speech-to-text service. ODS Talk also needs Hermes and Kokoro.
  aliases: [stt, voice]
  container_name: ods-whisper
  host_env: WHISPER_HOST
  default_host: whisper
  port: 8000
  external_port_env: WHISPER_PORT
  external_port_default: 9000
  health: /health
  ui_path: /
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []

features:
  - id: voice
    name: ODS Talk
    description: Hermes handles the conversation, Whisper accepts audio messages, and Kokoro speaks replies
    icon: Mic
    category: voice
    requirements:
      services: [whisper, tts, hermes]
      vram_gb: 0
    enabled_services_all: [whisper, tts, hermes]
    setup_time: ~5 minutes
    priority: 2
    launch:
      type: internal
      path: /talk
    gpu_backends: [all]

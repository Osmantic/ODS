schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: hermes
  name: Hermes Agent
  aliases: [agent, hermes-agent]
  container_name: ods-hermes
  default_host: hermes
  # Hermes's own dashboard listens on 9119 inside the container.
  # Internal-only — there is intentionally no host-port binding here.
  # End users reach Hermes via hermes-proxy on :9120 (auth-gated entry
  # point); see HERMES-SSO.md. The compose file declares this port
  # under `expose:` so other containers on the bridge network (notably
  # hermes-proxy) can talk to ods-hermes:9119.
  port: 9119
  # This explicit zero prevents dashboard-api from falling back
  # external_port to service.port and advertising a non-existent direct
  # :9119 host URL. Hermes is internal-only (compose declares the port
  # under `expose:` not `ports:`); hermes-proxy is the LAN entry.
  external_port_default: 0
  #
  # Most /api/* routes are session-token gated, and /api/health does not
  # exist in the pinned upstream image. /api/status is explicitly public,
  # read-only, and JSON-backed, so it is the health path ODS should poll.
  # Keep this aligned with the container healthcheck in compose.yaml.
  health: /api/status
  ui_path: /
  health_timeout: 60  # Hermes does skill sync + config bootstrap on cold start
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: recommended
  depends_on: [llama-server, searxng]
  llm:
    consumes: true
    route: gateway
    pinning: none
    min_context: 65536
    probe:
      # The pinned upstream dashboard has no HTTP chat-completion route.
      # /api/status is its public, deterministic post-restart probe; the
      # bootstrap transaction separately proves the model completion route.
      kind: custom
      path: /api/status
      auth: none
  description: >
    Portal candidate runtime based on the full upstream Hermes AIAgent from
    Nous Research, pinned by immutable OCI index digest and routed to the ODS
    model gateway. Messaging-platform adapters remain installed but are
    unconfigured without operator credentials. Portal plugin packaging and
    activation remain governed by config/portal-dependency-lock.json; the
    internal hermes service ID is retained for compatibility during migration.

  env_vars:
    # HERMES_PORT is intentionally NOT exposed here. With this PR's
    # internal-only compose (`expose: 9119`), there's no host binding to
    # control — the variable would be a no-op knob. The user-facing port
    # is HERMES_PROXY_PORT (declared by the hermes-proxy manifest).
    - key: HERMES_LLM_BASE_URL
      default: "http://llama-server:8080/v1"
      description: OpenAI-compatible endpoint Hermes talks to. Defaults to ODS's llama-server.
    - key: HERMES_LLM_API_KEY
      default: "sk-ods-hermes-local"
      description: |
        Dummy API key — llama-server doesn't validate it but the OpenAI SDK
        Hermes uses internally requires the field to be non-empty.
    - key: SEARXNG_URL
      default: "http://searxng:8080"
      description: Hermes web-search backend. Defaults to ODS's bundled SearXNG service.
    # Note: there is intentionally no HERMES_MODEL_NAME here. The model
    # name lives in /opt/data/config.yaml after first start; an earlier
    # draft exposed an env var, but the upstream image doesn't read it
    # at runtime — only the YAML file. Edit the file (or delete it to
    # re-copy from the template) to change the model.

features:
  - id: hermes-agent
    name: Hermes Agent
    description: Hermes runtime base for the Portal candidate — chat, tools, persistent memory, scheduled tasks
    icon: Bot
    category: productivity
    requirements:
      services: [hermes, hermes-proxy, dashboard-api]
      services_any: [llama-server, litellm]
      vram_gb: 0
    enabled_services_all: [hermes, hermes-proxy, dashboard-api]
    enabled_services_any: [llama-server, litellm]
    setup_time: ~1 minute (image pull)
    priority: 5
    launch:
      type: service
      service: hermes-proxy
    gpu_backends: [all]

# ODS adds Linux netlink for fixed read-only network observations. GPU device
# visibility is closed by cgroup policy to the specific compute device nodes
# used by nvidia-smi; disks, input devices, cameras, and microphones remain
# unavailable. The unprivileged broker retains an empty capability set.
[Service]
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK AF_VSOCK
PrivateDevices=false
DevicePolicy=closed
DeviceAllow=/dev/dxg rw
DeviceAllow=/dev/nvidiactl rw
DeviceAllow=/dev/nvidia-modeset rw
DeviceAllow=/dev/nvidia-uvm rw
DeviceAllow=/dev/nvidia-uvm-tools rw
DeviceAllow=/dev/nvidia0 rw
DeviceAllow=/dev/nvidia1 rw
DeviceAllow=/dev/nvidia2 rw
DeviceAllow=/dev/nvidia3 rw
DeviceAllow=/dev/nvidia4 rw
DeviceAllow=/dev/nvidia5 rw
DeviceAllow=/dev/nvidia6 rw
DeviceAllow=/dev/nvidia7 rw
DeviceAllow=/dev/nvidia8 rw
DeviceAllow=/dev/nvidia9 rw
DeviceAllow=/dev/nvidia10 rw
DeviceAllow=/dev/nvidia11 rw
DeviceAllow=/dev/nvidia12 rw
DeviceAllow=/dev/nvidia13 rw
DeviceAllow=/dev/nvidia14 rw
DeviceAllow=/dev/nvidia15 rw

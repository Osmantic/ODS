services:
  comfyui:
    # The GPU itself is reserved by compose.nvidia.yaml via device_ids, which
    # resolves to COMFYUI_GPU_UUID here. Do not add a second devices entry: Compose
    # appends reservation lists, so the container would get an extra GPU.
    environment:
      NVIDIA_VISIBLE_DEVICES: "${COMFYUI_GPU_UUID:?COMFYUI_GPU_UUID must be set for the NVIDIA multi-GPU overlay}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

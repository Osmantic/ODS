services:
  comfyui:
    build:
      context: ./extensions/services/comfyui
      dockerfile: Dockerfile
    container_name: ods-comfyui
    # Reap child processes during a busy model load so Docker can stop this
    # container without leaving a zombie behind.
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Offload SDXL between prompts so a co-resident model server can use
      # this GPU. A retained .env override can opt out on a dedicated GPU.
      COMFYUI_DISABLE_SMART_MEMORY: "${COMFYUI_DISABLE_SMART_MEMORY:-true}"
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    volumes:
      - ./data/comfyui/models:/models:z
      - ./data/comfyui/output:/output:z
      - ./data/comfyui/input:/input:z
      - ./data/comfyui/workflows:/workflows:ro,z
      # Saved workflows and UI settings. Without this they live only in the
      # container layer and are lost on every recreate (e.g. `ods update`).
      - ./data/comfyui/user:/user:z
    shm_size: '8g'
    deploy:
      resources:
        limits:
          cpus: '${COMFYUI_CPU_LIMIT:-1.0}'
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              # An explicit multi-GPU assignment uses its UUID. Lean installs
              # with an external model have no assignment; GPU 0 is the
              # deterministic fallback for a later Library add-back.
              device_ids: ["${COMFYUI_GPU_UUID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8188"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

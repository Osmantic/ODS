services:
  comfyui:
    build:
      context: ./extensions/services/comfyui
      dockerfile: Dockerfile
    container_name: ods-comfyui
    # Reap child processes during a busy model load so Docker can stop this
    # container without leaving a zombie behind.
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    volumes:
      - ./data/comfyui/models:/models:z
      - ./data/comfyui/output:/output:z
      - ./data/comfyui/input:/input:z
      - ./data/comfyui/workflows:/workflows:ro,z
      # Saved workflows and UI settings. Without this they live only in the
      # container layer and are lost on every recreate (e.g. `ods update`).
      - ./data/comfyui/user:/user:z
      # The CUDA driver's kernel cache. On a GPU this PyTorch build has no
      # kernels for (GB300, sm_103) the driver compiles ~850 MB of them for the
      # first image. In the container layer that work was lost on every
      # recreate, so the first image after an update took 52 s instead of 7 s.
      - ./data/comfyui/cuda-cache:/cuda-cache:z
    environment:
      CUDA_CACHE_PATH: /cuda-cache
      # The 1 GiB default barely holds one sm_103 set; 4 GiB is the maximum.
      CUDA_CACHE_MAXSIZE: "4294967296"
    shm_size: '8g'
    deploy:
      resources:
        limits:
          cpus: '${COMFYUI_CPU_LIMIT:-1.0}'
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              # One GPU. On multi-GPU hosts the installer writes COMFYUI_GPU_UUID and the
              # multigpu overlay requires it; a second reservation there would be
              # appended by Compose and hand the container an extra GPU.
              device_ids: ["${COMFYUI_GPU_UUID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8188"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

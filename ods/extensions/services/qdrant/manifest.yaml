schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: qdrant
  name: Qdrant (Vector DB)
  aliases: [vector]
  container_name: ods-qdrant
  host_env: QDRANT_HOST
  default_host: qdrant
  port: 6333
  external_port_env: QDRANT_PORT
  external_port_default: 6333
  health: /readyz
  ui_path: /dashboard
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  setup_hook: setup.sh
  env_vars:
    - key: QDRANT_API_KEY
      required: false
      secret: true
      description: "API key for authenticating REST and gRPC endpoints (auto-generated by setup.sh)"
  description: |
    Qdrant is an open-source, high-performance vector search engine written in Rust.
    Optimized for high-dimensional vector embeddings, filtered similarity search,
    and local RAG pipelines with LiteLLM and OpenWebUI.

  tags:
    - vector-database
    - semantic-search
    - embeddings
    - rag
    - rust
    - local

features:
  - id: vector-search
    name: Vector Search
    description: High-performance approximate nearest neighbor search with HNSW indexes
    icon: Search
    category: data
    requirements:
      services: [qdrant]
      vram_gb: 0
    enabled_services_all: [qdrant]
    setup_time: ~1 minute
    priority: 15
  - id: payload-filtering
    name: Payload Filtering
    description: Rich structured metadata filtering combined with vector similarity
    icon: Filter
    category: data
    requirements:
      services: [qdrant]
      vram_gb: 0
    enabled_services_all: [qdrant]
    setup_time: ~1 minute
    priority: 16
  - id: grpc-interface
    name: gRPC Interface
    description: High-throughput binary protocol on port 6334 for low-latency ingest
    icon: Zap
    category: data
    requirements:
      services: [qdrant]
      vram_gb: 0
    enabled_services_all: [qdrant]
    setup_time: ~1 minute
    priority: 17

schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: model-router
  name: ODS Model Router
  aliases: []
  container_name: ods-model-router
  host_env: MODEL_ROUTER_HOST
  default_host: model-router
  port: 9099
  external_port_default: 0
  external_link: false
  health: /health
  # This control-plane API is reachable only on the private Compose network.
  # Host-side status must use its declared Docker healthcheck, not port 9099.
  health_source: container
  ui_path: /health
  type: docker
  gpu_backends: [all]
  category: core
  depends_on: []
  startup_check: true

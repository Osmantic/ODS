schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: evidently
  name: Evidently
  aliases: []
  container_name: ods-evidently
  host_env: EVIDENTLY_HOST
  default_host: evidently
  port: 8000
  external_port_env: EVIDENTLY_PORT
  external_port_default: 11016
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Track data drift and model-quality evaluation reports in a local monitoring
    dashboard.
  env_vars:
  - key: EVIDENTLY_SECRET
    required: true
    secret: true
    description: Secret required by SDK clients to write evaluation reports.
  ui_path: /
tags:
- development
- local
- open-source
features:
- id: evidently-workspace
  name: Evidently
  description: Track data drift and model-quality evaluation reports in a local monitoring
    dashboard.
  icon: ChartNoAxesCombined
  category: development
  requirements:
    services:
    - evidently
    vram_gb: 0
  enabled_services_all:
  - evidently
  setup_time: Initial image download; see README
  priority: 46
  launch:
    type: service
    service: evidently
    path: /

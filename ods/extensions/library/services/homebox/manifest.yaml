schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: homebox
  name: Homebox
  aliases: []
  container_name: ods-homebox
  host_env: HOMEBOX_HOST
  default_host: homebox
  port: 7745
  external_port_env: HOMEBOX_PORT
  external_port_default: 11089
  health: /api/v1/status
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Track equipment, locations, warranties, maintenance and item attachments
    in a local inventory.
  env_vars:
  - key: HOMEBOX_API_KEY_PEPPER
    required: true
    secret: true
    description: Stable random secret of at least 32 bytes for API-key hashing; retain
      with backups.
  - key: HOMEBOX_ALLOW_REGISTRATION
    required: false
    default: 'true'
    description: Enable first-account registration; set false and restart after creating
      the owner account.
  ui_path: /
tags:
- inventory
- equipment
- organization
- open-source
features:
- id: homebox-inventory
  name: Homebox
  description: Track equipment, locations, warranties, maintenance and item attachments
    in a local inventory.
  icon: Package
  category: productivity
  requirements:
    services:
    - homebox
    vram_gb: 0
  enabled_services_all:
  - homebox
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: homebox
    path: /

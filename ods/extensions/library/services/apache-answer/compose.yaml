services:
  apache-answer:
    image: apache/answer:2.0.2@sha256:a0d71b0e30a5c8d3eda31184abc64dbebccb6dd3e229aab1f7e332b41ade54f7
    container_name: ods-apache-answer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: UTC
    volumes:
      - apache-answer-data:/data
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${APACHE_ANSWER_PORT:-11147}:80
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --location, --max-time, '8', 'http://127.0.0.1/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks: [ods-network]
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  apache-answer-data: {}

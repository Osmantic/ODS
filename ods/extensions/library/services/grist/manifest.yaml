schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: grist
  name: Grist Community
  aliases: []
  container_name: ods-grist
  host_env: GRIST_HOST
  default_host: grist
  port: 8484
  external_port_env: GRIST_PORT
  external_port_default: 11082
  health: /status
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Build relational spreadsheets with Python formulas, linked views, reusable
    tables and portable documents.
  env_vars:
  - key: GRIST_OWNER_EMAIL
    required: true
    secret: false
    description: Local single-user document identity, not a password or verified login.
  - key: GRIST_SESSION_SECRET
    required: true
    secret: true
    description: Persistent random session signing secret; use at least 32 random
      characters.
  ui_path: /
tags:
- spreadsheets
- data
- open-source
features:
- id: grist-spreadsheets
  name: Grist Community
  description: Build relational spreadsheets with Python formulas, linked views, reusable
    tables and portable documents.
  icon: Table
  category: productivity
  requirements:
    services:
    - grist
    vram_gb: 0
  enabled_services_all:
  - grist
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: grist
    path: /

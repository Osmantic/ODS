schema_version: ods.services.v1
service:
  id: laya
  name: Laya
  aliases: []
  container_name: ods-laya
  host_env: LAYA_HOST
  default_host: laya
  port: 8000
  external_port_env: LAYA_PORT
  external_port_default: 8017
  health: /ready
  health_timeout: 5
  external_link: false
  type: docker
  gpu_backends: [all]
  category: optional
  compose_file: compose.yaml
  depends_on: []
  setup_hook: setup.sh
  hooks:
    pre_start: setup.sh
  description: Local classification and scoring used by the selected Portal model during a task.
  env_vars:
    - key: LAYA_ACCELERATION
      description: Acceleration (auto uses NVIDIA when memory is available; cpu keeps it on CPU)
      default: auto
      pattern: '^(auto|cpu|cuda)$'
      format_description: auto, cpu or cuda
      required: false
    - key: LAYA_PORT
      description: Local connection port
      default: '8017'
      format: integer
      required: false
features:
  - id: laya-portal
    name: Laya for Portal
    description: Classify and score text directly within Portal conversations.
    icon: Workflow
    category: ai
    requirements:
      services: [laya]
      vram_gb: 0
    enabled_services_all: [laya]
    setup_time: First setup downloads the decision models
    priority: 50
    launch:
      type: none
tags: [portal, classification, local, multilingual]

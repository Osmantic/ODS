services:
  nats:
    image: ods/nats:2.15.0-local-v1
    container_name: ods-nats
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${NATS_PORT:-11128}:4222
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8222/healthz?js-enabled-only=true
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    user: 1000:1000
    environment:
      NATS_PASSWORD: ${NATS_PASSWORD:?Set a random 64-hex NATS password}
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    stop_grace_period: 60s
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    volumes:
    - nats-data:/data
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  nats-data: {}

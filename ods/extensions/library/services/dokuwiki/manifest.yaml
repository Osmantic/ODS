schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: dokuwiki
  name: DokuWiki
  aliases: []
  container_name: ods-dokuwiki
  host_env: DOKUWIKI_HOST
  default_host: dokuwiki
  port: 8080
  external_port_env: DOKUWIKI_PORT
  external_port_default: 11065
  health: /health.php
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Maintain a file-based team wiki with page revisions, media and configurable
    access permissions.
  env_vars: []
  ui_path: /
tags:
- wiki
- documentation
- open-source
features:
- id: dokuwiki-knowledge
  name: DokuWiki
  description: Maintain a file-based team wiki with page revisions, media and configurable
    access permissions.
  icon: BookOpen
  category: productivity
  requirements:
    services:
    - dokuwiki
    vram_gb: 0
  enabled_services_all:
  - dokuwiki
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: dokuwiki
    path: /

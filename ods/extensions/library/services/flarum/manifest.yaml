schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: flarum
  name: Flarum
  aliases: []
  container_name: ods-flarum
  host_env: FLARUM_HOST
  default_host: flarum
  port: 8000
  external_port_env: FLARUM_PORT
  external_port_default: 11133
  health: /
  type: docker
  startup_check: true
  startup_timeout: 240
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Run discussion forums with topics, tags, moderation and community permissions.
  env_vars:
  - key: FLARUM_DB_PASSWORD
    required: true
    secret: true
    description: Stable random 64-hex database password; changing environment alone
      does not rotate an initialized database.
  ui_path: /
tags:
- forum
- community
- discussion
- open-source
features:
- id: flarum-forum
  name: Flarum
  description: Run discussion forums with topics, tags, moderation and community permissions.
  icon: MessagesSquare
  category: productivity
  requirements:
    services:
    - flarum
    vram_gb: 0
  enabled_services_all:
  - flarum
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: flarum
    path: /

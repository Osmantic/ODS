schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: jsoncrack
  name: JSON Crack
  aliases: []
  container_name: ods-jsoncrack
  host_env: JSONCRACK_HOST
  default_host: jsoncrack
  port: 8080
  external_port_env: JSONCRACK_PORT
  external_port_default: 11142
  health: /editor
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Explore JSON and structured API data as interactive graphs, transform
    formats and export diagrams.
  env_vars: []
  ui_path: /editor
tags:
- json
- data-visualization
- development
- open-source
features:
- id: jsoncrack-visualize
  name: JSON Crack
  description: Explore JSON and structured API data as interactive graphs, transform
    formats and export diagrams.
  icon: Network
  category: productivity
  requirements:
    services:
    - jsoncrack
    vram_gb: 0
  enabled_services_all:
  - jsoncrack
  setup_time: Initial source build; see README
  priority: 48
  launch:
    type: service
    service: jsoncrack
    path: /editor

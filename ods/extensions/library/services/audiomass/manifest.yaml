schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: audiomass
  name: AudioMass
  aliases: []
  container_name: ods-audiomass
  host_env: AUDIOMASS_HOST
  default_host: audiomass
  port: 8080
  external_port_env: AUDIOMASS_PORT
  external_port_default: 11079
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Edit audio waveforms and multitrack sessions locally in the browser,
    apply effects and export audio assets for a project.
  env_vars: []
  ui_path: /
tags:
- audio
- waveform
- multitrack
- open-source
features:
- id: audiomass-audio
  name: AudioMass
  description: Edit audio waveforms and multitrack sessions locally in the browser,
    apply effects and export audio assets for a project.
  icon: AudioLines
  category: productivity
  requirements:
    services:
    - audiomass
    vram_gb: 0
  enabled_services_all:
  - audiomass
  setup_time: Initial source build; see README
  priority: 48
  launch:
    type: service
    service: audiomass
    path: /

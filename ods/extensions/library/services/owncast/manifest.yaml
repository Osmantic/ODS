schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: owncast
  name: Owncast
  aliases: []
  container_name: ods-owncast
  host_env: OWNCAST_HOST
  default_host: owncast
  port: 8080
  external_port_env: OWNCAST_PORT
  external_port_default: 11129
  health: /api/status
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Host live video from an RTMP encoder with a browser player and native
    chat.
  env_vars:
  - key: OWNCAST_ADMIN_PASSWORD
    required: true
    secret: true
    description: Random 64-hex administrator password enforced on each startup.
  - key: OWNCAST_STREAM_KEY
    required: true
    secret: true
    description: Distinct random 64-hex RTMP stream key enforced for this deployment.
  ui_path: /
tags:
- video
- streaming
- creation
- open-source
features:
- id: owncast-live
  name: Owncast
  description: Host live video from an RTMP encoder with a browser player and native
    chat.
  icon: Video
  category: productivity
  requirements:
    services:
    - owncast
    vram_gb: 0
  enabled_services_all:
  - owncast
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: owncast
    path: /

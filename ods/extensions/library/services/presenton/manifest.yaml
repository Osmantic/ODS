schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: presenton
  name: Presenton
  aliases: []
  container_name: ods-presenton
  host_env: PRESENTON_HOST
  default_host: presenton
  port: 80
  external_port_env: PRESENTON_PORT
  external_port_default: 11007
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on:
  - litellm
  description: Generate and edit presentations using the current ODS model through
    the local gateway.
  env_vars: []
  ui_path: /
  llm:
    consumes: true
    route: gateway
    pinning: none
    probe:
      kind: chat
      path: /v1/chat/completions
      auth: env:LITELLM_KEY
tags:
- productivity
- local
- open-source
features:
- id: presenton-workspace
  name: Presenton
  description: Generate and edit presentations using the current ODS model through
    the local gateway.
  icon: Presentation
  category: productivity
  requirements:
    services:
    - presenton
    vram_gb: 0
  enabled_services_all:
  - presenton
  setup_time: Initial image download; see README
  priority: 37
  launch:
    type: service
    service: presenton
    path: /

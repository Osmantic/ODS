schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: docling-serve
  name: Docling Serve
  aliases: []
  container_name: ods-docling-serve
  host_env: DOCLING_SERVE_HOST
  default_host: docling-serve
  port: 5001
  external_port_env: DOCLING_SERVE_PORT
  external_port_default: 11000
  health: /health
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Convert PDFs, Office files and images into structured documents with
    a local API and upload interface.
  env_vars: []
  ui_path: /ui
tags:
- documents
- local
- open-source
features:
- id: docling-serve-workspace
  name: Docling Serve
  description: Convert PDFs, Office files and images into structured documents with
    a local API and upload interface.
  icon: FileText
  category: documents
  requirements:
    services:
    - docling-serve
    vram_gb: 0
  enabled_services_all:
  - docling-serve
  setup_time: Initial image download; see README
  priority: 30
  launch:
    type: service
    service: docling-serve
    path: /ui

schema_version: ods.services.v1

service:
  id: surrealdb
  name: SurrealDB
  aliases: [surreal, surrealist-backend]
  container_name: ods-surrealdb
  host_env: SURREALDB_HOST
  default_host: surrealdb
  port: 8000
  external_port_env: SURREALDB_PORT
  external_port_default: 8900
  health: /health
  ui_path: /
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  env_vars:
    - key: SURREALDB_USER
      required: false
      secret: false
      description: "Root username for SurrealDB (default: root)"
    - key: SURREALDB_PASS
      required: true
      secret: true
      description: "Root password for SurrealDB (auto-generated by setup.sh)"
    - key: SURREALDB_PORT
      required: false
      secret: false
      description: "Host port mapped to SurrealDB HTTP (default: 8900; avoids clash with ChromaDB on 8000)"
  setup_hook: setup.sh
  description: |
    SurrealDB is a multi-model database with first-class graph, document, and
    relational querying (SurrealQL). Use it as a local knowledge-graph / app
    database; connect with Surrealist (desktop or https://surrealist.app) as the GUI.
  tags:
    - knowledge-graph
    - multi-model
    - graph-database
    - surrealql
    - open-source
    - local

features:
  - id: knowledge-graph
    name: Knowledge Graph
    description: Persist entities and relationships with SurrealQL graph traversals
    icon: Share2
    category: data
    requirements:
      services: [surrealdb]
      vram_gb: 0
    enabled_services_all: [surrealdb]
    setup_time: ~1 minute
    priority: 14
  - id: multi-model-database
    name: Multi-Model Database
    description: Documents, graphs, and relational data in one SurrealDB instance
    icon: Database
    category: data
    requirements:
      services: [surrealdb]
      vram_gb: 0
    enabled_services_all: [surrealdb]
    setup_time: ~1 minute
    priority: 15

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: actual-budget
  name: Actual Budget
  aliases: []
  container_name: ods-actual-budget
  host_env: ACTUAL_BUDGET_HOST
  default_host: actual-budget
  port: 5006
  external_port_env: ACTUAL_BUDGET_PORT
  external_port_default: 11046
  health: /health
  type: docker
  startup_check: true
  startup_timeout: 120
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Organize local budgets, import transaction files and synchronize budget
    documents through a persistent self-hosted server.
  env_vars: []
  ui_path: /
tags:
- productivity
- local
- open-source
features:
- id: actual-budget-workspace
  name: Actual Budget
  description: Organize local budgets, import transaction files and synchronize budget
    documents through a persistent self-hosted server.
  icon: Wallet
  category: productivity
  requirements:
    services:
    - actual-budget
    vram_gb: 0
  enabled_services_all:
  - actual-budget
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: actual-budget
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: shiori
  name: Shiori
  aliases: []
  container_name: ods-shiori
  host_env: SHIORI_HOST
  default_host: shiori
  port: 8080
  external_port_env: SHIORI_PORT
  external_port_default: 11055
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Save bookmarks, tag links and archive readable page content in a local
    library with authenticated web access.
  env_vars:
  - key: SHIORI_INITIAL_PASSWORD
    required: true
    secret: true
    description: 'First-account password for username shiori: 12 to 72 UTF-8 bytes.
      Does not reset existing accounts.'
  - key: SHIORI_HTTP_SECRET_KEY
    required: true
    secret: true
    description: Persistent random session signing secret, at least 32 random characters.
  ui_path: /
tags:
- bookmarks
- research
- open-source
features:
- id: shiori-bookmarks
  name: Shiori
  description: Save bookmarks, tag links and archive readable page content in a local
    library with authenticated web access.
  icon: Bookmark
  category: productivity
  requirements:
    services:
    - shiori
    vram_gb: 0
  enabled_services_all:
  - shiori
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: shiori
    path: /

schema_version: ods.services.v2
compatibility:
  ods_min: "2.6.0"
service:
  id: miniflux
  name: Miniflux (Feed Reader)
  description: "Self-hosted RSS and Atom reading with an authenticated API for local research workflows."
  aliases: [feed-reader]
  container_name: ods-miniflux
  default_host: miniflux
  port: 8080
  external_port_env: MINIFLUX_PORT
  external_port_default: 8098
  health: /healthcheck
  ui_path: /
  type: docker
  version: "2.3.3"
  data_schema_version: "1"
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [rss, research, reading]
  planning:
    provides: [feed-library@1]
    requires: []
    optional: []
    conflicts: []
    provider_priority: 0
    requirements:
      platforms: [linux]
      architectures: [amd64, arm64]
      container_runtimes: [docker]
      gpu_backends: [amd, nvidia, apple, cpu, intel, sycl, jetson, none]
      min_driver_version: null
    estimates:
      download_bytes: 130331037
      disk_bytes: 1073741824
      cpu_millicores: 2000
      ram_bytes: 805306368
      vram_bytes: 0
      gpu_count: 0
    resources:
      host_ports:
        - port: 8098
          protocol: tcp
          configuration_key: MINIFLUX_PORT
      container_ports: [8080, 5432]
      networks: [ods-network, miniflux-private]
      volumes: []
      devices: []
      exclusive: []
      linux_capabilities: []
      host_permissions: [network, host-mount]
    configuration:
      - key: MINIFLUX_PORT
        type: integer
        required: false
        secret: false
        source: user
        restart_behavior: service
        validation:
          minimum: 1
          maximum: 65535
        default: 8098
      - key: MINIFLUX_BASE_URL
        type: url
        required: false
        secret: false
        source: user
        restart_behavior: service
        validation:
          minLength: 1
          maxLength: 2048
        default: "http://localhost:8098"
      - key: MINIFLUX_DB_PASSWORD
        type: string
        required: true
        secret: true
        source: user
        restart_behavior: service
        validation:
          minLength: 1
          maxLength: 1024
      - key: MINIFLUX_ADMIN_PASSWORD
        type: string
        required: true
        secret: true
        source: user
        restart_behavior: service
        validation:
          minLength: 1
          maxLength: 1024
    artifacts:
      images:
        - reference: miniflux/miniflux:2.3.3
          digest: sha256:49d7b60987616387c306a8023087b31f2c9b7b21288b523026cb04058e8b6dbb
          download_bytes: 13148924
        - reference: postgres:17.11-alpine
          digest: sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          download_bytes: 117182113
      builds: []
    lifecycle:
      health_checks: [/healthcheck]
      readiness: [healthy]
      setup_hook: null
      migration_hook: null
      rollback: definition
      timeout_seconds: 180
    data:
      - path: data/miniflux/postgres
        backup_class: required
        owner: user
        uninstall: preserve
        purge: separate-approval
    trust:
      tier: bundled
      publisher: ODS
      definition_signature: null
    support:
      status: experimental
      url: null
  env_vars:
    - key: MINIFLUX_PORT
      description: "Published HTTP port"
      default: "8098"
    - key: MINIFLUX_BASE_URL
      description: "Client-facing URL; update when changing port or hostname"
      default: "http://localhost:8098"
    - key: MINIFLUX_DB_PASSWORD
      description: "Password for the private PostgreSQL database; retain after initialization"
      required: true
      secret: true
    - key: MINIFLUX_ADMIN_PASSWORD
      description: "Initial password for the admin account; later changes use the Miniflux UI"
      required: true
      secret: true
features:
  - id: feed-library
    name: Feed Library
    description: "Collect RSS and Atom articles for reading and authenticated workflow access"
    icon: Rss
    category: productivity
    requirements:
      services: [miniflux]
      vram_gb: 0
    enabled_services_all: [miniflux]
    setup_time: "~2 minutes after setting credentials"
    priority: 31
    launch:
      type: service
      service: miniflux

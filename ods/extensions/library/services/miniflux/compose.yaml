services:
  miniflux:
    image: miniflux/miniflux:2.3.3@sha256:49d7b60987616387c306a8023087b31f2c9b7b21288b523026cb04058e8b6dbb
    container_name: ods-miniflux
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    environment:
      DATABASE_URL: "postgres://miniflux@miniflux-db/miniflux?sslmode=disable"
      PGPASSWORD: "${MINIFLUX_DB_PASSWORD:?Set MINIFLUX_DB_PASSWORD before enabling Miniflux}"
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "${MINIFLUX_ADMIN_PASSWORD:?Set MINIFLUX_ADMIN_PASSWORD before enabling Miniflux}"
      BASE_URL: "${MINIFLUX_BASE_URL:-http://localhost:${MINIFLUX_PORT:-8098}}"
      LISTEN_ADDR: ":8080"
      FETCHER_ALLOW_PRIVATE_NETWORKS: "0"
      INTEGRATION_ALLOW_PRIVATE_NETWORKS: "0"
    depends_on:
      miniflux-db:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIFLUX_PORT:-8098}:8080"
    healthcheck:
      test: [CMD, /usr/bin/miniflux, -healthcheck, auto]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [ods-network, miniflux-private]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
  miniflux-db:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: ods-miniflux-db
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_DB: miniflux
      POSTGRES_PASSWORD: "${MINIFLUX_DB_PASSWORD:?Set MINIFLUX_DB_PASSWORD before enabling Miniflux}"
    volumes:
      - ./data/miniflux/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, miniflux, -d, miniflux]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [miniflux-private]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
networks:
  ods-network:
    external: true
  miniflux-private:
    internal: true

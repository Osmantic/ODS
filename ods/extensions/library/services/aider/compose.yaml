services:
  aider:
    image: paulgauthier/aider:v0.86.2
    container_name: ods-aider
    volumes:
      - ./data/aider:/app
      # Note: Mount git/ssh configs manually if needed:
      # - ${HOME}/.gitconfig:/home/aider/.gitconfig:ro
      # - ${HOME}/.ssh:/home/aider/.ssh:ro
    environment:
      - OPENAI_API_KEY=${LITELLM_KEY:-no-key}
      - AIDER_MODEL=openai/ods/current
      - AIDER_WEAK_MODEL=openai/ods/current
      - AIDER_OPENAI_API_BASE=http://litellm:4000/v1
      - AIDER_ANALYTICS=false
      - AIDER_CHECK_UPDATE=false
    working_dir: /app
    stdin_open: true
    tty: true
    restart: "no"  # One-shot CLI tool
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - ods-network
    # Keep upstream /venv/bin/aider. Installation checks the real executable
    # without starting an inference request; compose run arguments replace this.
    command: ["--version"]

# Named volumes removed — using bind mounts only

networks:
  ods-network:
    external: true
    name: ods-network

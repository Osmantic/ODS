schema_version: ods.services.v1

service:
  id: aider
  name: Aider
  aliases: [aider-chat, pair-programming]
  container_name: ods-aider
  host_env: AIDER_HOST
  default_host: aider
  port: 0
  external_port_env: ''
  external_port_default: 0
  health: ""
  type: docker
  startup_check: false  # real aider --version exits without inference
  external_link: false
  # Aider is a one-shot CLI container and does not require GPU access. ODS
  # writes GPU_BACKEND=cpu for its fallback; retain legacy `none` as well.
  gpu_backends: [amd, nvidia, apple, cpu, none]
  compose_file: compose.yaml
  category: optional
  depends_on: [litellm]
  description: "Terminal pair programming against the active ODS model gateway, with project files mounted in /app."
  env_vars: []

features:
  - id: ai-pair-programming
    name: AI Pair Programming
    description: AI pair programming in your terminal
    icon: Terminal
    category: development
    gpu_backends: [amd, nvidia, apple, cpu, none]
    requirements:
      services: [aider]
      vram_gb: 0
    enabled_services_all: [aider]
    setup_time: ~1 minute
    priority: 11
    launch:
      type: none

services:
  chromadb:
    image: chromadb/chroma:1.5.3@sha256:cfd193653bd61076610730a09acae34ab85b5b6b1f5db4d944c17b5e8453658d
    container_name: ods-chromadb
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CHROMADB_PORT:-8000}:8000"
    volumes:
      - ./data/chromadb:/data
    environment:
      - CHROMA_DB_ANSI_COLOR_ENABLED=true
      - LLM_API_URL=${LLM_API_URL:-http://localhost:8000}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      # Chroma 1.x ships a Rust server, not Python or curl. Probe the HTTP
      # heartbeat with the Bash/coreutils already present in the image.
      test:
        - CMD
        - timeout
        - '8'
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8000;
          printf 'GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r protocol status remainder <&3;
          [[ $$protocol == HTTP/* && $$status == 200 ]]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ods-network

networks:
  ods-network:
    external: true

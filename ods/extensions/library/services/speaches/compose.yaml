services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    container_name: ods-speaches
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${SPEACHES_PORT:-11014}:8000
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:8000/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    volumes:
    - speaches-cache:/home/ubuntu/.cache/huggingface/hub
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      DO_NOT_TRACK: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  speaches-cache: {}

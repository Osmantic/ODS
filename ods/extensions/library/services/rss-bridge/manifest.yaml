schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: rss-bridge
  name: RSS-Bridge
  aliases: []
  container_name: ods-rss-bridge
  host_env: RSS_BRIDGE_HOST
  default_host: rss-bridge
  port: 80
  external_port_env: RSS_BRIDGE_PORT
  external_port_default: 11134
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Generate RSS and Atom feeds from websites and transform feeds for local
    readers.
  env_vars: []
  ui_path: /
tags:
- rss
- feeds
- automation
- open-source
features:
- id: rss-bridge-feeds
  name: RSS-Bridge
  description: Generate RSS and Atom feeds from websites and transform feeds for local
    readers.
  icon: Rss
  category: productivity
  requirements:
    services:
    - rss-bridge
    vram_gb: 0
  enabled_services_all:
  - rss-bridge
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: rss-bridge
    path: /

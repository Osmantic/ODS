schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: trino
  name: Trino (Federated SQL)
  description: "Query explicitly configured local data sources through one read-only SQL endpoint with native HTTPS and password authentication."
  aliases: [federated-sql]
  container_name: ods-trino
  container_uid: 1000
  default_host: trino
  # HTTPS SQL/UI is documented below; the dashboard HTTP health path is private.
  port: 0
  external_port_default: 0
  health: /v1/info
  health_port: 8080
  health_source: container
  startup_check: true
  startup_timeout: 180
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [sql, analytics, federation]
  env_vars:
    - key: TRINO_HTTPS_PORT
      description: "Native HTTPS SQL/UI host port; trust the generated certificate explicitly"
      default: "8448"
    - key: TRINO_PASSWORD_HASH
      description: "bcrypt hash for user ods, cost at least 8; htpasswd -nB -C 10 ods generates ods:HASH, supply only HASH"
      required: true
      secret: true
    - key: TRINO_INTERNAL_SECRET
      description: "Random shared secret for native coordinator/worker authentication"
      required: true
      secret: true
    - key: TRINO_TLS_PASSWORD
      description: "Stable password of at least 6 characters protecting the persisted TLS keystore"
      required: true
      secret: true

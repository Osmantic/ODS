schema_version: ods.services.v2
compatibility:
  ods_min: "2.6.0"

service:
  id: gitea
  name: Gitea (Git Hosting)
  aliases: [git]
  container_name: ods-gitea
  host_env: GITEA_HOST
  default_host: gitea
  port: 3000
  external_port_env: GITEA_PORT
  external_port_default: 7830
  health: /api/healthz
  ui_path: /
  type: docker
  version: "1.23.5"
  data_schema_version: "1"
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: "Lightweight self-hosted Git service for managing repositories and CI/CD."
  planning:
    provides: [git-hosting@1]
    requires: []
    optional: []
    conflicts: []
    provider_priority: 0
    requirements:
      platforms: [linux]
      architectures: [amd64, arm64]
      container_runtimes: [docker]
      gpu_backends: [amd, nvidia, apple, cpu, intel, sycl, jetson, none]
      min_driver_version: null
    estimates:
      download_bytes: 71144161
      disk_bytes: 1073741824
      cpu_millicores: 1000
      ram_bytes: 1073741824
      vram_bytes: 0
      gpu_count: 0
    resources:
      host_ports:
        - port: 7830
          protocol: tcp
          configuration_key: GITEA_PORT
        - port: 2222
          protocol: tcp
          configuration_key: GITEA_SSH_PORT
      container_ports: [3000, 2222]
      networks: [ods-network]
      volumes: []
      devices: []
      exclusive: []
      linux_capabilities: []
      host_permissions: [network, host-mount]
    configuration:
      - key: GITEA_HOST
        type: string
        required: false
        secret: false
        source: user
        restart_behavior: service
        validation:
          minLength: 1
          maxLength: 253
        default: localhost
      - key: GITEA_PORT
        type: integer
        required: false
        secret: false
        source: user
        restart_behavior: service
        validation:
          minimum: 1
          maximum: 65535
        default: 7830
      - key: GITEA_SSH_PORT
        type: integer
        required: false
        secret: false
        source: user
        restart_behavior: service
        validation:
          minimum: 1
          maximum: 65535
        default: 2222
      - key: GITEA_APP_NAME
        type: string
        required: false
        secret: false
        source: user
        restart_behavior: service
        validation:
          minLength: 1
          maxLength: 128
        default: "ODS Git"
    artifacts:
      images:
        - reference: gitea/gitea:1.23.5-rootless
          digest: sha256:3a335645ca700660ac6c10d6f3223b6611ed6959441f6d2f7cd5fa607baf1425
          download_bytes: 71144161
      builds: []
    lifecycle:
      health_checks: [/api/healthz]
      readiness: [healthy]
      setup_hook: null
      migration_hook: null
      rollback: definition
      timeout_seconds: 180
    data:
      - path: data/gitea
        backup_class: required
        owner: user
        uninstall: preserve
        purge: separate-approval
    trust:
      tier: bundled
      publisher: ODS
      definition_signature: null
    support:
      status: experimental
      url: null
  env_vars:
    - key: GITEA_HOST
      description: "Hostname for Gitea server"
      default: "localhost"
    - key: GITEA_PORT
      description: "External port for Gitea web interface"
      default: "7830"
    - key: GITEA_SSH_PORT
      description: "External port for Gitea SSH access"
      default: "2222"
    - key: GITEA_APP_NAME
      description: "Display name for the Gitea instance"
      default: "ODS Git"

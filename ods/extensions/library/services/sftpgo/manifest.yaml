schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: sftpgo
  name: SFTPGo
  aliases: []
  container_name: ods-sftpgo
  host_env: SFTPGO_HOST
  default_host: sftpgo
  port: 8080
  external_port_env: SFTPGO_PORT
  external_port_default: 11113
  health: /healthz
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Transfer project files through authenticated SFTP and a native web
    client with per-user directories and quotas.
  env_vars:
  - key: SFTPGO_SETUP_CODE
    required: true
    secret: true
    description: 64-hex installation code required by the native first-administrator
      setup wizard.
  - key: SFTPGO_SFTP_PORT
    required: false
    default: '11114'
    description: Loopback SFTP port for project clients.
  ui_path: /web/admin
tags:
- files
- sftp
- development
- open-source
features:
- id: sftpgo-transfer
  name: SFTPGo
  description: Transfer project files through authenticated SFTP and a native web
    client with per-user directories and quotas.
  icon: FolderSync
  category: productivity
  requirements:
    services:
    - sftpgo
    vram_gb: 0
  enabled_services_all:
  - sftpgo
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: sftpgo
    path: /web/admin

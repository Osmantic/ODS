schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: sftpgo
  name: SFTPGo
  description: "Authenticated local file exchange with per-user storage, SFTP and browser access."
  aliases: [file-transfer]
  container_name: ods-sftpgo
  container_uid: 1000
  default_host: sftpgo
  port: 8080
  external_port_env: SFTPGO_PORT
  external_port_default: 7828
  health: /healthz
  startup_timeout: 120
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [files, sftp, datasets, local, sharing]
  env_vars:
    - key: SFTPGO_PORT
      default: "7828"
      description: Published port for the SFTPGo browser interface
    - key: SFTPGO_SFTP_PORT
      default: "2022"
      description: Published port for SFTP clients
    - key: SFTPGO_ADMIN_USER
      default: admin
      description: Initial administrator username
    - key: SFTPGO_ADMIN_PASSWORD
      required: true
      secret: true
      description: Initial administrator password (existing accounts retain their password)
features:
  - id: local-file-exchange
    name: Local File Exchange
    description: "Transfer datasets and generated artifacts with separate user accounts"
    icon: FolderOpen
    category: productivity
    requirements:
      services: [sftpgo]
      vram_gb: 0
      disk_gb: 1
    enabled_services_all: [sftpgo]
    setup_time: "~2 minutes"
    priority: 34

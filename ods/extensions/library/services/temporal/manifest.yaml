schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: temporal
  name: Temporal Local
  aliases: []
  container_name: ods-temporal
  host_env: TEMPORAL_HOST
  default_host: temporal
  port: 8233
  external_port_env: TEMPORAL_PORT
  external_port_default: 11111
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Develop durable project workflows with the native local Temporal server
    and persistent execution history.
  env_vars:
  - key: TEMPORAL_GRPC_PORT
    required: false
    default: '11112'
    description: Loopback Temporal SDK/worker gRPC port.
  ui_path: /
tags:
- workflows
- automation
- development
- open-source
features:
- id: temporal-workflows
  name: Temporal Local
  description: Develop durable project workflows with the native local Temporal server
    and persistent execution history.
  icon: Workflow
  category: productivity
  requirements:
    services:
    - temporal
    vram_gb: 0
  enabled_services_all:
  - temporal
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: temporal
    path: /

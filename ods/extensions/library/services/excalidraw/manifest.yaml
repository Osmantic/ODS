schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: excalidraw
  name: Excalidraw
  aliases: []
  container_name: ods-excalidraw
  host_env: EXCALIDRAW_HOST
  default_host: excalidraw
  port: 80
  external_port_env: EXCALIDRAW_PORT
  external_port_default: 11010
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Sketch diagrams and ideas on a local browser-based whiteboard.
  env_vars: []
  ui_path: /
tags:
- productivity
- local
- open-source
features:
- id: excalidraw-workspace
  name: Excalidraw
  description: Sketch diagrams and ideas on a local browser-based whiteboard.
  icon: PenTool
  category: productivity
  requirements:
    services:
    - excalidraw
    vram_gb: 0
  enabled_services_all:
  - excalidraw
  setup_time: Initial image download; see README
  priority: 40
  launch:
    type: service
    service: excalidraw
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: bookstack
  name: BookStack
  aliases: [documentation-books]
  container_name: ods-bookstack
  host_env: BOOKSTACK_HOST
  default_host: bookstack
  port: 80
  external_port_env: BOOKSTACK_PORT
  external_port_default: 11148
  health: /status
  ui_path: /
  type: docker
  startup_check: true
  startup_timeout: 300
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  env_vars:
    - key: BOOKSTACK_APP_KEY
      required: true
      secret: true
      description: Stable Laravel encryption key, base64 followed by a colon and base64 encoding of 32 random bytes. Preserve it with backups.
      pattern: '^base64:[A-Za-z0-9+/]{43}=$'
      format_description: 'base64: followed by the base64 encoding of 32 random bytes (44 characters ending in =)'
    - key: BOOKSTACK_DB_PASSWORD
      required: true
      secret: true
      description: Dedicated database password. Use at least 24 random alphanumeric characters; preserve it after initialization.
      pattern: '^[A-Za-z0-9]+$'
      format_description: letters and digits only
      min_length: 24
      generate: password
    - key: BOOKSTACK_URL
      required: true
      secret: false
      description: Browser origin including port, normally http://localhost:11148. Changing this later requires BookStack URL migration.
      format: url
      pattern: '^https?://([A-Za-z0-9._~-]+|\[[0-9A-Fa-f:.]+\])(:[0-9]{1,5})?$'
      format_description: 'an origin only: scheme, host and optional port, no path'
  description: Structured team documentation with books, chapters, pages, role permissions and a REST API; includes a private MariaDB database.
tags: [documentation, knowledge, collaboration, open-source]
features:
  - id: bookstack-documentation
    name: Documentation books
    description: Write and organize project documentation with permissions and revision history.
    icon: BookOpen
    category: productivity
    requirements:
      services: [bookstack]
      vram_gb: 0
    enabled_services_all: [bookstack]
    setup_time: Initial image download and database migration
    priority: 48
    launch:
      type: service
      service: bookstack
      path: /

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: swagger-ui
  name: Swagger UI
  aliases: []
  container_name: ods-swagger-ui
  host_env: SWAGGER_UI_HOST
  default_host: swagger-ui
  port: 8080
  external_port_env: SWAGGER_UI_PORT
  external_port_default: 11054
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Explore a project OpenAPI specification from a browser-local JSON file
    or URL, inspect endpoints and explicitly try API requests.
  env_vars: []
  ui_path: /
tags:
- development
- api
- open-source
features:
- id: swagger-ui-api-docs
  name: Swagger UI
  description: Explore a project OpenAPI specification from a browser-local JSON file
    or URL, inspect endpoints and explicitly try API requests.
  icon: FileJson
  category: productivity
  requirements:
    services:
    - swagger-ui
    vram_gb: 0
  enabled_services_all:
  - swagger-ui
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: swagger-ui
    path: /

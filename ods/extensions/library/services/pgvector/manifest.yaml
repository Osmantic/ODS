schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: pgvector
  name: pgvector
  aliases: []
  container_name: ods-pgvector
  host_env: PGVECTOR_HOST
  default_host: pgvector
  port: 5432
  external_port_env: PGVECTOR_PORT
  external_port_default: 11098
  health: ''
  type: docker
  startup_check: false
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: PostgreSQL relational storage with native vector search and a restricted
    project account.
  env_vars:
  - key: PGVECTOR_ADMIN_PASSWORD
    required: true
    secret: true
    description: 64-hex bootstrap administrator password; existing databases require
      SQL password rotation.
  - key: PGVECTOR_APP_PASSWORD
    required: true
    secret: true
    description: Distinct 64-hex password for ods_app, used by projects and authenticated
      health checks.
  external_link: false
tags:
- database
- vector-search
- development
- open-source
features:
- id: pgvector-database
  name: pgvector
  description: PostgreSQL relational storage with native vector search and a restricted
    project account.
  icon: Database
  category: productivity
  requirements:
    services:
    - pgvector
    vram_gb: 0
  enabled_services_all:
  - pgvector
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: none

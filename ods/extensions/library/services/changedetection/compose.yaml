services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.50.39
    container_name: ods-changedetection
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      FETCH_WORKERS: "4"
    volumes:
      - ./data/changedetection:/datastore
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CHANGEDETECTION_PORT:-5555}:5555"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:5000/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [ods-network]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
networks:
  ods-network:
    external: true

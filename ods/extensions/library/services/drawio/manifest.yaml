schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: drawio
  name: draw.io
  aliases: []
  container_name: ods-drawio
  host_env: DRAWIO_HOST
  default_host: drawio
  port: 8080
  external_port_env: DRAWIO_PORT
  external_port_default: 11009
  health: /
  type: docker
  startup_check: true
  startup_timeout: 120
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Create and edit diagrams, architecture drawings and flowcharts locally.
  env_vars: []
  ui_path: /
tags:
- productivity
- local
- open-source
features:
- id: drawio-workspace
  name: draw.io
  description: Create and edit diagrams, architecture drawings and flowcharts locally.
  icon: Workflow
  category: productivity
  requirements:
    services:
    - drawio
    vram_gb: 0
  enabled_services_all:
  - drawio
  setup_time: Initial image download; see README
  priority: 39
  launch:
    type: service
    service: drawio
    path: /

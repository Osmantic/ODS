services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:1.5.0
    container_name: ods-stirling-pdf
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      SYSTEM_CONNECTIONMODE: "BROWSER_ONLY"
    volumes:
      - ./data/stirling-pdf/training:/usr/share/tessdata
      - ./data/stirling-pdf/configs:/configs
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${STIRLING_PDF_PORT:-8920}:8920"
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/api/v1/info/status || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [ods-network]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
networks:
  ods-network:
    external: true

services:
  solr:
    image: ods/solr:10.0.0-local-v1
    container_name: ods-solr
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${SOLR_PORT:-11145}:8983
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --max-time
      - '8'
      - --config
      - /tmp/ods-health-curl.conf
      - http://127.0.0.1:8983/solr/admin/info/system
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    user: 8983:8983
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,size=256m
    environment:
      SOLR_ADMIN_PASSWORD: ${SOLR_ADMIN_PASSWORD:?Set a random 64-hex Solr administrator
        password}
      SOLR_HEAP: 1g
    volumes:
    - solr-data:/var/solr
    command:
    - solr-foreground
    - --user-managed
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  solr-data: {}

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: audiobookshelf
  name: Audiobookshelf
  aliases: []
  container_name: ods-audiobookshelf
  host_env: AUDIOBOOKSHELF_HOST
  default_host: audiobookshelf
  port: 8080
  external_port_env: AUDIOBOOKSHELF_PORT
  external_port_default: 11047
  health: /healthcheck
  type: docker
  startup_check: true
  startup_timeout: 120
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Host audiobook and podcast libraries with browser playback, listening
    progress, metadata and user accounts.
  env_vars: []
  ui_path: /
tags:
- media
- local
- open-source
features:
- id: audiobookshelf-library
  name: Audiobookshelf
  description: Host audiobook and podcast libraries with browser playback, listening
    progress, metadata and user accounts.
  icon: Headphones
  category: productivity
  requirements:
    services:
    - audiobookshelf
    vram_gb: 0
  enabled_services_all:
  - audiobookshelf
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: audiobookshelf
    path: /

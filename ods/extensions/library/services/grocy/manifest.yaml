schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: grocy
  name: Grocy
  aliases: []
  container_name: ods-grocy
  host_env: GROCY_HOST
  default_host: grocy
  port: 80
  external_port_env: GROCY_PORT
  external_port_default: 11132
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Manage grocery stock, expiry dates, recipes and shopping lists with
    persistent local storage.
  env_vars:
  - key: GROCY_TZ
    required: false
    default: Etc/UTC
    description: IANA timezone used by the grocery service.
  ui_path: /
tags:
- groceries
- recipes
- shopping
- open-source
features:
- id: grocy-groceries
  name: Grocy
  description: Manage grocery stock, expiry dates, recipes and shopping lists with
    persistent local storage.
  icon: ShoppingCart
  category: productivity
  requirements:
    services:
    - grocy
    vram_gb: 0
  enabled_services_all:
  - grocy
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: grocy
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: grocy
  name: Grocy
  description: "Self-hosted web-based ERP and household inventory management tool for groceries and domestic tasks."
  aliases: [pantry, groceries, chores]
  container_name: ods-grocy
  host_env: GROCY_HOST
  default_host: grocy
  port: 80
  external_port_env: GROCY_PORT
  external_port_default: 7851
  health: /api/system/info
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [groceries, inventory, household, chores, recipes, local]
  env_vars:
    - key: GROCY_PORT
      default: "7851"
      description: Published Grocy web application port
features:
  - id: household-management
    name: Household Management
    description: "Manage household pantry inventory, chores, purchases, and equipment lifecycles"
    icon: ShoppingBag
    category: productivity
    requirements:
      services: [grocy]
      vram_gb: 0
      disk_gb: 1
    enabled_services_all: [grocy]
    setup_time: "~1 minute"
    priority: 38

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: lldap
  name: LLDAP
  aliases: []
  container_name: ods-lldap
  host_env: LLDAP_HOST
  default_host: lldap
  port: 17170
  external_port_env: LLDAP_PORT
  external_port_default: 11066
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Manage local directory users and groups through a web interface and
    LDAP bind/search.
  env_vars:
  - key: LLDAP_ADMIN_PASSWORD
    required: true
    secret: true
    description: Initial admin password, at least 12 characters. Existing passwords
      are preserved.
  - key: LLDAP_JWT_SECRET
    required: true
    secret: true
    description: Persistent random session signing secret, at least 32 characters.
  - key: LLDAP_KEY_SEED
    required: true
    secret: true
    description: Persistent random password-protection key seed, at least 32 characters.
      Back up with database.
  - key: LLDAP_BASE_DN
    required: true
    description: Directory namespace, for example dc=yourorganization,dc=internal.
  ui_path: /
tags:
- identity
- ldap
- open-source
features:
- id: lldap-directory
  name: LLDAP
  description: Manage local directory users and groups through a web interface and
    LDAP bind/search.
  icon: Users
  category: productivity
  requirements:
    services:
    - lldap
    vram_gb: 0
  enabled_services_all:
  - lldap
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: lldap
    path: /

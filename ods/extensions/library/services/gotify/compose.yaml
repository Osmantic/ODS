services:
  gotify:
    image: gotify/server:2.5.0
    container_name: ods-gotify
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      GOTIFY_DEFAULTUSER_NAME: "admin"
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS:-admin}
      GOTIFY_SERVER_PORT: 80
      GOTIFY_SERVER_SSL_ENABLED: "false"
    volumes:
      - ./data/gotify:/app/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GOTIFY_PORT:-7843}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [ods-network]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
networks:
  ods-network:
    external: true

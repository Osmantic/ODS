services:
  gotify:
    image: ods/gotify:3.1.1-local-v1
    container_name: ods-gotify
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${GOTIFY_PORT:-11073}:8080
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --max-time
      - '5'
      - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    user: 1000:1000
    environment:
      GOTIFY_SERVER_PORT: '8080'
      GOTIFY_DATABASE_DIALECT: sqlite3
      GOTIFY_DATABASE_CONNECTION: /data/gotify.db
      GOTIFY_UPLOADEDIMAGESDIR: /data/images
      GOTIFY_DEFAULTUSER_NAME: admin
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_ADMIN_PASSWORD:?Set the initial administrator
        password}
      GOTIFY_REGISTRATION: 'false'
      GOTIFY_PLUGINSDIR: ''
    volumes:
    - gotify-data:/data
    init: true
    build:
      context: .
      dockerfile: Dockerfile
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  gotify-data: {}

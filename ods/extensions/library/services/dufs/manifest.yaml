schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: dufs
  name: Dufs
  aliases: []
  container_name: ods-dufs
  host_env: DUFS_HOST
  default_host: dufs
  port: 5000
  external_port_env: DUFS_HTTP_PORT
  external_port_default: 11069
  health: /__dufs__/health
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Authenticated browser file upload/download and WebDAV access to a dedicated
    persistent directory.
  env_vars:
  - key: DUFS_PASSWORD
    required: true
    secret: true
    description: Password for ods, at least 12 bytes; exclude colon, at-sign, pipe,
      line breaks and crypt-hash prefix.
  ui_path: /
tags:
- files
- webdav
- open-source
features:
- id: dufs-files
  name: Dufs
  description: Authenticated browser file upload/download and WebDAV access to a dedicated
    persistent directory.
  icon: FolderOpen
  category: productivity
  requirements:
    services:
    - dufs
    vram_gb: 0
  enabled_services_all:
  - dufs
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: dufs
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: redis
  name: Redis (In-Memory Cache & Broker)
  description: "In-memory key-value data store, cache, and message broker for high-throughput LLM prompt caching, job queues, and agent session state."
  aliases: [cache, redis-cache, broker]
  container_name: ods-redis
  default_host: redis
  port: 6379
  external_port_env: REDIS_PORT
  external_port_default: 6380
  health: /
  ui_path: ""
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [redis, cache, broker, memory, queues, sessions]
  env_vars:
    - key: REDIS_PORT
      description: "Published Redis port on host (defaults to 6380 to prevent conflict with native Redis on 6379)"
      default: "6380"
    - key: REDIS_PASSWORD
      description: "Authentication password required for all Redis operations (auto-generated on setup)"
      required: true
      secret: true
features:
  - id: in-memory-cache
    name: Redis In-Memory Cache
    description: "Provide high-speed in-memory caching and publish-subscribe messaging for local AI pipelines"
    icon: Zap
    category: storage
    requirements:
      services: [redis]
      vram_gb: 0
    enabled_services_all: [redis]
    setup_time: "~1 minute after setting credentials"
    priority: 34
    launch:
      type: service
      service: redis

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: verdaccio
  name: Verdaccio
  aliases: []
  container_name: ods-verdaccio
  host_env: VERDACCIO_HOST
  default_host: verdaccio
  port: 4873
  external_port_env: VERDACCIO_PORT
  external_port_default: 11115
  health: /-/ping
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Publish private project npm packages and cache public dependencies
    with authenticated access.
  env_vars:
  - key: VERDACCIO_PASSWORD
    required: true
    secret: true
    description: 64-hex password for the managed ods account. Changing it and restarting
      rotates login credentials.
  ui_path: /
tags:
- packages
- npm
- development
- open-source
features:
- id: verdaccio-registry
  name: Verdaccio
  description: Publish private project npm packages and cache public dependencies
    with authenticated access.
  icon: Package
  category: productivity
  requirements:
    services:
    - verdaccio
    vram_gb: 0
  enabled_services_all:
  - verdaccio
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: verdaccio
    path: /

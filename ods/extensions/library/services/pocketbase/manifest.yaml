schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: pocketbase
  name: PocketBase
  aliases: []
  container_name: ods-pocketbase
  host_env: POCKETBASE_HOST
  default_host: pocketbase
  port: 8090
  external_port_env: POCKETBASE_PORT
  external_port_default: 11068
  health: /api/health
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Build application collections, record APIs, authentication and file
    storage on a local SQLite backend.
  env_vars: []
  ui_path: /_/
tags:
- database
- backend
- open-source
features:
- id: pocketbase-backend
  name: PocketBase
  description: Build application collections, record APIs, authentication and file
    storage on a local SQLite backend.
  icon: Database
  category: productivity
  requirements:
    services:
    - pocketbase
    vram_gb: 0
  enabled_services_all:
  - pocketbase
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: pocketbase
    path: /_/

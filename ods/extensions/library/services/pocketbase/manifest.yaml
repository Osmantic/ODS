schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: pocketbase
  name: PocketBase (Local App Backend)
  description: "Local SQLite application backend with native collection rules, account authentication and file storage."
  aliases: [app-backend]
  container_name: ods-pocketbase
  container_uid: 1000
  default_host: pocketbase
  port: 8090
  external_port_env: POCKETBASE_PORT
  external_port_default: 8090
  health: /api/health
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  setup_hook: setup.sh
  category: optional
  depends_on: []
  tags: [database, development, files]
  env_vars:
    - key: POCKETBASE_PORT
      description: "Loopback application API and admin UI port"
      default: "8090"
    - key: POCKETBASE_PASSWORD
      description: "Initial ods@localhost.invalid superuser password; 16-72 URL-safe characters"
      required: true
      secret: true
    - key: POCKETBASE_ENCRYPTION_KEY
      description: "Stable settings encryption key; exactly 32 URL-safe characters; keep with backups"
      required: true
      secret: true
features:
  - id: local-app-backend
    name: Build Local Applications
    description: "Define authenticated collections and keep application files locally"
    icon: Database
    category: productivity
    requirements:
      services: [pocketbase]
      vram_gb: 0
    enabled_services_all: [pocketbase]
    setup_time: "~2 minutes to build the pinned release"
    priority: 40
    launch:
      type: service
      service: pocketbase

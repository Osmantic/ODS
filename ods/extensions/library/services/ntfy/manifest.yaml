schema_version: ods.services.v2
compatibility:
  ods_min: "2.6.0"
service:
  id: ntfy
  name: ntfy (Local Notifications)
  description: "Authenticated local HTTP notifications for workflows and operator alerts."
  aliases: [local-notifications]
  container_name: ods-ntfy
  default_host: ntfy
  port: 8080
  external_port_env: NTFY_PORT
  external_port_default: 8097
  health: /v1/health
  ui_path: /
  type: docker
  version: "2.28.0"
  data_schema_version: "1"
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  planning:
    provides: [local-notifications@1]
    requires: []
    optional: []
    conflicts: []
    provider_priority: 0
    requirements:
      platforms: [linux]
      architectures: [amd64, arm64]
      container_runtimes: [docker]
      gpu_backends: [amd, nvidia, apple, cpu, intel, sycl, jetson, none]
      min_driver_version: null
    estimates:
      download_bytes: 36000000
      disk_bytes: 536870912
      cpu_millicores: 1000
      ram_bytes: 268435456
      vram_bytes: 0
      gpu_count: 0
    resources:
      host_ports:
        - port: 8097
          protocol: tcp
      container_ports: [8080]
      networks: [ods-network]
      volumes: []
      devices: []
      exclusive: []
      linux_capabilities: []
      host_permissions: [network, host-mount]
    configuration:
      - key: NTFY_PORT
        type: integer
        required: false
        secret: false
        source: user
        restart_behavior: service
        validation:
          minimum: 1
          maximum: 65535
        default: 8097
      - key: NTFY_BASE_URL
        type: string
        required: false
        secret: false
        source: user
        restart_behavior: service
        validation:
          minLength: 1
          maxLength: 2048
        default: "http://localhost:8097"
    artifacts:
      images:
        - reference: binwiederhier/ntfy:v2.28.0
          digest: sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
          download_bytes: 36000000
      builds: []
    lifecycle:
      health_checks: ["/v1/health"]
      readiness: [healthy]
      setup_hook: null
      migration_hook: null
      rollback: definition
      timeout_seconds: 120
    data:
      - path: data/ntfy
        backup_class: required
        owner: user
        uninstall: preserve
        purge: separate-approval
    trust:
      tier: bundled
      publisher: ODS
      definition_signature: null
    support:
      status: experimental
      url: null
  tags: [notifications, automation, local]
  env_vars:
    - key: NTFY_PORT
      description: "Published HTTP port for the ntfy web app and API"
      default: "8097"
    - key: NTFY_BASE_URL
      description: "URL used by clients; set to your protected HTTPS URL for remote access"
      default: "http://localhost:8097"
features:
  - id: local-notifications
    name: Local Notifications
    description: "Publish and read authenticated topic notifications from local workflows"
    icon: Bell
    category: productivity
    requirements:
      services: [ntfy]
      vram_gb: 0
    enabled_services_all: [ntfy]
    setup_time: "~1 minute plus account creation"
    priority: 30
    launch:
      type: service
      service: ntfy

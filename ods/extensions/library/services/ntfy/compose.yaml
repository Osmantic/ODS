services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    container_name: ods-ntfy
    command: [serve]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_BASE_URL: "${NTFY_BASE_URL:-http://localhost:8097}"
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 24h
      NTFY_UPSTREAM_BASE_URL: ""
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NTFY_PORT:-8097}:8080"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [ods-network]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

networks:
  ods-network:
    external: true

services:
  huginn:
    image: ghcr.io/huginn/huginn:latest@sha256:1da8ee6388a9ff856f96767bd14d4c2f873d18e3b6c5397b16ee348d0723bf95
    container_name: ods-huginn
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${HUGINN_PORT:-11022}:3000
    healthcheck:
      test:
      - CMD
      - ruby
      - -rnet/http
      - -e
      - 'r=Net::HTTP.get_response(URI(''http://127.0.0.1:3000/users/sign_in'')); exit(r.code.to_i.between?(200,399)
        ? 0 : 1)'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    depends_on:
      huginn-db:
        condition: service_healthy
    environment:
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: huginn-db
      DATABASE_PORT: '5432'
      DATABASE_NAME: huginn
      DATABASE_USERNAME: huginn
      DATABASE_PASSWORD: ${HUGINN_DATABASE_PASSWORD:?Set a private database password}
      DO_NOT_CREATE_DATABASE: 'true'
      APP_SECRET_TOKEN: ${HUGINN_SECRET_TOKEN:?Set a persistent random application
        secret}
      SEED_USERNAME: ${HUGINN_ADMIN_USER:-admin}
      SEED_PASSWORD: ${HUGINN_ADMIN_PASSWORD:?Set the initial owner password}
      INVITATION_CODE: ${HUGINN_INVITATION_CODE:?Set a private registration invitation
        code}
      DOMAIN: ${HUGINN_DOMAIN:-localhost:11022}
      TIMEZONE: ${HUGINN_TIMEZONE:-UTC}
      IMPORT_DEFAULT_SCENARIO_FOR_ALL_USERS: 'false'
      ENABLE_SMOKESCREEN: 'true'
  huginn-db:
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    container_name: ods-huginn-db
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - huginn
      - -d
      - huginn
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    environment:
      POSTGRES_DB: huginn
      POSTGRES_USER: huginn
      POSTGRES_PASSWORD: ${HUGINN_DATABASE_PASSWORD:?Set a private database password}
    volumes:
    - huginn-db-data:/var/lib/postgresql/data
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  huginn-db-data: {}

schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: syncthing
  name: Syncthing
  description: "Continuous folder synchronization between explicitly paired devices, with public discovery and relays off."
  aliases: [device-sync]
  container_name: ods-syncthing
  container_uid: 1000
  default_host: syncthing
  port: 8384
  external_port_env: SYNCTHING_PORT
  external_port_default: 7831
  health: /rest/noauth/health
  startup_timeout: 120
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [files, sync, datasets, local, devices]
  env_vars:
    - key: SYNCTHING_PORT
      default: "7831"
      description: Published port for the authenticated device and folder management UI
    - key: SYNCTHING_SYNC_PORT
      default: "22000"
      description: Published TCP port for explicitly paired remote devices
    - key: SYNCTHING_ADMIN_USER
      default: admin
      description: Initial GUI administrator username
    - key: SYNCTHING_ADMIN_PASSWORD
      required: true
      secret: true
      description: Initial GUI password (existing configuration remains authoritative)
features:
  - id: private-device-sync
    name: Private Device Sync
    description: "Continuously synchronize selected folders with explicitly paired devices"
    icon: FolderSync
    category: productivity
    requirements:
      services: [syncthing]
      vram_gb: 0
      disk_gb: 1
    enabled_services_all: [syncthing]
    setup_time: "~2 minutes"
    priority: 33

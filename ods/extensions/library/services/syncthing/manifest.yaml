schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: syncthing
  name: Syncthing
  aliases: []
  container_name: ods-syncthing
  host_env: SYNCTHING_HOST
  default_host: syncthing
  port: 8384
  external_port_env: SYNCTHING_PORT
  external_port_default: 11095
  health: /rest/noauth/health
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Synchronize explicitly selected folders between trusted devices using
    native encrypted Syncthing connections.
  env_vars:
  - key: SYNCTHING_GUI_PASSWORD
    required: true
    secret: true
    description: 64-hex initial password for GUI user ods; existing configured credentials
      are preserved.
  - key: SYNCTHING_SYNC_PORT
    required: false
    default: '11096'
    description: Loopback TCP synchronization listener; remote peers need deliberately
      configured reachability.
  ui_path: /
tags:
- files
- synchronization
- open-source
features:
- id: syncthing-folders
  name: Syncthing
  description: Synchronize explicitly selected folders between trusted devices using
    native encrypted Syncthing connections.
  icon: FolderSync
  category: productivity
  requirements:
    services:
    - syncthing
    vram_gb: 0
  enabled_services_all:
  - syncthing
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: syncthing
    path: /

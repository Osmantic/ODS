schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: jscad
  name: JSCAD
  aliases: []
  container_name: ods-jscad
  host_env: JSCAD_HOST
  default_host: jscad
  port: 8080
  external_port_env: JSCAD_PORT
  external_port_default: 11083
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Create parametric 2D and 3D geometry from JavaScript and export models
    for fabrication or project assets.
  env_vars: []
  ui_path: /
tags:
- 3d
- design
- open-source
features:
- id: jscad-design
  name: JSCAD
  description: Create parametric 2D and 3D geometry from JavaScript and export models
    for fabrication or project assets.
  icon: Box
  category: productivity
  requirements:
    services:
    - jscad
    vram_gb: 0
  enabled_services_all:
  - jscad
  setup_time: Initial source build; see README
  priority: 48
  launch:
    type: service
    service: jscad
    path: /

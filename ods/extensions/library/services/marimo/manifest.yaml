schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: marimo
  name: marimo
  aliases: []
  container_name: ods-marimo
  host_env: MARIMO_HOST
  default_host: marimo
  port: 8080
  external_port_env: MARIMO_PORT
  external_port_default: 11110
  health: /health
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Create reactive Python notebooks for reproducible project analysis
    and experiments.
  env_vars:
  - key: MARIMO_TOKEN
    required: true
    secret: true
    description: 64-hex editor authentication token; holders can execute notebook
      code.
  ui_path: /
tags:
- notebooks
- data-science
- development
- open-source
features:
- id: marimo-notebooks
  name: marimo
  description: Create reactive Python notebooks for reproducible project analysis
    and experiments.
  icon: NotebookPen
  category: productivity
  requirements:
    services:
    - marimo
    vram_gb: 0
  enabled_services_all:
  - marimo
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: marimo
    path: /

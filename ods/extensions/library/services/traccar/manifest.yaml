schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: traccar
  name: Traccar
  aliases: []
  container_name: ods-traccar
  host_env: TRACCAR_HOST
  default_host: traccar
  port: 8082
  external_port_env: TRACCAR_PORT
  external_port_default: 11118
  health: /api/server
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Manage explicitly enrolled GPS devices, routes and geofences with a
    private persistent tracking server.
  env_vars:
  - key: TRACCAR_DB_PASSWORD
    required: true
    secret: true
    description: 64-hex database password; existing PostgreSQL credentials require
      native rotation.
  - key: TRACCAR_DEVICE_PORT
    required: false
    default: '11119'
    description: Loopback OsmAnd protocol port; remote devices require explicit networking.
  ui_path: /
tags:
- maps
- location
- devices
- open-source
features:
- id: traccar-tracking
  name: Traccar
  description: Manage explicitly enrolled GPS devices, routes and geofences with a
    private persistent tracking server.
  icon: MapPin
  category: productivity
  requirements:
    services:
    - traccar
    vram_gb: 0
  enabled_services_all:
  - traccar
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: traccar
    path: /

services:
  wallos:
    image: ods/wallos:5.8.1-local-v1
    container_name: ods-wallos
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${WALLOS_PORT:-11094}:80
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - --max-time
      - '5'
      - http://127.0.0.1/ods-health.php
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    environment:
      TZ: ${WALLOS_TIMEZONE:-Etc/UTC}
      PUID: '82'
      PGID: '82'
      OIDC_ENABLED: 'false'
    build:
      context: .
      dockerfile: Dockerfile
    stop_grace_period: 60s
    volumes:
    - wallos-db:/var/www/html/db
    - wallos-logos:/var/www/html/images/uploads/logos
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  wallos-db: {}
  wallos-logos: {}

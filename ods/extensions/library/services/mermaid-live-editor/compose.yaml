services:
  mermaid-live-editor:
    image: ods/mermaid-live-editor:8754416-local-v1
    container_name: ods-mermaid-live-editor
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${MERMAID_LIVE_EDITOR_PORT:-11071}:8080
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - -T
      - '5'
      - http://127.0.0.1:8080/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    user: 101:101
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - -g
    - daemon off;
    entrypoint:
    - nginx
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
networks:
  ods-network:
    external: true
    name: ods-network

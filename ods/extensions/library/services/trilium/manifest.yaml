schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: trilium
  name: Trilium Notes
  aliases: []
  container_name: ods-trilium
  host_env: TRILIUM_HOST
  default_host: trilium
  port: 8080
  external_port_env: TRILIUM_PORT
  external_port_default: 11037
  health: /api/health-check
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Maintain a local hierarchical knowledge base with linked notes, attachments,
    project documentation and optional scripting.
  env_vars: []
  ui_path: /
tags:
- knowledge
- local
- open-source
features:
- id: trilium-workspace
  name: Trilium Notes
  description: Maintain a local hierarchical knowledge base with linked notes, attachments,
    project documentation and optional scripting.
  icon: Notebook
  category: productivity
  requirements:
    services:
    - trilium
    vram_gb: 0
  enabled_services_all:
  - trilium
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: trilium
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: rabbitmq
  name: RabbitMQ
  aliases: []
  container_name: ods-rabbitmq
  host_env: RABBITMQ_HOST
  default_host: rabbitmq
  port: 15672
  external_port_env: RABBITMQ_PORT
  external_port_default: 11105
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Authenticated message queues and management for explicitly connected
    project workers.
  env_vars:
  - key: RABBITMQ_ADMIN_PASSWORD
    required: true
    secret: true
    description: 64-hex initial ods_admin password; existing accounts are preserved.
  - key: RABBITMQ_NODE_SECRET
    required: true
    secret: true
    description: Distinct stable 64-hex Erlang node/CLI cookie, preserved with backups.
  - key: RABBITMQ_AMQP_PORT
    required: false
    default: '11106'
    description: Loopback AMQP client listener.
  ui_path: /
tags:
- queues
- automation
- development
- open-source
features:
- id: rabbitmq-queues
  name: RabbitMQ
  description: Authenticated message queues and management for explicitly connected
    project workers.
  icon: Network
  category: productivity
  requirements:
    services:
    - rabbitmq
    vram_gb: 0
  enabled_services_all:
  - rabbitmq
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: rabbitmq
    path: /

services:
  netdata:
    image: netdata/netdata:v2.7.3
    container_name: ods-netdata
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cap_add: [SYS_PTRACE, SYS_ADMIN]
    volumes:
      - ./data/netdata:/etc/netdata
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NETDATA_PORT:-19999}:19999"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:19999/api/v3/info || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [ods-network]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
networks:
  ods-network:
    external: true

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: backrest
  name: Backrest
  aliases: []
  container_name: ods-backrest
  host_env: BACKREST_HOST
  default_host: backrest
  port: 9898
  external_port_env: BACKREST_PORT
  external_port_default: 11108
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Manage explicit Restic project backup plans, inspect snapshots and
    restore selected files.
  env_vars: []
  ui_path: /
tags:
- backup
- files
- recovery
- open-source
features:
- id: backrest-backups
  name: Backrest
  description: Manage explicit Restic project backup plans, inspect snapshots and
    restore selected files.
  icon: ArchiveRestore
  category: productivity
  requirements:
    services:
    - backrest
    vram_gb: 0
  enabled_services_all:
  - backrest
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: backrest
    path: /

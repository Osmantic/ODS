schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: wiremock
  name: WireMock (Local API Fixtures)
  description: "Reproduce HTTP responses and failure cases locally with persistent fixtures and authenticated administration."
  aliases: [api-fixtures]
  container_name: ods-wiremock
  container_uid: 1000
  default_host: wiremock
  port: 8080
  external_port_env: WIREMOCK_PORT
  external_port_default: 8099
  health: /__ods_status.json
  ui_path: /__admin/docs
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [testing, development, automation]
  env_vars:
    - key: WIREMOCK_PORT
      description: "Local HTTP fixture and administration port"
      default: "8099"
    - key: WIREMOCK_PASSWORD
      description: "WireMock ods administrator password; changes apply after recreation"
      required: true
      secret: true
features:
  - id: local-http-fixtures
    name: Local API Fixtures
    description: "Test workflow HTTP integrations against repeatable responses and simulated failures"
    icon: FlaskConical
    category: automation
    requirements:
      services: [wiremock]
      vram_gb: 0
    enabled_services_all: [wiremock]
    setup_time: "~1 minute"
    priority: 40
    launch:
      type: service
      service: wiremock
      path: /__admin/docs

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: m3e-canvas
  name: M3E Canvas
  aliases: []
  container_name: ods-m3e-canvas
  host_env: M3E_CANVAS_HOST
  default_host: m3e-canvas
  port: 8080
  external_port_env: M3E_CANVAS_PORT
  external_port_default: 11074
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Sketch interactive Material 3 screens, export design documents and
    PNGs, and hand design briefs to the Portal project.
  env_vars: []
  ui_path: /
tags:
- design
- prototyping
- material-design
- open-source
features:
- id: m3e-canvas-design
  name: M3E Canvas
  description: Sketch interactive Material 3 screens, export design documents and
    PNGs, and hand design briefs to the Portal project.
  icon: Palette
  category: productivity
  requirements:
    services:
    - m3e-canvas
    vram_gb: 0
  enabled_services_all:
  - m3e-canvas
  setup_time: Initial source build; see README
  priority: 48
  launch:
    type: service
    service: m3e-canvas
    path: /

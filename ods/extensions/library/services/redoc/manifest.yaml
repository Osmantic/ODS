schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: redoc
  name: ReDoc
  aliases: []
  container_name: ods-redoc
  host_env: REDOC_HOST
  default_host: redoc
  port: 8080
  external_port_env: REDOC_PORT
  external_port_default: 11062
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Read OpenAPI documentation with navigable operations, schemas and code
    samples from your own specification.
  env_vars: []
  ui_path: /
tags:
- api
- documentation
- open-source
features:
- id: redoc-documentation
  name: ReDoc
  description: Read OpenAPI documentation with navigable operations, schemas and code
    samples from your own specification.
  icon: BookOpen
  category: productivity
  requirements:
    services:
    - redoc
    vram_gb: 0
  enabled_services_all:
  - redoc
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: redoc
    path: /

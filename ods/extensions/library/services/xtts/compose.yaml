services:
  xtts:
    image: daswer123/xtts-api-server@sha256:491e0a198fc56c46d3dbb300ab993d29cc699813ea8fd1c6ee77aa80ab133e3e
    container_name: ods-xtts
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${XTTS_PORT:-8100}:80"
    volumes:
      - ./data/xtts:/app/tts_models
    environment:
      - COQUI_TOS_AGREED=${COQUI_TOS_AGREED:?Review XTTS model terms in NOTICE.md and explicitly set COQUI_TOS_AGREED=1 only if you agree}
      - PORT=80
    # The pinned image's default command pipes "y" into the model downloader.
    # Replace that command while preserving its NVIDIA entrypoint.
    command:
      - /bin/sh
      - -c
      - |
        if [ "$${COQUI_TOS_AGREED:-}" != "1" ]; then
          printf '%s\n' 'XTTS requires explicit acceptance: review the model terms in the recipe NOTICE.md, then set COQUI_TOS_AGREED=1.' >&2
          exit 78
        fi
        exec python3 -m xtts_api_server -hs 0.0.0.0 \
          -sf "$${EXAMPLE_FOLDER:-/app/example}" \
          -t "$${TUNNEL:-http://localhost:80}" \
          -p "$${PORT:-80}" -ms "$${MODEL_SOURCE:-apiManual}" </dev/null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ods-network

networks:
  ods-network:
    external: true
    name: ods-network

services:
  nodered:
    image: nodered/node-red:5.0.7@sha256:a649dd711d55490151a2c39a8e48ad0c44325488fbc0e66315f2d2e19e5e1ace
    container_name: ods-nodered
    user: "1000:1000"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [node, node_modules/node-red/red.js, --userDir, /data, --settings, /etc/ods-nodered/settings.js, --no-telemetry]
    environment:
      NODERED_ADMIN_HASH: "${NODERED_ADMIN_HASH:?Set NODERED_ADMIN_HASH before enabling Node-RED}"
      NODERED_HTTP_HASH: "${NODERED_HTTP_HASH:?Set NODERED_HTTP_HASH before enabling Node-RED}"
      NODERED_CREDENTIAL_SECRET: "${NODERED_CREDENTIAL_SECRET:?Set NODERED_CREDENTIAL_SECRET before enabling Node-RED}"
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NODERED_PORT:-1880}:1880"
    volumes:
      - ./data/nodered:/data
      - ./extensions/library/services/nodered/settings.js:/etc/ods-nodered/settings.js:ro
      - ./extensions/library/services/nodered/healthcheck.js:/etc/ods-nodered/healthcheck.js:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, node, /etc/ods-nodered/healthcheck.js]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [ods-network]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
networks:
  ods-network:
    external: true

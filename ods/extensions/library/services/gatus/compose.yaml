services:
  gatus:
    image: ods/gatus:5.36.0-local-v1
    container_name: ods-gatus
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${GATUS_PORT:-11064}:8080
    healthcheck:
      test:
      - CMD
      - /ods-launcher
      - health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    user: 65532:65532
    build:
      context: .
      dockerfile: Dockerfile
    command: []
    entrypoint:
    - /ods-launcher
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    init: true
    environment:
      GATUS_ENDPOINT: ${GATUS_ENDPOINT:?Choose the HTTP endpoint to monitor}
    volumes:
    - gatus-data:/data
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  gatus-data: {}

services:
  nocodb:
    image: nginxinc/nginx-unprivileged:1.30.1-alpine@sha256:acc3239879a65d9e3d250b21847ec3f34f33367017394d22830242af15cf1cb0
    container_name: ods-nocodb
    user: 101:101
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    entrypoint:
    - nginx
    - -g
    - daemon off;
    tmpfs:
    - /tmp:size=64m,uid=101,gid=101,mode=0700
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${NOCODB_PORT:-8087}:8080
    volumes:
    - ./extensions/library/services/nocodb/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
    - ods-network
    - nocodb-private
    depends_on:
      nocodb-app:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
  nocodb-app:
    image: nocodb/nocodb:2026.09.0@sha256:4ccfc5114506b1725ffc63be56445fc6fe453a6e6d5cb56eb5f88f0540d4e56e
    container_name: ods-nocodb-app
    user: 1000:1000
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    entrypoint:
    - /usr/bin/dumb-init
    - --
    - node
    - --import
    - /etc/ods-nocodb/configure.mjs
    - docker/index.js
    tmpfs:
    - /tmp:size=256m,mode=1777
    environment:
      NC_ADMIN_EMAIL: admin@ods.local
      NC_ADMIN_PASSWORD: ${NOCODB_ADMIN_PASSWORD:?Set NOCODB_ADMIN_PASSWORD before
        enabling NocoDB}
      NOCODB_DB_PASSWORD: ${NOCODB_DB_PASSWORD:?Set NOCODB_DB_PASSWORD before enabling
        NocoDB}
      NC_AUTH_JWT_SECRET: ${NOCODB_JWT_SECRET:?Set NOCODB_JWT_SECRET before enabling
        NocoDB}
      NC_CONNECTION_ENCRYPT_KEY: ${NOCODB_CONNECTION_KEY:?Set NOCODB_CONNECTION_KEY
        before enabling NocoDB}
      NC_SITE_URL: ${NOCODB_SITE_URL:-http://localhost:${NOCODB_PORT:-8087}}
      NC_TOOL_DIR: /usr/app/data/
      NC_DISABLE_TELE: 'true'
      NC_DISABLE_ERR_REPORTS: 'true'
      NC_DISABLE_PRODUCT_FEED: 'true'
      NODE_OPTIONS: --max-old-space-size=1024
      PORT: '8080'
    volumes:
    - ./extensions/library/services/nocodb/configure.mjs:/etc/ods-nocodb/configure.mjs:ro
    - ./data/nocodb/files:/usr/app/data
    depends_on:
      nocodb-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --output
      - /dev/null
      - http://127.0.0.1:8080/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
    - nocodb-private
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  nocodb-db:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: ods-nocodb-db
    user: 70:70
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=32m,mode=1777
    - /var/run/postgresql:uid=70,gid=70,mode=0770
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${NOCODB_DB_PASSWORD:?Set NOCODB_DB_PASSWORD before enabling
        Metabase}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
    - ./data/nocodb/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - nocodb
      - -d
      - nocodb
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - nocodb-private
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
networks:
  ods-network:
    external: true
  nocodb-private:
    internal: true

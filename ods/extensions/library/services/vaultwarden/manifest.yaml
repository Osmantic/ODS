schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: vaultwarden
  name: Vaultwarden
  aliases: []
  container_name: ods-vaultwarden
  host_env: VAULTWARDEN_HOST
  default_host: vaultwarden
  port: 8000
  external_port_env: VAULTWARDEN_PORT
  external_port_default: 11124
  health: /alive
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Self-host a Bitwarden-compatible encrypted vault for passwords and
    secure notes.
  env_vars:
  - key: VAULTWARDEN_ADMIN_TOKEN
    required: true
    secret: true
    description: Random 64-hex administrator access token, separate from the vault
      master password.
  ui_path: /
tags:
- passwords
- security
- productivity
- open-source
features:
- id: vaultwarden-vault
  name: Vaultwarden
  description: Self-host a Bitwarden-compatible encrypted vault for passwords and
    secure notes.
  icon: KeyRound
  category: productivity
  requirements:
    services:
    - vaultwarden
    vram_gb: 0
  enabled_services_all:
  - vaultwarden
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: vaultwarden
    path: /

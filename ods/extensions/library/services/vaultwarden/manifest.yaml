schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: vaultwarden
  name: Vaultwarden
  description: "Self-hosted Bitwarden-compatible password vault server written in Rust for private credential management."
  aliases: [bitwarden, passwords]
  container_name: ods-vaultwarden
  host_env: VAULTWARDEN_HOST
  default_host: vaultwarden
  port: 80
  external_port_env: VAULTWARDEN_PORT
  external_port_default: 7840
  health: /alive
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [security, passwords, encryption, privacy, local]
  env_vars:
    - key: VAULTWARDEN_PORT
      default: "7840"
      description: Published Vaultwarden web vault and API port
    - key: SIGNUPS_ALLOWED
      default: "false"
      description: Whether new user registrations are permitted (default false for security)
features:
  - id: password-vault
    name: Password Vault
    description: "Store passwords, notes, and identity cards in an encrypted private vault"
    icon: Shield
    category: security
    requirements:
      services: [vaultwarden]
      vram_gb: 0
      disk_gb: 1
    enabled_services_all: [vaultwarden]
    setup_time: "~1 minute"
    priority: 34

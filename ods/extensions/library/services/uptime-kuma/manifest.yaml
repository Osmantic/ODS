schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: uptime-kuma
  name: Uptime Kuma
  aliases: []
  container_name: ods-uptime-kuma
  host_env: UPTIME_KUMA_HOST
  default_host: uptime-kuma
  port: 3001
  external_port_env: UPTIME_KUMA_PORT
  external_port_default: 11027
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Monitor local services and websites, retain uptime history and configure
    explicit notifications and status pages.
  env_vars: []
  ui_path: /
tags:
- monitoring
- local
- open-source
features:
- id: uptime-kuma-workspace
  name: Uptime Kuma
  description: Monitor local services and websites, retain uptime history and configure
    explicit notifications and status pages.
  icon: Activity
  category: productivity
  requirements:
    services:
    - uptime-kuma
    vram_gb: 0
  enabled_services_all:
  - uptime-kuma
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: uptime-kuma
    path: /

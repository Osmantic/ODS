schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: clickhouse
  name: ClickHouse
  aliases: []
  container_name: ods-clickhouse
  host_env: CLICKHOUSE_HOST
  default_host: clickhouse
  port: 8123
  external_port_env: CLICKHOUSE_PORT
  external_port_default: 11036
  health: /ping
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Store project event data and execute analytical SQL queries with persistent
    columnar storage. Requires supported CPU instructions.
  env_vars:
  - key: CLICKHOUSE_PASSWORD
    required: true
    secret: true
    description: Strong password for the local ods database user. Keep with configuration
      backups.
  external_link: false
tags:
- analytics
- database
- local
- open-source
features:
- id: clickhouse-api
  name: ClickHouse SQL
  description: Store project event data and execute analytical SQL queries with persistent
    columnar storage. Requires supported CPU instructions.
  icon: Database
  category: productivity
  requirements:
    services:
    - clickhouse
    vram_gb: 0
  enabled_services_all:
  - clickhouse
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: none

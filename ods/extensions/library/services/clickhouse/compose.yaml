services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.9.10@sha256:85ddbad63bd6779d4b3c64af17a0720c85e9dc6e5fa636f80bfdbb6096bdc5ab
    container_name: ods-clickhouse
    restart: unless-stopped
    ports:
    - 127.0.0.1:${CLICKHOUSE_PORT:-11036}:8123
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --spider
      - http://127.0.0.1:8123/ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    environment:
      CLICKHOUSE_USER: ods
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set a strong database password}
      CLICKHOUSE_DB: ods
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
    - clickhouse-data:/var/lib/clickhouse
    - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  clickhouse-data: {}
  clickhouse-logs: {}

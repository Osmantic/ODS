services:
  orthanc:
    image: ods/orthanc:26.9-local-v1
    container_name: ods-orthanc
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${ORTHANC_PORT:-11143}:8042
    healthcheck:
      test:
      - CMD
      - python3
      - /probes/test-aliveness.py
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    user: 999:999
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    environment:
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?Set a random 64-hex Orthanc password}
      ORTHANC_EXPLORER_2_PLUGIN_ENABLED: 'true'
      STONE_WEB_VIEWER_PLUGIN_ENABLED: 'true'
      DICOM_WEB_PLUGIN_ENABLED: 'true'
      VERBOSE_STARTUP: 'false'
    volumes:
    - orthanc-data:/var/lib/orthanc/db
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  orthanc-data: {}

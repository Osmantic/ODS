schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: chartdb
  name: ChartDB
  aliases: []
  container_name: ods-chartdb
  host_env: CHARTDB_HOST
  default_host: chartdb
  port: 8080
  external_port_env: CHARTDB_PORT
  external_port_default: 11042
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Design database diagrams and import schema metadata locally, with browser
    storage and exportable project files.
  env_vars: []
  ui_path: /
tags:
- development
- database
- open-source
features:
- id: chartdb-workspace
  name: ChartDB
  description: Design database diagrams and import schema metadata locally, with browser
    storage and exportable project files.
  icon: Database
  category: productivity
  requirements:
    services:
    - chartdb
    vram_gb: 0
  enabled_services_all:
  - chartdb
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: chartdb
    path: /

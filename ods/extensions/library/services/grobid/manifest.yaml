schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: grobid
  name: GROBID
  aliases: []
  container_name: ods-grobid
  host_env: GROBID_HOST
  default_host: grobid
  port: 8070
  external_port_env: GROBID_PORT
  external_port_default: 11012
  health: /api/isalive
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Extract citations, authors and structured TEI content from scientific
    PDF papers.
  env_vars: []
  ui_path: /
tags:
- documents
- local
- open-source
features:
- id: grobid-workspace
  name: GROBID
  description: Extract citations, authors and structured TEI content from scientific
    PDF papers.
  icon: BookOpen
  category: documents
  requirements:
    services:
    - grobid
    vram_gb: 0
  enabled_services_all:
  - grobid
  setup_time: Initial image download; see README
  priority: 42
  launch:
    type: service
    service: grobid
    path: /

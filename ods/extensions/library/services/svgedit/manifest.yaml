schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: svgedit
  name: SVG-Edit
  aliases: []
  container_name: ods-svgedit
  host_env: SVGEDIT_HOST
  default_host: svgedit
  port: 8080
  external_port_env: SVGEDIT_PORT
  external_port_default: 11077
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Draw and edit SVG paths, shapes, text and layers, then export vector
    assets for websites, diagrams and project illustrations.
  env_vars: []
  ui_path: /
tags:
- svg
- vector
- illustration
- open-source
features:
- id: svgedit-vector
  name: SVG-Edit
  description: Draw and edit SVG paths, shapes, text and layers, then export vector
    assets for websites, diagrams and project illustrations.
  icon: PenTool
  category: productivity
  requirements:
    services:
    - svgedit
    vram_gb: 0
  enabled_services_all:
  - svgedit
  setup_time: Initial source build; see README
  priority: 48
  launch:
    type: service
    service: svgedit
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: microbin
  name: MicroBin
  aliases: []
  container_name: ods-microbin
  host_env: MICROBIN_HOST
  default_host: microbin
  port: 8080
  external_port_env: MICROBIN_PORT
  external_port_default: 11051
  health: /_ods/health
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Share text snippets and attachments through an authenticated local
    paste service with expiration and optional per-item protection.
  env_vars:
  - key: MICROBIN_ACCESS_PASSWORD
    required: true
    secret: true
    description: Password for site-wide HTTP Basic login, username ods.
  - key: MICROBIN_ADMIN_PASSWORD
    required: true
    secret: true
    description: Separate administrator password; replaces the upstream default.
  ui_path: /
tags:
- sharing
- development
- open-source
features:
- id: microbin-pastes
  name: MicroBin
  description: Share text snippets and attachments through an authenticated local
    paste service with expiration and optional per-item protection.
  icon: Clipboard
  category: productivity
  requirements:
    services:
    - microbin
    vram_gb: 0
  enabled_services_all:
  - microbin
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: microbin
    path: /

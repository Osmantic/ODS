schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: meilisearch
  name: Meilisearch Community
  aliases: []
  container_name: ods-meilisearch
  host_env: MEILISEARCH_HOST
  default_host: meilisearch
  port: 7700
  external_port_env: MEILISEARCH_PORT
  external_port_default: 11013
  health: /health
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Local full-text and hybrid search engine with typo tolerance and an
    authenticated API.
  env_vars:
  - key: MEILISEARCH_MASTER_KEY
    required: true
    secret: true
    description: Search API master key, at least 16 characters.
  external_link: false
tags:
- data
- local
- open-source
features:
- id: meilisearch-workspace
  name: Meilisearch Community
  description: Local full-text and hybrid search engine with typo tolerance and an
    authenticated API.
  icon: Search
  category: data
  requirements:
    services:
    - meilisearch
    vram_gb: 0
  enabled_services_all:
  - meilisearch
  setup_time: Initial image download; see README
  priority: 43
  launch:
    type: none

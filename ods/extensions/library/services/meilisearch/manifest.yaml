schema_version: ods.services.v1

service:
  id: meilisearch
  name: Meilisearch
  aliases: [meili, search]
  container_name: ods-meilisearch
  host_env: MEILISEARCH_HOST
  default_host: meilisearch
  port: 7700
  external_port_env: MEILISEARCH_PORT
  external_port_default: 7700
  health: /health
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  setup_hook: setup.sh
  env_vars:
    - key: MEILI_MASTER_KEY
      required: true
      secret: true
      description: "Master API key for authenticating Meilisearch requests (auto-generated by setup.sh)"
    - key: MEILI_ENV
      required: false
      secret: false
      description: "Execution environment (production enforces master key authentication)"
  description: |
    Meilisearch is an ultra-fast, open-source, typo-tolerant full-text and hybrid search engine.
    Supports BM25 keyword matching, vector embeddings search, instant filtering, and faceted navigation.
    Integrates with local AI agents and RAG pipelines for real-time document search.

  tags:
    - search-engine
    - full-text-search
    - hybrid-search
    - vector-search
    - typo-tolerance
    - open-source
    - local

features:
  - id: fulltext-search
    name: Typo-Tolerant Search
    description: Ultra-fast full-text search with typo tolerance and instant prefix matching
    icon: Search
    category: data
    requirements:
      services: [meilisearch]
      vram_gb: 0
    enabled_services_all: [meilisearch]
    setup_time: ~1 minute
    priority: 19
  - id: hybrid-search
    name: Hybrid Search
    description: Combine semantic vector similarity with traditional BM25 keyword relevance
    icon: Filter
    category: data
    requirements:
      services: [meilisearch]
      vram_gb: 0
    enabled_services_all: [meilisearch]
    setup_time: ~1 minute
    priority: 20
  - id: faceted-search
    name: Faceted Navigation
    description: Dynamic filtering and attribute aggregation across document collections
    icon: List
    category: data
    requirements:
      services: [meilisearch]
      vram_gb: 0
    enabled_services_all: [meilisearch]
    setup_time: ~1 minute
    priority: 21

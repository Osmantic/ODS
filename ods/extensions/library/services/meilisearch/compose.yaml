services:
  meilisearch:
    image: getmeili/meilisearch:v1.53.2@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
    container_name: ods-meilisearch
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${MEILISEARCH_PORT:-11013}:7700
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:7700/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    volumes:
    - meilisearch-data:/meili_data
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?Set MEILISEARCH_MASTER_KEY (at least
        16 characters)}
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  meilisearch-data: {}

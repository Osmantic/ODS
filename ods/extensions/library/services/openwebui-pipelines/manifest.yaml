schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: openwebui-pipelines
  name: Open WebUI Pipelines
  aliases: []
  container_name: ods-openwebui-pipelines
  host_env: OPENWEBUI_PIPELINES_HOST
  default_host: openwebui-pipelines
  port: 9099
  external_port_env: OPENWEBUI_PIPELINES_PORT
  external_port_default: 11109
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Run explicitly installed Python pipelines behind an authenticated OpenAI-compatible
    API.
  env_vars:
  - key: OPENWEBUI_PIPELINES_API_KEY
    required: true
    secret: true
    description: 64-hex management/client API key replacing the upstream shared default.
  external_link: false
tags:
- ai
- pipelines
- development
- open-source
features:
- id: openwebui-pipelines-api
  name: Open WebUI Pipelines
  description: Run explicitly installed Python pipelines behind an authenticated OpenAI-compatible
    API.
  icon: Workflow
  category: productivity
  requirements:
    services:
    - openwebui-pipelines
    vram_gb: 0
  enabled_services_all:
  - openwebui-pipelines
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: none

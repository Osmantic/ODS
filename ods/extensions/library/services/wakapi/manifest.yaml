schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: wakapi
  name: Wakapi
  aliases: []
  container_name: ods-wakapi
  host_env: WAKAPI_HOST
  default_host: wakapi
  port: 3000
  external_port_env: WAKAPI_PORT
  external_port_default: 11050
  health: /api/health
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Receive opt-in editor activity heartbeats and inspect programming time
    by project, language and editor in a self-hosted dashboard.
  env_vars:
  - key: WAKAPI_PASSWORD_SALT
    required: true
    secret: true
    description: Persistent random password pepper, at least 32 random characters.
      Back up and do not rotate casually.
  - key: WAKAPI_ALLOW_SIGNUP
    required: false
    default: 'true'
    description: Allow account creation during local setup; set false after creating
      desired accounts.
  ui_path: /
tags:
- development
- analytics
- open-source
features:
- id: wakapi-activity
  name: Wakapi
  description: Receive opt-in editor activity heartbeats and inspect programming time
    by project, language and editor in a self-hosted dashboard.
  icon: ChartNoAxesCombined
  category: productivity
  requirements:
    services:
    - wakapi
    vram_gb: 0
  enabled_services_all:
  - wakapi
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: wakapi
    path: /

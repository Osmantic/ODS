schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: optuna-dashboard
  name: Optuna Dashboard
  aliases: []
  container_name: ods-optuna-dashboard
  host_env: OPTUNA_DASHBOARD_HOST
  default_host: optuna-dashboard
  port: 8080
  external_port_env: OPTUNA_DASHBOARD_PORT
  external_port_default: 11034
  health: /api/studies
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Inspect persistent optimization studies, trial histories and parameter
    relationships from local Optuna experiments.
  env_vars: []
  ui_path: /
tags:
- experiments
- local
- open-source
features:
- id: optuna-dashboard-workspace
  name: Optuna Dashboard
  description: Inspect persistent optimization studies, trial histories and parameter
    relationships from local Optuna experiments.
  icon: ChartScatter
  category: productivity
  requirements:
    services:
    - optuna-dashboard
    vram_gb: 0
  enabled_services_all:
  - optuna-dashboard
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: optuna-dashboard
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: blockbench
  name: Blockbench
  aliases: []
  container_name: ods-blockbench
  host_env: BLOCKBENCH_HOST
  default_host: blockbench
  port: 8080
  external_port_env: BLOCKBENCH_PORT
  external_port_default: 11076
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Create low-poly 3D models, pixel-art textures and animations in the
    browser, then export editable projects and game assets.
  env_vars: []
  ui_path: /
tags:
- 3d
- modeling
- animation
- game-development
- open-source
features:
- id: blockbench-modeling
  name: Blockbench
  description: Create low-poly 3D models, pixel-art textures and animations in the
    browser, then export editable projects and game assets.
  icon: Box
  category: productivity
  requirements:
    services:
    - blockbench
    vram_gb: 0
  enabled_services_all:
  - blockbench
  setup_time: Initial source build; see README
  priority: 48
  launch:
    type: service
    service: blockbench
    path: /

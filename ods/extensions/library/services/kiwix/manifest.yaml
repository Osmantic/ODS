schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: kiwix
  name: Kiwix
  aliases: []
  container_name: ods-kiwix
  host_env: KIWIX_HOST
  default_host: kiwix
  port: 8080
  external_port_env: KIWIX_PORT
  external_port_default: 11099
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Read and search an offline library of explicitly imported ZIM reference
    archives.
  env_vars: []
  ui_path: /
tags:
- knowledge
- offline
- reference
- open-source
features:
- id: kiwix-library
  name: Kiwix
  description: Read and search an offline library of explicitly imported ZIM reference
    archives.
  icon: Library
  category: productivity
  requirements:
    services:
    - kiwix
    vram_gb: 0
  enabled_services_all:
  - kiwix
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: kiwix
    path: /

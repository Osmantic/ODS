schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: wallabag
  name: Wallabag
  aliases: []
  container_name: ods-wallabag
  host_env: WALLABAG_HOST
  default_host: wallabag
  port: 80
  external_port_env: WALLABAG_PORT
  external_port_default: 11060
  health: /api/info
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Save web articles for later reading, tagging, annotation and export.
  env_vars:
  - key: WALLABAG_SECRET
    required: true
    secret: true
    description: Persistent 64-character hexadecimal signing secret.
  - key: WALLABAG_INITIAL_PASSWORD
    required: true
    secret: true
    description: Initial ods administrator password, at least 12 characters; existing
      accounts are not reset.
  - key: WALLABAG_INITIAL_EMAIL
    required: true
    description: Email address for the initial ods administrator.
  ui_path: /
tags:
- reading
- articles
- open-source
features:
- id: wallabag-reader
  name: Wallabag
  description: Save web articles for later reading, tagging, annotation and export.
  icon: FileText
  category: productivity
  requirements:
    services:
    - wallabag
    vram_gb: 0
  enabled_services_all:
  - wallabag
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: wallabag
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: node-red
  name: Node-RED
  aliases: []
  container_name: ods-node-red
  host_env: NODE_RED_HOST
  default_host: node-red
  port: 1880
  external_port_env: NODE_RED_PORT
  external_port_default: 11088
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Build event-driven visual flows for MQTT, HTTP APIs and explicit project
    automation.
  env_vars:
  - key: NODE_RED_ADMIN_PASSWORD
    required: true
    secret: true
    description: Editor and HTTP-flow password for user ods; 16 to 72 UTF-8 bytes.
  - key: NODE_RED_CREDENTIAL_SECRET
    required: true
    secret: true
    description: Stable 64-hex encryption key; retain with backups to decrypt flow
      credentials.
  ui_path: /
tags:
- automation
- mqtt
- development
- open-source
features:
- id: node-red-flows
  name: Node-RED
  description: Build event-driven visual flows for MQTT, HTTP APIs and explicit project
    automation.
  icon: Workflow
  category: productivity
  requirements:
    services:
    - node-red
    vram_gb: 0
  enabled_services_all:
  - node-red
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: node-red
    path: /

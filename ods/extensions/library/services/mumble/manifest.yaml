schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: mumble
  name: Mumble Server
  aliases: []
  container_name: ods-mumble
  host_env: MUMBLE_HOST
  default_host: mumble
  port: 64738
  external_port_env: MUMBLE_PORT
  external_port_default: 11131
  health: ''
  type: docker
  startup_check: false
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Host low-latency voice rooms with native Mumble clients, channel permissions
    and persistent accounts.
  env_vars:
  - key: MUMBLE_SERVER_PASSWORD
    required: true
    secret: true
    description: Random 64-hex shared connection password.
  - key: MUMBLE_SUPERUSER_PASSWORD
    required: true
    secret: true
    description: Distinct random 64-hex SuperUser password, reapplied at startup.
  external_link: false
tags:
- voice
- collaboration
- open-source
features:
- id: mumble-voice
  name: Mumble Voice
  description: Host low-latency voice rooms with native Mumble clients, channel permissions
    and persistent accounts.
  icon: Mic
  category: productivity
  requirements:
    services:
    - mumble
    vram_gb: 0
  enabled_services_all:
  - mumble
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: none

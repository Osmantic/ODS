services:
  crawl4ai:
    image: unclecode/crawl4ai:0.9.3@sha256:84751dab794259db05d5bd4e5c766a8041a65f0554326e4516e620abdf2fa18b
    container_name: ods-crawl4ai
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${CRAWL4AI_PORT:-11002}:11235
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:11235/health',
        timeout=8).read()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    shm_size: 1gb
networks:
  ods-network:
    external: true
    name: ods-network

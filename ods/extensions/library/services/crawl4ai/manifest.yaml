schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: crawl4ai
  name: Crawl4AI
  aliases: []
  container_name: ods-crawl4ai
  host_env: CRAWL4AI_HOST
  default_host: crawl4ai
  port: 11235
  external_port_env: CRAWL4AI_PORT
  external_port_default: 11002
  health: /health
  type: docker
  startup_check: true
  startup_timeout: 120
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Read websites and export clean Markdown or structured data with a local
    browser and API.
  env_vars: []
  ui_path: /playground
tags:
- research
- local
- open-source
features:
- id: crawl4ai-workspace
  name: Crawl4AI
  description: Read websites and export clean Markdown or structured data with a local
    browser and API.
  icon: Globe
  category: research
  requirements:
    services:
    - crawl4ai
    vram_gb: 0
  enabled_services_all:
  - crawl4ai
  setup_time: Initial image download; see README
  priority: 32
  launch:
    type: service
    service: crawl4ai
    path: /playground

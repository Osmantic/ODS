schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: swagger-editor
  name: Swagger Editor
  aliases: []
  container_name: ods-swagger-editor
  host_env: SWAGGER_EDITOR_HOST
  default_host: swagger-editor
  port: 8080
  external_port_env: SWAGGER_EDITOR_PORT
  external_port_default: 11137
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Author and validate OpenAPI definitions with live documentation preview
    in the browser.
  env_vars: []
  ui_path: /
tags:
- openapi
- api-design
- development
- open-source
features:
- id: swagger-editor-design
  name: Swagger Editor
  description: Author and validate OpenAPI definitions with live documentation preview
    in the browser.
  icon: FileCode
  category: productivity
  requirements:
    services:
    - swagger-editor
    vram_gb: 0
  enabled_services_all:
  - swagger-editor
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: swagger-editor
    path: /

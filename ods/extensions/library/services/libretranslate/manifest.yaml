schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: libretranslate
  name: LibreTranslate
  aliases: []
  container_name: ods-libretranslate
  host_env: LIBRETRANSLATE_HOST
  default_host: libretranslate
  port: 5000
  external_port_env: LIBRETRANSLATE_PORT
  external_port_default: 11008
  health: /health
  type: docker
  startup_check: true
  startup_timeout: 600
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Translate text locally with an open-source web interface and API.
  env_vars:
  - key: LIBRETRANSLATE_LANGUAGES
    required: false
    secret: false
    default: en,pt,es
    description: Comma-separated Argos language codes to install.
  ui_path: /
tags:
- language
- local
- open-source
features:
- id: libretranslate-workspace
  name: LibreTranslate
  description: Translate text locally with an open-source web interface and API.
  icon: Languages
  category: language
  requirements:
    services:
    - libretranslate
    vram_gb: 0
  enabled_services_all:
  - libretranslate
  setup_time: Initial image download; see README
  priority: 38
  launch:
    type: service
    service: libretranslate
    path: /

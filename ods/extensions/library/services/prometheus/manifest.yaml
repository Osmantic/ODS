schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: prometheus
  name: Prometheus
  aliases: []
  container_name: ods-prometheus
  host_env: PROMETHEUS_HOST
  default_host: prometheus
  port: 9090
  external_port_env: PROMETHEUS_PORT
  external_port_default: 11101
  health: /-/ready
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Collect and query local time-series metrics from explicitly configured
    project endpoints.
  env_vars: []
  ui_path: /
tags:
- observability
- metrics
- development
- open-source
features:
- id: prometheus-metrics
  name: Prometheus
  description: Collect and query local time-series metrics from explicitly configured
    project endpoints.
  icon: Activity
  category: productivity
  requirements:
    services:
    - prometheus
    vram_gb: 0
  enabled_services_all:
  - prometheus
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: prometheus
    path: /

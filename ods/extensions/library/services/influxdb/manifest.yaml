schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: influxdb
  name: InfluxDB OSS
  aliases: []
  container_name: ods-influxdb
  host_env: INFLUXDB_HOST
  default_host: influxdb
  port: 8086
  external_port_env: INFLUXDB_PORT
  external_port_default: 11135
  health: /health
  type: docker
  startup_check: true
  startup_timeout: 240
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Store and query project time-series measurements with the OSS v2 API,
    Flux and built-in dashboards.
  env_vars:
  - key: INFLUXDB_ADMIN_PASSWORD
    required: true
    secret: true
    description: 'Initial ods administrator password: random 64 hexadecimal characters.'
  - key: INFLUXDB_ADMIN_TOKEN
    required: true
    secret: true
    description: Distinct random 64-hex initial operator token. Keep private; create
      scoped project tokens separately.
  ui_path: /
tags:
- database
- metrics
- time-series
- open-source
features:
- id: influxdb-timeseries
  name: InfluxDB OSS
  description: Store and query project time-series measurements with the OSS v2 API,
    Flux and built-in dashboards.
  icon: Database
  category: productivity
  requirements:
    services:
    - influxdb
    vram_gb: 0
  enabled_services_all:
  - influxdb
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: influxdb
    path: /

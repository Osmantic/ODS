schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: influxdb
  name: InfluxDB (Flux Workflows)
  description: "Store local workflow measurements in scoped buckets and query them with the InfluxDB v2 API and Flux."
  aliases: [flux-database]
  container_name: ods-influxdb
  container_uid: 1000
  default_host: influxdb
  port: 8086
  external_port_env: INFLUXDB_PORT
  external_port_default: 8086
  health: /health
  ui_path: /
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [database, time-series, workflows]
  env_vars:
    - key: INFLUXDB_PORT
      description: "InfluxDB UI and v2 API host port"
      default: "8086"
    - key: INFLUXDB_PASSWORD
      description: "Initial ods login password; rotate through InfluxDB after setup"
      required: true
      secret: true
    - key: INFLUXDB_ADMIN_TOKEN
      description: "Initial operator API token; retain offline for recovery, issue scoped tokens to workflows"
      required: true
      secret: true
features:
  - id: flux-workflows
    name: Flux Workflows
    description: "Query retained workflow measurements with Flux and bucket-scoped API tokens"
    icon: Database
    category: automation
    requirements:
      services: [influxdb]
      vram_gb: 0
    enabled_services_all: [influxdb]
    setup_time: "~1 minute"
    priority: 40
    launch:
      type: service
      service: influxdb
      path: /

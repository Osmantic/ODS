schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: mosquitto
  name: Eclipse Mosquitto
  aliases: []
  container_name: ods-mosquitto
  host_env: MOSQUITTO_HOST
  default_host: mosquitto
  port: 1883
  external_port_env: MOSQUITTO_PORT
  external_port_default: 11087
  health: ''
  type: docker
  startup_check: false
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Exchange MQTT events between projects and automation clients with authenticated
    topics and persistent retained messages.
  env_vars:
  - key: MOSQUITTO_PASSWORD
    required: true
    secret: true
    description: Exactly 64 hexadecimal characters for the local ods MQTT account;
      retain this credential for configured clients.
  external_link: false
tags:
- messaging
- automation
- open-source
features:
- id: mosquitto-events
  name: Mosquitto MQTT
  description: Exchange MQTT events between projects and automation clients with authenticated
    topics and persistent retained messages.
  icon: Radio
  category: productivity
  requirements:
    services:
    - mosquitto
    vram_gb: 0
  enabled_services_all:
  - mosquitto
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: none

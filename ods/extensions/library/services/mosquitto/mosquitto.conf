allow_anonymous false
global_plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /tmp/passwords
global_plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /tmp/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_packet_size 1048576
message_size_limit 524288
max_queued_messages 1000
max_queued_bytes 16777216
memory_limit 201326592
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883 0.0.0.0
protocol mqtt
listener_allow_anonymous false
max_connections 128

listener 9001 0.0.0.0
protocol websockets
listener_allow_anonymous false
max_connections 128

# Private GET-only availability endpoint, deliberately limited by the ACL.
listener 8081 0.0.0.0
protocol http_api
listener_allow_anonymous true
max_connections 16

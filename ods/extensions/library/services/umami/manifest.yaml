schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: umami
  name: Umami (Analytics)
  description: "Privacy-friendly website analytics — self-hosted alternative to GA with a private PostgreSQL."
  aliases: [web-analytics]
  container_name: ods-umami
  default_host: umami
  port: 3030
  external_port_env: UMAMI_PORT
  external_port_default: 3030
  health: /
  ui_path: /
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [analytics, privacy, metrics]
  env_vars:
    - key: UMAMI_PORT
      description: "Published HTTP port"
      default: "3030"
    - key: UMAMI_DB_PASSWORD
      description: "Password for the private PostgreSQL database"
      required: true
      secret: true
    - key: UMAMI_APP_SECRET
      description: "Random salt for auth tokens (openssl rand -hex 32)"
      required: true
      secret: true
features:
  - id: site-analytics
    name: Site Analytics
    description: "Privacy-friendly analytics for sites you self-host"
    icon: TrendingUp
    category: monitoring
    requirements:
      services: [umami]
      vram_gb: 0
    enabled_services_all: [umami]
    setup_time: "~2 minutes"
    priority: 33
    launch:
      type: service
      service: umami

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: healthchecks
  name: Healthchecks
  aliases: []
  container_name: ods-healthchecks
  host_env: HEALTHCHECKS_HOST
  default_host: healthchecks
  port: 8000
  external_port_env: HEALTHCHECKS_PORT
  external_port_default: 11123
  health: /api/v3/status/
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Monitor scheduled jobs through heartbeat pings, expected schedules
    and missed-run alerts.
  env_vars:
  - key: HEALTHCHECKS_SECRET_KEY
    required: true
    secret: true
    description: Stable random 64-hex session signing secret.
  - key: HEALTHCHECKS_DB_PASSWORD
    required: true
    secret: true
    description: Distinct 64-hex PostgreSQL password; retain for existing data.
  ui_path: /
tags:
- monitoring
- scheduled-jobs
- developer-tools
- open-source
features:
- id: healthchecks-monitoring
  name: Healthchecks
  description: Monitor scheduled jobs through heartbeat pings, expected schedules
    and missed-run alerts.
  icon: Activity
  category: developer-tools
  requirements:
    services:
    - healthchecks
    vram_gb: 0
  enabled_services_all:
  - healthchecks
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: healthchecks
    path: /

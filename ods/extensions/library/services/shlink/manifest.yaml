schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: shlink
  name: Shlink
  aliases: []
  container_name: ods-shlink
  host_env: SHLINK_HOST
  default_host: shlink
  port: 8080
  external_port_env: SHLINK_PORT
  external_port_default: 11121
  health: /rest/health
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Create project short links through an authenticated API with persistent
    visit statistics.
  env_vars:
  - key: SHLINK_DB_PASSWORD
    required: true
    secret: true
    description: 64-hex PostgreSQL password.
  - key: SHLINK_API_KEY
    required: true
    secret: true
    description: Distinct 64-hex initial management API key; use native API-key management
      for revocation.
  external_link: false
tags:
- links
- analytics
- development
- open-source
features:
- id: shlink-links
  name: Shlink
  description: Create project short links through an authenticated API with persistent
    visit statistics.
  icon: Link
  category: productivity
  requirements:
    services:
    - shlink
    vram_gb: 0
  enabled_services_all:
  - shlink
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: none

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: jaeger
  name: Jaeger
  aliases: []
  container_name: ods-jaeger
  host_env: JAEGER_HOST
  default_host: jaeger
  port: 16686
  external_port_env: JAEGER_PORT
  external_port_default: 11102
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Inspect real OpenTelemetry application spans in a persistent local
    trace store.
  env_vars:
  - key: JAEGER_GRPC_PORT
    required: false
    default: '11103'
    description: Loopback OTLP gRPC ingestion port.
  - key: JAEGER_HTTP_PORT
    required: false
    default: '11104'
    description: Loopback OTLP HTTP ingestion port.
  ui_path: /
tags:
- observability
- tracing
- development
- open-source
features:
- id: jaeger-traces
  name: Jaeger
  description: Inspect real OpenTelemetry application spans in a persistent local
    trace store.
  icon: Workflow
  category: productivity
  requirements:
    services:
    - jaeger
    vram_gb: 0
  enabled_services_all:
  - jaeger
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: jaeger
    path: /

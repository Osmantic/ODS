schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: it-tools
  name: IT Tools
  description: "Collection of handy web utilities for developers — encoders, formatters, generators, and converters, all client-side."
  aliases: [devtools, utilities]
  container_name: ods-it-tools
  default_host: it-tools
  port: 8085
  external_port_env: IT_TOOLS_PORT
  external_port_default: 8085
  health: /
  ui_path: /
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [utilities, developer, tools]
  env_vars:
    - key: IT_TOOLS_PORT
      description: "Published HTTP port"
      default: "8085"
features:
  - id: dev-toolbox
    name: Developer Toolbox
    description: "Browser-based encoders, formatters, and generators that run fully client-side"
    icon: Wrench
    category: productivity
    requirements:
      services: [it-tools]
      vram_gb: 0
    enabled_services_all: [it-tools]
    setup_time: "~2 minutes"
    priority: 33
    launch:
      type: service
      service: it-tools

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: it-tools
  name: IT-Tools
  aliases: []
  container_name: ods-it-tools
  host_env: IT_TOOLS_HOST
  default_host: it-tools
  port: 8080
  external_port_env: IT_TOOLS_PORT
  external_port_default: 11059
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Browser utilities for JSON/YAML conversion, text differences, hashes,
    QR codes and network calculations.
  env_vars: []
  ui_path: /
tags:
- developer-tools
- converters
- open-source
features:
- id: it-tools-workbench
  name: IT-Tools
  description: Browser utilities for JSON/YAML conversion, text differences, hashes,
    QR codes and network calculations.
  icon: Wrench
  category: productivity
  requirements:
    services:
    - it-tools
    vram_gb: 0
  enabled_services_all:
  - it-tools
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: it-tools
    path: /

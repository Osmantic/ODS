services:
  it-tools:
    image: corentinth/it-tools:2024.10.22-7ca5933
    container_name: ods-it-tools
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${IT_TOOLS_PORT:-8085}:8085"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:80/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [ods-network]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
networks:
  ods-network:
    external: true

schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: dozzle
  name: Dozzle (Log Viewer)
  description: "Lightweight web viewer for Docker container logs — live tail, search, and per-container filtering for the local ODS stack."
  aliases: [logs, log-viewer]
  container_name: ods-dozzle
  default_host: dozzle
  port: 8080
  external_port_env: DOZZLE_PORT
  external_port_default: 8484
  health: /healthcheck
  ui_path: /
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [logs, monitoring, docker]
  env_vars:
    - key: DOZZLE_PORT
      description: "Published HTTP port"
      default: "8484"
    - key: DOZZLE_BASE
      description: "URL path prefix when serving Dozzle behind a reverse proxy subpath"
      default: "/"
features:
  - id: container-logs
    name: Container Logs
    description: "Live tail and search of every ODS container log from the browser"
    icon: ScrollText
    category: monitoring
    requirements:
      services: [dozzle]
      vram_gb: 0
    enabled_services_all: [dozzle]
    setup_time: "~1 minute"
    priority: 32
    launch:
      type: service
      service: dozzle

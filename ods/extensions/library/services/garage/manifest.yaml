schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: garage
  name: Garage S3
  aliases: []
  container_name: ods-garage
  host_env: GARAGE_HOST
  default_host: garage
  port: 3900
  external_port_env: GARAGE_PORT
  external_port_default: 11116
  health: ''
  type: docker
  startup_check: false
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Store project objects through a local S3-compatible API with per-bucket
    access keys.
  env_vars:
  - key: GARAGE_RPC_SECRET
    required: true
    secret: true
    description: Stable 64-hex node RPC secret; preserve with the metadata backup.
  external_link: false
tags:
- storage
- s3
- development
- open-source
features:
- id: garage-storage
  name: Garage S3
  description: Store project objects through a local S3-compatible API with per-bucket
    access keys.
  icon: Database
  category: productivity
  requirements:
    services:
    - garage
    vram_gb: 0
  enabled_services_all:
  - garage
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: none

schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: garage
  name: Garage (Local Object Artifacts)
  description: "Store reproducible local artifacts through S3 with Garage's native single-node layout and bucket permissions."
  aliases: [garage-s3]
  container_name: ods-garage
  container_uid: 1000
  default_host: garage
  port: 0
  external_port_default: 0
  health: /health
  health_port: 3903
  health_source: container
  startup_check: true
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [storage, artifacts, s3]
  env_vars:
    - key: GARAGE_S3_PORT
      description: "Garage S3 protocol host port; no browser UI"
      default: "3900"
    - key: GARAGE_RPC_SECRET
      description: "64 hexadecimal characters for the native local RPC secret; preserve with backups"
      required: true
      secret: true
    - key: GARAGE_ADMIN_TOKEN
      description: "Long random native administration API token; not an S3 access key"
      required: true
      secret: true
    - key: GARAGE_ACCESS_KEY
      description: "Native bootstrap S3 access-key ID: GK followed by 32 hexadecimal characters"
      required: true
      secret: true
    - key: GARAGE_SECRET_KEY
      description: "64 hexadecimal characters for the bootstrap S3 secret; existing keys require the same value"
      required: true
      secret: true

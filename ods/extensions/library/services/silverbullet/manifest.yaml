schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: silverbullet
  name: SilverBullet
  aliases: []
  container_name: ods-silverbullet
  host_env: SILVERBULLET_HOST
  default_host: silverbullet
  port: 3000
  external_port_env: SILVERBULLET_PORT
  external_port_default: 11040
  health: /.instance
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Maintain programmable Markdown knowledge spaces with separate accounts,
    access rules, local files and browser-based editing.
  env_vars: []
  ui_path: /
tags:
- knowledge
- local
- open-source
features:
- id: silverbullet-workspace
  name: SilverBullet
  description: Maintain programmable Markdown knowledge spaces with separate accounts,
    access rules, local files and browser-based editing.
  icon: NotebookPen
  category: productivity
  requirements:
    services:
    - silverbullet
    vram_gb: 0
  enabled_services_all:
  - silverbullet
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: silverbullet
    path: /

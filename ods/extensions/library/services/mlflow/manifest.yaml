schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: mlflow
  name: MLflow
  aliases: []
  container_name: ods-mlflow
  host_env: MLFLOW_HOST
  default_host: mlflow
  port: 5000
  external_port_env: MLFLOW_PORT
  external_port_default: 11004
  health: /health
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Track local model experiments, metrics and artifacts through the MLflow
    interface and API.
  env_vars: []
  ui_path: /
tags:
- development
- local
- open-source
features:
- id: mlflow-workspace
  name: MLflow
  description: Track local model experiments, metrics and artifacts through the MLflow
    interface and API.
  icon: ChartLine
  category: development
  requirements:
    services:
    - mlflow
    vram_gb: 0
  enabled_services_all:
  - mlflow
  setup_time: Initial image download; see README
  priority: 34
  launch:
    type: service
    service: mlflow
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: mlflow
  name: MLflow (Experiments and Artifacts)
  description: "Authenticated local experiment tracking, metrics and artifact storage for explicitly configured ML clients."
  aliases: [experiment-tracking]
  container_name: ods-mlflow
  container_uid: 1000
  default_host: mlflow
  port: 5000
  external_port_env: MLFLOW_PORT
  external_port_default: 5051
  health: /health
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  setup_hook: setup.sh
  category: optional
  depends_on: []
  tags: [experiments, models, artifacts, development]
  env_vars:
    - key: MLFLOW_PORT
      description: "Loopback tracking UI and API port"
      default: "5051"
    - key: MLFLOW_ADMIN_PASSWORD
      description: "Initial ods administrator password; 16-128 printable ASCII characters without spaces"
      required: true
      secret: true
    - key: MLFLOW_SECRET_KEY
      description: "Stable CSRF signing secret; 32-128 printable ASCII characters without spaces"
      required: true
      secret: true
features:
  - id: local-experiment-tracking
    name: Track Local Experiments
    description: "Keep experiment runs, measurements and artifacts on ODS hardware"
    icon: FlaskConical
    category: productivity
    requirements:
      services: [mlflow]
      vram_gb: 0
    enabled_services_all: [mlflow]
    setup_time: "~2 minutes to build authentication support"
    priority: 40
    launch:
      type: service
      service: mlflow

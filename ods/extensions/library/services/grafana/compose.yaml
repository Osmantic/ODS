services:
  grafana:
    image: ods/grafana:13.2.2-local-v1
    container_name: ods-grafana
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${GRAFANA_PORT:-11100}:3000
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    user: '472:0'
    environment:
      GF_SECURITY_ADMIN_USER: ods
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set the 64-hex administrator
        password}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?Set a distinct stable 64-hex encryption
        key}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: 'false'
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: 'true'
      GF_LOG_MODE: console
      GF_PATHS_LOGS: /tmp/grafana-logs
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    stop_grace_period: 60s
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    volumes:
    - grafana-data:/var/lib/grafana
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  grafana-data: {}

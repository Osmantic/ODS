schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: rembg
  name: rembg
  aliases: []
  container_name: ods-rembg
  host_env: REMBG_HOST
  default_host: rembg
  port: 7000
  external_port_env: REMBG_PORT
  external_port_default: 11001
  health: /api
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Remove image backgrounds locally through the Gradio interface or HTTP
    API (x86_64 CPU image).
  env_vars: []
  ui_path: /
tags:
- image
- local
- open-source
features:
- id: rembg-workspace
  name: rembg
  description: Remove image backgrounds locally through the Gradio interface or HTTP
    API (x86_64 CPU image).
  icon: Image
  category: image
  requirements:
    services:
    - rembg
    vram_gb: 0
  enabled_services_all:
  - rembg
  setup_time: Initial image download; see README
  priority: 31
  launch:
    type: service
    service: rembg
    path: /

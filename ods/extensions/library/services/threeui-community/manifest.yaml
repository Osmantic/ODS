schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: threeui-community
  name: ThreeUI Community
  aliases: []
  container_name: ods-threeui-community
  host_env: THREEUI_COMMUNITY_HOST
  default_host: threeui-community
  port: 8080
  external_port_env: THREEUI_COMMUNITY_PORT
  external_port_default: 11075
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Browse interactive open-source React components, inspect their source
    and download the matching Community package for a project.
  env_vars: []
  ui_path: /
tags:
- design
- react
- threejs
- open-source
features:
- id: threeui-community-components
  name: ThreeUI Community
  description: Browse interactive open-source React components, inspect their source
    and download the matching Community package for a project.
  icon: Palette
  category: productivity
  requirements:
    services:
    - threeui-community
    vram_gb: 0
  enabled_services_all:
  - threeui-community
  setup_time: Initial source build; see README
  priority: 48
  launch:
    type: service
    service: threeui-community
    path: /

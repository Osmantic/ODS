schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: squoosh
  name: Squoosh
  aliases: []
  container_name: ods-squoosh
  host_env: SQUOOSH_HOST
  default_host: squoosh
  port: 8080
  external_port_env: SQUOOSH_PORT
  external_port_default: 11092
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Compress and compare image formats locally in the browser using WebAssembly
    codecs.
  env_vars: []
  ui_path: /
tags:
- images
- compression
- design
- open-source
features:
- id: squoosh-images
  name: Squoosh
  description: Compress and compare image formats locally in the browser using WebAssembly
    codecs.
  icon: Image
  category: productivity
  requirements:
    services:
    - squoosh
    vram_gb: 0
  enabled_services_all:
  - squoosh
  setup_time: Initial source build; see README
  priority: 48
  launch:
    type: service
    service: squoosh
    path: /

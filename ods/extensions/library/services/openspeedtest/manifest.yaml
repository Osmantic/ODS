schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: openspeedtest
  name: OpenSpeedTest
  aliases: []
  container_name: ods-openspeedtest
  host_env: OPENSPEEDTEST_HOST
  default_host: openspeedtest
  port: 8080
  external_port_env: OPENSPEEDTEST_PORT
  external_port_default: 11127
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Measure browser-to-ODS-host network throughput and latency with a self-hosted
    HTML5 speed test.
  env_vars: []
  ui_path: /
tags:
- network
- diagnostics
- open-source
features:
- id: openspeedtest-network
  name: OpenSpeedTest
  description: Measure browser-to-ODS-host network throughput and latency with a self-hosted
    HTML5 speed test.
  icon: Gauge
  category: developer-tools
  requirements:
    services:
    - openspeedtest
    vram_gb: 0
  enabled_services_all:
  - openspeedtest
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: openspeedtest
    path: /

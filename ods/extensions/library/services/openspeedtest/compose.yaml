services:
  openspeedtest:
    image: openspeedtest/latest:v2.0.6@sha256:a6a7e3b3e9e93cfe7b9b2eb49c60b2a93644149a0a600845d4df57148b193ff6
    container_name: ods-openspeedtest
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ENABLE_LETSENCRYPT: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OPENSPEEDTEST_PORT:-7825}:3000"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [ods-network]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
networks:
  ods-network:
    external: true

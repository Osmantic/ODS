schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: neo4j
  name: Neo4j Community
  aliases: []
  container_name: ods-neo4j
  host_env: NEO4J_HOST
  default_host: neo4j
  port: 7474
  external_port_env: NEO4J_PORT
  external_port_default: 11139
  health: /
  type: docker
  startup_check: true
  startup_timeout: 240
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Store and query graph relationships with Cypher and the Community browser
    interface.
  env_vars:
  - key: NEO4J_PASSWORD
    required: true
    secret: true
    description: 'Initial neo4j password: random 64 hexadecimal characters; not a
      reset for existing databases.'
  - key: NEO4J_BOLT_PORT
    required: false
    default: '11140'
    description: Loopback host port used by native Bolt drivers and the browser.
  ui_path: /
tags:
- graph
- database
- cypher
- open-source
features:
- id: neo4j-graph
  name: Neo4j Community
  description: Store and query graph relationships with Cypher and the Community browser
    interface.
  icon: Network
  category: productivity
  requirements:
    services:
    - neo4j
    vram_gb: 0
  enabled_services_all:
  - neo4j
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: neo4j
    path: /browser/

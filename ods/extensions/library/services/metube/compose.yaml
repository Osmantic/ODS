services:
  metube:
    image: ghcr.io/alexta69/metube:2025-09-27
    container_name: ods-metube
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      DOWNLOAD_DIR: "${METUBE_DOWNLOAD_DIR:-/downloads}"
      DELETE_FILE_ON_TRASHCAN: "true"
    volumes:
      - ./data/metube/downloads:/downloads
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${METUBE_PORT:-8081}:8081"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:8081/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [ods-network]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
networks:
  ods-network:
    external: true

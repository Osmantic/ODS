schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: metabase
  name: Metabase
  aliases: []
  container_name: ods-metabase
  host_env: METABASE_HOST
  default_host: metabase
  port: 3000
  external_port_env: METABASE_PORT
  external_port_default: 11033
  health: /api/health
  type: docker
  startup_check: true
  startup_timeout: 240
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Explore project databases and save queries, visualizations and dashboards
    in a local open-source analytics workspace.
  env_vars:
  - key: METABASE_DATABASE_PASSWORD
    required: true
    secret: true
    description: Persistent password for the private application PostgreSQL database.
  - key: METABASE_ENCRYPTION_KEY
    required: true
    secret: true
    description: Persistent encryption key, at least 16 characters; generate 32 random
      bytes and retain with backups.
  - key: METABASE_SITE_URL
    required: false
    default: http://localhost:11033
    description: Browser-facing URL used for application links.
  ui_path: /
tags:
- analytics
- local
- open-source
features:
- id: metabase-workspace
  name: Metabase
  description: Explore project databases and save queries, visualizations and dashboards
    in a local open-source analytics workspace.
  icon: ChartColumn
  category: productivity
  requirements:
    services:
    - metabase
    vram_gb: 0
  enabled_services_all:
  - metabase
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: metabase
    path: /

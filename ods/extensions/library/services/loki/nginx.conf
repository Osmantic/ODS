pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=1s ipv6=off;
    upstream loki_backend {
        zone loki_backend 64k;
        server loki-store:3100 resolve;
    }
    server {
        listen 8080;
        server_tokens off;
        auth_basic "ODS Loki";
        location = /ready {
            auth_basic off;
            limit_except GET { deny all; }
            include /etc/nginx/ods-proxy.conf;
        }
        location = /loki/api/v1/push {
            auth_basic_user_file /tmp/writers;
            limit_except POST { deny all; }
            include /etc/nginx/ods-proxy.conf;
        }
        location ~ ^/loki/api/v1/(query|query_range|labels|series|label/[a-zA-Z_][a-zA-Z0-9_]*/values)$ {
            auth_basic_user_file /tmp/readers;
            limit_except GET { deny all; }
            include /etc/nginx/ods-proxy.conf;
        }
        location / { return 404; }
    }
}

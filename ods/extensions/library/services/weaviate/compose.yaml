services:
  weaviate:
    image: docker.io/semitechnologies/weaviate:1.39.13@sha256:ad2b986bbe4666fbd5302a5ee0cc6c74a048c4c769198d46147ea232d46a2dd8
    container_name: ods-weaviate
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - DISABLE_TELEMETRY=true
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=false
      - AUTHENTICATION_APIKEY_ENABLED=true
      - AUTHENTICATION_APIKEY_ALLOWED_KEYS=${WEAVIATE_API_KEY:?WEAVIATE_API_KEY must be set}
      - AUTHENTICATION_APIKEY_USERS=admin@ods.local
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - CLUSTER_HOSTNAME=ods-weaviate
      - RAFT_JOIN=ods-weaviate
      - RAFT_BOOTSTRAP_EXPECT=1
    volumes:
      - ./data/weaviate:/var/lib/weaviate
    ports:
      - "127.0.0.1:${WEAVIATE_PORT:-7811}:8080"
      - "127.0.0.1:${WEAVIATE_GRPC_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ods-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

networks:
  ods-network:
    external: true

services:
  gotenberg:
    image: gotenberg/gotenberg:8@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    container_name: ods-gotenberg
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${GOTENBERG_PORT:-11017}:3000
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:3000/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    shm_size: 256mb
networks:
  ods-network:
    external: true
    name: ods-network

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: weblate
  name: Weblate
  aliases: []
  container_name: ods-weblate
  host_env: WEBLATE_HOST
  default_host: weblate
  port: 8080
  external_port_env: WEBLATE_PORT
  external_port_default: 11138
  health: /healthz/
  type: docker
  startup_check: true
  startup_timeout: 600
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Manage software localization, translation review and version-controlled
    language files.
  env_vars:
  - key: WEBLATE_DB_PASSWORD
    required: true
    secret: true
    description: Random 64-hex PostgreSQL password; keep stable across recreation.
  - key: WEBLATE_ADMIN_PASSWORD
    required: true
    secret: true
    description: Distinct random 64-hex admin password, reapplied by native startup.
  - key: WEBLATE_ADMIN_EMAIL
    required: true
    secret: false
    description: Actual owner email for the administrator account; SMTP is configured
      separately.
  ui_path: /
tags:
- localization
- translation
- development
- open-source
features:
- id: weblate-localization
  name: Weblate
  description: Manage software localization, translation review and version-controlled
    language files.
  icon: Languages
  category: productivity
  requirements:
    services:
    - weblate
    vram_gb: 0
  enabled_services_all:
  - weblate
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: weblate
    path: /

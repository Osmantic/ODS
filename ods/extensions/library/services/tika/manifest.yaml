schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: tika
  name: Apache Tika
  aliases: []
  container_name: ods-tika
  host_env: TIKA_HOST
  default_host: tika
  port: 9998
  external_port_env: TIKA_PORT
  external_port_default: 11011
  health: /version
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Extract text and metadata from documents through a local parsing API.
  env_vars: []
  external_link: false
tags:
- documents
- local
- open-source
features:
- id: tika-workspace
  name: Apache Tika
  description: Extract text and metadata from documents through a local parsing API.
  icon: FileText
  category: documents
  requirements:
    services:
    - tika
    vram_gb: 0
  enabled_services_all:
  - tika
  setup_time: Initial image download; see README
  priority: 41
  launch:
    type: none

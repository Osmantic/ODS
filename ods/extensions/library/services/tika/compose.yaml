services:
  tika:
    image: apache/tika:latest@sha256:a8b442501f601fb15015de974f9afe13dd242b0f14e49a2b144fadcb214a555b
    container_name: ods-tika
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${TIKA_PORT:-11011}:9998
    healthcheck:
      test:
      - CMD
      - bash
      - -ec
      - 'exec 3<>/dev/tcp/127.0.0.1/9998; printf ''GET /version HTTP/1.0\r\nHost:
        localhost\r\n\r\n'' >&3; head -n 1 <&3 | grep -q '' 200 '''
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
networks:
  ods-network:
    external: true
    name: ods-network

services:
  listmonk:
    image: ods/listmonk:6.2.0-local-v1
    container_name: ods-listmonk
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${LISTMONK_PORT:-11120}:9000
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9000/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    - listmonk-internal
    user: 1000:1000
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: '5432'
      LISTMONK_db__database: listmonk
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:?Set a 64-hex database password}
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: ods
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:?Set a distinct 64-hex administrator
        password}
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    stop_grace_period: 60s
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    volumes:
    - listmonk-uploads:/listmonk/uploads
    depends_on:
      listmonk-db:
        condition: service_healthy
  listmonk-db:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    restart: unless-stopped
    networks:
    - listmonk-internal
    environment:
      POSTGRES_DB: listmonk
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:?Set a 64-hex database password}
    volumes:
    - listmonk-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - listmonk
      - -d
      - listmonk
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    container_name: ods-listmonk-db
networks:
  ods-network:
    external: true
    name: ods-network
  listmonk-internal:
    internal: true
volumes:
  listmonk-uploads: {}
  listmonk-db-data: {}

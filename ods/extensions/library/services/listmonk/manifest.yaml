schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: listmonk
  name: Listmonk
  aliases: []
  container_name: ods-listmonk
  host_env: LISTMONK_HOST
  default_host: listmonk
  port: 9000
  external_port_env: LISTMONK_PORT
  external_port_default: 11120
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Manage opt-in subscriber lists, reusable templates and campaign drafts
    with local storage.
  env_vars:
  - key: LISTMONK_DB_PASSWORD
    required: true
    secret: true
    description: 64-hex PostgreSQL password; preserve for existing database.
  - key: LISTMONK_ADMIN_PASSWORD
    required: true
    secret: true
    description: Distinct 64-hex initial password for ods administrator; does not
      reset an existing account.
  ui_path: /
tags:
- email
- campaigns
- productivity
- open-source
features:
- id: listmonk-campaigns
  name: Listmonk
  description: Manage opt-in subscriber lists, reusable templates and campaign drafts
    with local storage.
  icon: Mail
  category: productivity
  requirements:
    services:
    - listmonk
    vram_gb: 0
  enabled_services_all:
  - listmonk
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: listmonk
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: freshrss
  name: FreshRSS (Feed Aggregator)
  description: "Self-hosted RSS and Atom feed aggregator and reader with responsive UI and Google Reader API compatibility."
  aliases: [rss-reader, news-aggregator]
  container_name: ods-freshrss
  default_host: freshrss
  port: 80
  external_port_env: FRESHRSS_PORT
  external_port_default: 7858
  health: /
  ui_path: /
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [rss, feed, news, reading, aggregator]
  env_vars:
    - key: FRESHRSS_PORT
      description: "Published HTTP port"
      default: "7858"
    - key: FRESHRSS_BASE_URL
      description: "Client-facing base URL"
      default: "http://localhost:7858"
features:
  - id: feed-reader
    name: Feed Reader
    description: "Follow RSS, Atom, and podcast feeds locally with zero third-party tracking"
    icon: Rss
    category: productivity
    requirements:
      services: [freshrss]
      vram_gb: 0
    enabled_services_all: [freshrss]
    setup_time: "~1 minute"
    priority: 35
    launch:
      type: service
      service: freshrss

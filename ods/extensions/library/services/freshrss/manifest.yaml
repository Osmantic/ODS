schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: freshrss
  name: FreshRSS
  aliases: []
  container_name: ods-freshrss
  host_env: FRESHRSS_HOST
  default_host: freshrss
  port: 80
  external_port_env: FRESHRSS_PORT
  external_port_default: 11029
  health: /
  type: docker
  startup_check: true
  startup_timeout: 90
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Follow research feeds with categories, filters, article history and
    OPML import/export in a persistent local reader.
  env_vars:
  - key: FRESHRSS_TIMEZONE
    required: false
    default: UTC
    description: IANA timezone for feed refresh scheduling.
  - key: FRESHRSS_CRON_MIN
    required: false
    default: 7,37
    description: Minutes within each hour for refresh; default twice hourly.
  ui_path: /
tags:
- research
- local
- open-source
features:
- id: freshrss-workspace
  name: FreshRSS
  description: Follow research feeds with categories, filters, article history and
    OPML import/export in a persistent local reader.
  icon: Rss
  category: productivity
  requirements:
    services:
    - freshrss
    vram_gb: 0
  enabled_services_all:
  - freshrss
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: freshrss
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: openrefine
  name: OpenRefine
  aliases: []
  container_name: ods-openrefine
  host_env: OPENREFINE_HOST
  default_host: openrefine
  port: 3333
  external_port_env: OPENREFINE_PORT
  external_port_default: 11081
  health: /
  type: docker
  startup_check: true
  startup_timeout: 180
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Clean, cluster and transform tabular data with repeatable operations
    and persistent project history.
  env_vars: []
  ui_path: /
tags:
- data
- spreadsheets
- open-source
features:
- id: openrefine-data
  name: OpenRefine
  description: Clean, cluster and transform tabular data with repeatable operations
    and persistent project history.
  icon: Table
  category: productivity
  requirements:
    services:
    - openrefine
    vram_gb: 0
  enabled_services_all:
  - openrefine
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: openrefine
    path: /

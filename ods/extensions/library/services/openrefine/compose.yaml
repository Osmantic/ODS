services:
  openrefine:
    image: ods/openrefine:3.10.1-local-v1
    container_name: ods-openrefine
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${OPENREFINE_PORT:-11081}:3333
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --max-time
      - '5'
      - http://127.0.0.1:3333/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    user: 1000:1000
    environment:
      HOME: /data
    volumes:
    - openrefine-data:/data
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    stop_grace_period: 60s
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  openrefine-data: {}

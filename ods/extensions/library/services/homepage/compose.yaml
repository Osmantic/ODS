services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.6.1
    container_name: ods-homepage
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "localhost:${HOMEPAGE_PORT:-3100},127.0.0.1:${HOMEPAGE_PORT:-3100}"
    volumes:
      - ./data/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOMEPAGE_PORT:-3100}:3100"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:3000/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [ods-network]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
networks:
  ods-network:
    external: true

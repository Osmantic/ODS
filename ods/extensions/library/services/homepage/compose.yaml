services:
  homepage:
    image: ods/homepage:2.4.0-config-v1
    container_name: ods-homepage
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 127.0.0.1:${HOMEPAGE_PORT:-11038}:3000
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - -T
      - '5'
      - http://127.0.0.1:3000/api/healthcheck
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ods-network
    user: 1000:1000
    environment:
      PUID: '1000'
      PGID: '1000'
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      NEXT_TELEMETRY_DISABLED: '1'
      HOMEPAGE_AUTH_ENABLED: 'true'
      HOMEPAGE_AUTH_PASSWORD: ${HOMEPAGE_AUTH_PASSWORD:?Set the Homepage password}
      HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET:?Set a random secret of at least
        32 characters}
      HOMEPAGE_EXTERNAL_URL: ${HOMEPAGE_EXTERNAL_URL:-http://localhost:11038}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:11038,127.0.0.1:11038,homepage:3000}
      HOMEPAGE_VAR_ODS_URL: ${HOMEPAGE_VAR_ODS_URL:-http://localhost:3001}
    volumes:
    - homepage-config:/app/config
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - node
    - server.js
networks:
  ods-network:
    external: true
    name: ods-network
volumes:
  homepage-config: {}

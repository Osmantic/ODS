schema_version: ods.services.v1
compatibility:
  ods_min: 2.6.0
service:
  id: homepage
  name: Homepage
  aliases: []
  container_name: ods-homepage
  host_env: HOMEPAGE_HOST
  default_host: homepage
  port: 3000
  external_port_env: HOMEPAGE_PORT
  external_port_default: 11038
  health: /api/healthcheck
  type: docker
  startup_check: true
  startup_timeout: 120
  gpu_backends:
  - all
  compose_file: compose.yaml
  category: optional
  depends_on: []
  description: Organize project service links and explicitly configured API widgets
    in a persistent, password-protected local dashboard.
  env_vars:
  - key: HOMEPAGE_AUTH_PASSWORD
    required: true
    secret: true
    description: Password for the Homepage dashboard; not the ODS account password.
  - key: HOMEPAGE_AUTH_SECRET
    required: true
    secret: true
    description: Persistent random session signing secret, at least 32 characters.
      Rotation invalidates sessions.
  - key: HOMEPAGE_EXTERNAL_URL
    required: false
    default: http://localhost:11038
    description: Exact browser origin for password sign-in. Update when changing port
      or hostname.
  - key: HOMEPAGE_ALLOWED_HOSTS
    required: false
    default: localhost:11038,127.0.0.1:11038,homepage:3000
    description: Comma-separated Host headers without schemes. Include homepage:3000
      for ODS readiness; do not use a wildcard.
  - key: HOMEPAGE_VAR_ODS_URL
    required: false
    default: http://localhost:3001
    description: Browser URL of this ODS installation for the initial Portal link.
  ui_path: /
tags:
- productivity
- local
- open-source
features:
- id: homepage-workspace
  name: Homepage
  description: Organize project service links and explicitly configured API widgets
    in a persistent, password-protected local dashboard.
  icon: LayoutDashboard
  category: productivity
  requirements:
    services:
    - homepage
    vram_gb: 0
  enabled_services_all:
  - homepage
  setup_time: Initial image download; see README
  priority: 48
  launch:
    type: service
    service: homepage
    path: /

schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: homepage
  name: Homepage (Start Page)
  description: "Customizable start page with service discovery — a self-hosted landing dashboard for the ODS stack."
  aliases: [startpage, portal]
  container_name: ods-homepage
  default_host: homepage
  port: 3100
  external_port_env: HOMEPAGE_PORT
  external_port_default: 3100
  health: /
  ui_path: /
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [dashboard, startpage, portal]
  env_vars:
    - key: HOMEPAGE_PORT
      description: "Published HTTP port"
      default: "3100"
features:
  - id: start-page
    name: Start Page
    description: "A customizable landing dashboard linking every enabled ODS service"
    icon: Home
    category: productivity
    requirements:
      services: [homepage]
      vram_gb: 0
    enabled_services_all: [homepage]
    setup_time: "~2 minutes"
    priority: 33
    launch:
      type: service
      service: homepage

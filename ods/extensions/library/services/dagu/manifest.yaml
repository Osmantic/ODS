schema_version: ods.services.v1
compatibility:
  ods_min: "2.6.0"
service:
  id: dagu
  name: Dagu (Local YAML Jobs)
  description: "Run native YAML job dependencies locally with authenticated run receipts and persisted history."
  aliases: [yaml-jobs]
  container_name: ods-dagu
  container_uid: 1000
  default_host: dagu
  port: 8080
  external_port_env: DAGU_PORT
  external_port_default: 8525
  health: /api/v1/health
  ui_path: /
  startup_timeout: 120
  type: docker
  gpu_backends: [all]
  compose_file: compose.yaml
  category: optional
  depends_on: []
  tags: [workflows, jobs, automation]
  env_vars:
    - key: DAGU_PORT
      description: "Dagu browser and authenticated API host port"
      default: "8525"
    - key: DAGU_ADMIN_PASSWORD
      description: "Initial password for native administrator ods, at least eight characters; ignored once users exist"
      required: true
      secret: true
    - key: DAGU_TOKEN_SECRET
      description: "Persistent random JWT signing secret; retain with private backups"
      required: true
      secret: true
features:
  - id: local-yaml-jobs
    name: Local YAML Jobs
    description: "Execute local job dependencies and inspect durable run receipts"
    icon: Workflow
    category: automation
    requirements:
      services: [dagu]
      vram_gb: 0
    enabled_services_all: [dagu]
    setup_time: "~2 minutes"
    priority: 40
    launch:
      type: service
      service: dagu
      path: /

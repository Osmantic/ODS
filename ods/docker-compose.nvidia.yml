# ODS — NVIDIA GPU Overlay (Core Services Only)
# ComfyUI GPU config moved to extensions/services/comfyui/compose.nvidia.yaml
# Whisper GPU config moved to extensions/services/whisper/compose.nvidia.yaml
# Use with: docker compose -f docker-compose.base.yml -f docker-compose.nvidia.yml up -d

services:
  llama-server:
    image: ${LLAMA_SERVER_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b9014}
    environment:
      # n-gram speculative decoding. The target model verifies every drafted
      # token, so output is the target model's own. It needs llama.cpp b8955+
      # (dedicated ngram-mod params) and b8842+ (checkpoints for hybrid models
      # such as Qwen3.5); the pinned b9014 image has both. An explicit
      # per-model LLAMA_ARG_SPEC_TYPE (e.g. draft-mtp) wins. Set
      # LLAMA_SPEC_TYPE=none in .env to turn it off.
      - LLAMA_ARG_SPEC_TYPE=${LLAMA_ARG_SPEC_TYPE:-${LLAMA_SPEC_TYPE:-ngram-mod}}
      # ODS chat template for the active catalog model, set by model selection
      # (Qwen3.5: its own template plus Qwen3.6's preserve_thinking switch).
      # Unset uses the GGUF's embedded template.
      - LLAMA_ARG_CHAT_TEMPLATE_FILE
    volumes:
      - ./config/llama-server/templates:/config/llama-server/templates:ro,z
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          cpus: '${LLAMA_CPU_LIMIT:-16.0}'
          memory: ${LLAMA_SERVER_MEMORY_LIMIT:-64G}

  dashboard-api:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all  # nvidia-smi needs visibility into all GPUs for monitoring
              capabilities: [utility]

  open-webui:
    environment:
      AUDIO_STT_MODEL: "${AUDIO_STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}"
      ENABLE_IMAGE_GENERATION: "${ENABLE_IMAGE_GENERATION:-true}"

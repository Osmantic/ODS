name: Portal runtime contracts

on:
  pull_request:
    paths:
      - 'ods/bin/**'
      - 'ods/extensions/services/pixel-agent/**'
      - 'ods/extensions/services/pixel-edge/**'
      - 'ods/extensions/services/dashboard/src/pages/Pixel.jsx'
      - 'ods/extensions/services/dashboard/src/lib/previewOrigin.js'
      - 'ods/extensions/services/dashboard/src/lib/useVerifiedPreview.js'
      - 'ods/extensions/services/dashboard/src/components/PortalWorkspace.jsx'
      - 'ods/extensions/services/dashboard/src/components/PixelPreviewViewport.jsx'
      - 'ods/installers/**'
      - '.github/workflows/portal-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-browser:
    # Keep Chromium's OS sandbox enabled. Ubuntu 24.04's AppArmor policy
    # rejects this standalone browser's user namespaces before tests start.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: npm install --prefix "$RUNNER_TEMP/preview-browser" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org playwright@1.62.1 esbuild@0.27.7 @noble/hashes@2.4.0
      - name: Install Chromium and operating-system dependencies
        run: node "$RUNNER_TEMP/preview-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify preview interactions and isolation in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/preview-browser/node_modules
        run: node --test --test-timeout=120000 ods/extensions/services/pixel-agent/tests/preview_browser.test.cjs ods/extensions/services/pixel-agent/tests/preview_origin_browser.test.cjs
  compaction-lock:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    # Native integration steps can pass near 15m; reserve time for job cleanup.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: node --test ods/extensions/services/pixel-agent/tests/compaction_lock.test.mjs
      - name: Verify native process admission custody
        if: runner.os != 'Windows'
        run: node --test ods/extensions/services/pixel-agent/tests/access_runtime.test.mjs
      - run: node --test ods/extensions/services/pixel-agent/tests/read_range.test.mjs
      - run: node --test ods/extensions/services/pixel-agent/tests/tool_result_projection.test.mjs
      - run: node --test ods/extensions/services/pixel-agent/tests/persisted_tool_model_projection.test.mjs ods/extensions/services/pixel-agent/tests/exec_completion_feedback.test.mjs
      - name: Verify the run-deadline notice and the stop the owner sees
        run: node --test ods/extensions/services/pixel-agent/tests/run_deadline.test.mjs ods/extensions/services/pixel-agent/tests/run_deadline_delivery.test.mjs
      - name: Verify the output-limit stop the owner sees
        run: node --test ods/extensions/services/pixel-agent/tests/output_limit_delivery.test.mjs
      - name: Verify repository handoff and bounded host intent
        run: node --test ods/extensions/services/pixel-agent/tests/repository_acquisition_routing.test.mjs ods/extensions/services/pixel-agent/tests/prompt_contract.test.mjs ods/extensions/services/pixel-agent/tests/connections_status.test.mjs ods/extensions/services/pixel-agent/tests/english_default.test.mjs ods/extensions/services/pixel-agent/tests/response_language.test.mjs ods/extensions/services/pixel-agent/tests/operations_composition.test.mjs ods/extensions/services/pixel-agent/tests/download_promote.test.mjs ods/extensions/services/pixel-agent/tests/network_interface_intent.test.mjs ods/extensions/services/pixel-agent/tests/host_service_constraint_intent.test.mjs ods/extensions/services/pixel-agent/tests/download_terminal_receipt.test.mjs
      - name: Verify host report download continuation across platforms
        run: node --test ods/extensions/services/pixel-agent/tests/host_workspace_artifact_continuation.test.mjs
      - name: Verify activity and downloads across native attempts
        run: node --test ods/extensions/services/pixel-agent/tests/attempt_lifecycle.test.mjs ods/extensions/services/pixel-agent/tests/task_activity.test.mjs
      - name: Verify explicit artifact publication intent
        run: node --test ods/extensions/services/pixel-agent/tests/artifact_publication_intent.test.mjs ods/extensions/services/pixel-agent/tests/repeat_document_delivery.test.mjs
      - name: Verify per-turn no-tools policy and installed ingress layout
        run: node --test ods/extensions/services/pixel-agent/tests/ingress_owner_no_tools.test.mjs
      - name: Verify explicit execution requests and bounded recovery
        run: node --test ods/extensions/services/pixel-agent/tests/explicit_python_compute.test.mjs ods/extensions/services/pixel-agent/tests/explicit_interpreter_execution.test.mjs
      - name: Verify same-chat source receipts and follow-up execution
        run: node --test ods/extensions/services/pixel-agent/tests/current_source_receipts.test.mjs ods/extensions/services/pixel-agent/tests/prior_source_reuse.test.mjs
      - name: Verify bounded preview delivery across platforms
        run: |
          node --test ods/extensions/services/pixel-agent/tests/preview_delivery_recovery.test.mjs
          node --test --test-name-pattern="saved project|automatic preview|publication .*not retried|concurrent finalizers" ods/extensions/services/pixel-agent/tests/tool_loop_guard.test.mjs
      - name: Verify the Operations-boundary stop the owner sees
        run: node --test ods/extensions/services/pixel-agent/tests/operations_abort_delivery.test.mjs
      - name: Install pinned read-tool runtime for integration
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/read-runtime" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org openclaw@2026.6.33
      - name: Verify real file reads and range failures
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_read_range.integration.mjs ods/extensions/services/pixel-agent/tests/runtime_edit_redaction.integration.mjs
      - name: Verify connected-app plugin imports and real wiki tools
        if: runner.os == 'Linux'
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
          PIXEL_SOURCE_PLUGIN_DIR: ${{ runner.temp }}/connected-source/plugin
          PIXEL_TEST_TYPEBOX_DIR: ${{ runner.temp }}/connected-source/plugin/node_modules/typebox
        run: |
          mkdir -p "$PIXEL_SOURCE_PLUGIN_DIR"
          cp -R ods/vendor/pixel/plugin/. "$PIXEL_SOURCE_PLUGIN_DIR/"
          npm ci --prefix "$PIXEL_SOURCE_PLUGIN_DIR" --ignore-scripts --no-audit --no-fund
          python3 ods/extensions/services/pixel-agent/tests/test_connection_plugin_runtime.py
          node --test ods/vendor/pixel/tests/source-broker-plugin.test.mjs \
            ods/vendor/pixel/tests/source-count-plugin.test.mjs \
            ods/vendor/pixel/tests/source-count-query.test.mjs
      - name: Verify native MCP isolates server grants and delivers an allowed read through Pixel
        if: runner.os == 'Linux'
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: python3 ods/extensions/services/pixel-agent/tests/test_native_mcp_runtime.py
      - name: Verify native MCP OAuth through the ODS callback and private token store
        if: runner.os == 'Linux'
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: python3 ods/extensions/services/pixel-agent/tests/test_native_mcp_oauth.py
      - name: Verify direct native tools complete admission across success, errors and overlapping IDs
        if: runner.os == 'Linux'
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: python3 ods/extensions/services/pixel-agent/tests/test_native_direct_tool_completion.py
      - name: Verify concurrent workspace creation and no-follow boundaries
        if: runner.os != 'Windows'
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: python3 ods/extensions/services/pixel-agent/tests/test_runtime_sandbox_mkdir.py
      - name: Verify every tool result reaches the model with the pinned projection
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_tool_result_projection.integration.mjs
      - name: Verify preview screenshots leave the model context by the pinned runtime rules
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_preview_screenshot_context.integration.mjs
      - name: Verify native compaction lock and abort ownership
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_compaction_abort.integration.mjs ods/extensions/services/pixel-agent/tests/runtime_compaction_lock.integration.mjs ods/extensions/services/pixel-agent/tests/runtime_compaction_context.integration.mjs ods/extensions/services/pixel-agent/tests/runtime_compaction_no_work.integration.mjs ods/extensions/services/pixel-agent/tests/runtime_32k_prompt_budget.integration.mjs ods/extensions/services/pixel-agent/tests/runtime_hook_provenance.integration.mjs ods/extensions/services/pixel-agent/tests/runtime_long_run_compaction.integration.mjs
      - name: Verify 8K POSIX runtime profile and first chat
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_8k_prompt_budget.integration.mjs
      - name: Verify native scheduled tasks survive restart and retain real run history
        if: runner.os == 'Linux'
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: python3 ods/extensions/services/pixel-agent/tests/test_scheduled_tasks_runtime.py
      - name: Verify protected native schedule owner transport
        if: runner.os == 'Linux'
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: |
          export ODS_SCHEDULE_NODE="$(command -v node)"
          sudo --preserve-env=OPENCLAW_PACKAGE_DIR,ODS_SCHEDULE_NODE python3 ods/extensions/services/pixel-agent/tests/test_scheduled_tasks_root.py
      - name: Verify deferred delegation through the real gateway and Portal ingress
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
          ODS_HOOK_EVIDENCE_PATH: ${{ runner.temp }}/portal-delegation-evidence/delegation
        run: |
          mkdir -p "$RUNNER_TEMP/portal-delegation-evidence"
          node --test ods/extensions/services/pixel-agent/tests/runtime_delegation_wait_schema.integration.mjs
          node --test ods/extensions/services/pixel-agent/tests/runtime_delegation_delivery_hooks.integration.mjs
      - name: Preserve native delegation diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: portal-delegation-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/portal-delegation-evidence/delegation.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify capability bootstrap with the actual pinned runtime
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node ods/extensions/services/pixel-agent/tests/runtime_bootstrap_capabilities.integration.mjs
      - name: Verify premature completion with real Pixel runtime
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_preview_delivery.integration.mjs
      - name: Verify tool feedback reaches the next real provider request
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        # Both files create cold native gateways; run them in sequence so the
        # macOS runner's startup budget measures the runtime without contention.
        run: node --test --test-concurrency=1 ods/extensions/services/pixel-agent/tests/runtime_exec_completion.integration.mjs ods/extensions/services/pixel-agent/tests/runtime_exec_guidance_history.integration.mjs
      - name: Verify every Pixel chat reaches the real provider with one system prompt
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_line_stable.integration.mjs
      - name: Verify tool results reach real provider requests past the aggregate budget
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_tool_result_delivery.integration.mjs
      - name: Verify an owner cancel leaves the next message clean with the real runtime
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_cancel_recovery.integration.mjs
      - name: Verify a clarification answer in a replaced session gets its request as model-only context with the real runtime
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_clarification_answer.integration.mjs
      - name: Verify tool-call arguments reach the tool unchanged in the native macOS stream order
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_diagnostic_stream_writes.integration.mjs
      - name: Verify split UTF-8 output through the pinned subprocess supervisor
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_utf8_output.integration.mjs
      - name: Verify image lifecycle and failed command attempt presentation with pinned native SDK
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_image_lifecycle.integration.mjs ods/extensions/services/pixel-agent/tests/runtime_command_attempt_warning.integration.mjs
      - name: Verify imported history survives native session startup with real Pixel runtime
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node ods/extensions/services/pixel-agent/tests/runtime_history_hydration.integration.mjs
      - name: Verify tool-limit finalization, stop synthesis and silent-reply recovery with real Pixel runtime
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        # The compaction variant needs the completion-recovery repair that the ODS
        # installer applies; upstream discards a response followed by a post-turn
        # compaction. This is the job's last step, so earlier steps keep upstream.
        run: |
          set -euo pipefail
          python3 ods/extensions/services/pixel-agent/host/openclaw_tool_recovery.py \
            --openclaw-bin "$OPENCLAW_PACKAGE/openclaw.mjs" --state-dir "$RUNNER_TEMP/pixel-completion-repair" --completion-recovery
          node --test ods/extensions/services/pixel-agent/tests/runtime_progress_finalization.integration.mjs \
            ods/extensions/services/pixel-agent/tests/runtime_blocked_diagnostic.integration.mjs \
            ods/extensions/services/pixel-agent/tests/runtime_stop_synthesis.integration.mjs \
            ods/extensions/services/pixel-agent/tests/runtime_owner_visible_reply.integration.mjs \
            ods/extensions/services/pixel-agent/tests/runtime_document_delivery.integration.mjs
      - name: Verify no-tools requests through the real gateway
        if: runner.os != 'Windows'
        shell: bash
        env:
          OPENCLAW_PACKAGE: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: |
          set -euo pipefail
          python3 ods/extensions/services/pixel-agent/host/openclaw_tool_recovery.py \
            --openclaw-bin "$OPENCLAW_PACKAGE/openclaw.mjs" --state-dir "$RUNNER_TEMP/pixel-context-usage-repair" --context-usage
          python3 ods/extensions/services/pixel-agent/host/openclaw_tool_recovery.py \
            --openclaw-bin "$OPENCLAW_PACKAGE/openclaw.mjs" --state-dir "$RUNNER_TEMP/pixel-no-tools-ingress-repair" --no-tools-ingress
          node --test ods/extensions/services/pixel-agent/tests/runtime_owner_no_tools.integration.mjs
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest aiohttp httpx pyyaml
      - name: Agent JavaScript contracts
        run: node --test --test-timeout=120000 ods/extensions/services/pixel-agent/tests/*.test.mjs
      - name: Agent host contracts
        run: python -m pytest -q ods/extensions/services/pixel-agent/tests
      - name: Edge contracts
        run: python -m pytest -q ods/extensions/services/pixel-edge/tests
  retained-edge-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install pytest pyyaml
      - name: Verify source custody and model hold regressions
        run: python -m pytest -q ods/extensions/services/pixel-agent/tests/test_source_edge_restart.py ods/tests/test_pixel_source_upgrade.py ods/tests/test_pixel_model_transition.py ods/tests/test_native_enrollment_admission.py
      - name: Qualify retained Edge restart with the real image and private volume
        # This runner is isolated. The test refuses any pre-existing Edge,
        # starts no daemon, and removes only its own generated Compose project.
        run: sudo env ODS_TEST_SOURCE_EDGE_DOCKER=1 "$(command -v python)" -m pytest -q -s ods/extensions/services/pixel-agent/tests/test_source_edge_restart_docker.py

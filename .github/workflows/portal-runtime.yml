name: Portal runtime contracts

on:
  pull_request:
    paths:
      - 'ods/bin/**'
      - 'ods/extensions/services/pixel-agent/**'
      - 'ods/extensions/services/pixel-edge/**'
      - 'ods/installers/**'
      - '.github/workflows/portal-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compaction-lock:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: node --test ods/extensions/services/pixel-agent/tests/compaction_lock.test.mjs
      - run: node --test ods/extensions/services/pixel-agent/tests/read_range.test.mjs
      - name: Install pinned read-tool runtime for integration
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/read-runtime" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org openclaw@2026.6.33
      - name: Verify real file reads and range failures
        shell: bash
        env:
          OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/read-runtime/node_modules/openclaw
        run: node --test ods/extensions/services/pixel-agent/tests/runtime_read_range.integration.mjs
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/pixel-edge-tests.txt
      - name: Agent JavaScript contracts
        run: node --test --test-timeout=120000 ods/extensions/services/pixel-agent/tests/*.test.mjs
      - name: Agent host contracts
        run: python -m pytest -q ods/extensions/services/pixel-agent/tests
      - name: Edge contracts
        run: python -m pytest -q ods/extensions/services/pixel-edge/tests

name: Extension setup environment
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/**/setup.sh'
      - 'ods/extensions/library/services/**/compose.yaml'
      - 'ods/tests/test_extension_setup_env_lines.py'
      - '.github/workflows/extension-setup-env.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest ods/tests/test_extension_setup_env_lines.py -q

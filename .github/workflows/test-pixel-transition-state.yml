name: Pixel transition state
on:
  pull_request:
    paths:
      - 'ods/extensions/services/pixel-edge/**'
      - '.github/workflows/test-pixel-transition-state.yml'
  push:
    branches: [main, public-beta]
    paths:
      - 'ods/extensions/services/pixel-edge/**'
      - '.github/workflows/test-pixel-transition-state.yml'
permissions:
  contents: read
jobs:
  admission-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Install edge test dependencies
        run: python -m pip install -r ods/extensions/services/pixel-edge/requirements.txt 'pytest>=8,<9'
      - name: Verify durable admission and special-file rejection
        run: >-
          python -m pytest -q
          ods/extensions/services/pixel-edge/tests/test_transition_gate.py
          ods/extensions/services/pixel-edge/tests/test_transition_gate_special_files.py
      - name: Verify edge HTTP and streaming contracts
        run: python -m pytest -q ods/extensions/services/pixel-edge/tests/test_pixel_edge.py

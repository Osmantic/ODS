name: Installer CLI binding
on:
  pull_request:
    paths:
      - 'ods/installers/lib/cli-link.sh'
      - 'ods/tests/test_cli_link_precedence.py'
      - 'ods/tests/test-cli-link-refresh.sh'
      - '.github/workflows/test-cli-link-precedence.yml'
permissions:
  contents: read
jobs:
  binding:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/test-tools.txt
      - run: python -m pytest -q ods/tests/test_cli_link_precedence.py
      - run: bash ods/tests/test-cli-link-refresh.sh

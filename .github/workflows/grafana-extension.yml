name: Grafana extension
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/grafana/**'
      - 'ods/tests/test_grafana.py'
      - 'ods/tests/fixtures/grafana-*.py'
      - '.github/workflows/grafana-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest ods/tests/test_grafana.py -q -s
        env:
          ODS_TEST_GRAFANA: '1'

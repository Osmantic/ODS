name: ChromaDB persistence contract

on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/chromadb/**'
      - 'ods/tests/test_chromadb_persistence.py'
      - '.github/workflows/chromadb-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Install boundary test dependencies
        run: python -m pip install pytest==8.3.5 httpx==0.28.1
      - name: Verify fresh persistence and cold legacy recovery
        env:
          ODS_TEST_CHROMADB_PERSISTENCE: '1'
        run: python -m pytest -q ods/tests/test_chromadb_persistence.py

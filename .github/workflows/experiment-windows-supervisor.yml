name: Windows Native Supervisor Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ods/experimental/windows-supervisor/**'
      - '.github/workflows/experiment-windows-supervisor.yml'

permissions:
  contents: read

jobs:
  test-supervisor:
    name: Windows Native Supervisor Test Suite
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r ods/extensions/services/dashboard-api/requirements.txt
          pip install uvicorn httpx requests pyyaml

      - name: Cache Runtime and Model Assets
        uses: actions/cache@v4
        with:
          path: ods/experimental/windows-supervisor/test_data/shared_data
          key: windows-supervisor-assets-b9014-smollm2-${{ hashFiles('ods/experimental/windows-supervisor/supervisor.py') }}
          restore-keys: |
            windows-supervisor-assets-b9014-smollm2-

      - name: Run Windows Native Supervisor Test Suite
        shell: bash
        run: |
          mkdir -p ci-logs
          python ods/experimental/windows-supervisor/test_supervisor.py 2>&1 | tee ci-logs/test_supervisor.log

      - name: Upload Test Logs and Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supervisor-test-results-windows
          path: ci-logs/

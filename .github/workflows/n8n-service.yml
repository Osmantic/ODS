name: n8n service contracts
on:
  pull_request:
    paths:
      - 'ods/extensions/services/n8n/**'
      - '.github/workflows/n8n-service.yml'
  push:
    branches: [main]
    paths:
      - 'ods/extensions/services/n8n/**'
      - '.github/workflows/n8n-service.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      # node:sqlite needs Node 22.13 or later; the pinned n8n image runs Node 26.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Owner from .env and pre-upgrade backup
        run: node --test ods/extensions/services/n8n/tests/n8n_prepare.test.mjs

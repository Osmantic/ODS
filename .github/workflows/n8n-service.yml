name: n8n service contracts
on:
  pull_request:
    paths:
      - 'ods/extensions/services/n8n/**'
      - '.github/workflows/n8n-service.yml'
  push:
    branches: [main]
    paths:
      - 'ods/extensions/services/n8n/**'
      - '.github/workflows/n8n-service.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # node:sqlite needs Node 22.13 or later; the pinned n8n image runs Node 26.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Owner from .env and pre-upgrade backup
        run: node --test ods/extensions/services/n8n/tests/n8n_prepare.test.mjs

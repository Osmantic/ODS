name: LocalAI manual model guide
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/localai/**'
      - 'ods/tests/test_localai_manual_model_directory.py'
      - '.github/workflows/localai-manual-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest PyYAML
      - run: python -m pytest ods/tests/test_localai_manual_model_directory.py -q

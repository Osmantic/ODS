name: WireMock extension
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/wiremock/**'
      - 'ods/tests/test_wiremock.py'
      - '.github/workflows/wiremock-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest ods/tests/test_wiremock.py -q
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: sudo --preserve-env=PATH env ODS_TEST_WIREMOCK=1 python -m pytest ods/tests/test_wiremock.py -q -s

name: Miniflux advertised port
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/miniflux/**'
      - 'ods/tests/test_miniflux_advertised_port.py'
      - 'ods/tests/test_miniflux_extension.py'
      - '.github/workflows/miniflux-advertised-port.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest PyYAML 'httpx==0.27.2'
      - run: ODS_TEST_MINIFLUX_LINKS=1 ODS_TEST_MINIFLUX_DOCKER=1 python -m pytest ods/tests/test_miniflux_advertised_port.py ods/tests/test_miniflux_extension.py -q -s

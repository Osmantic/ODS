name: Bark generation admission
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/bark/**'
      - 'ods/tests/test_bark_generation_admission.py'
      - '.github/workflows/bark-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest 'fastapi==0.111.0' 'httpx==0.27.2' 'soundfile==0.12.1' 'numpy==1.26.4'
      - run: python -m pytest ods/tests/test_bark_generation_admission.py -q

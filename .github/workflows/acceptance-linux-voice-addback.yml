name: Acceptance Linux voice add-back

on:
  push:
    branches:
      - codex/ods-voice-addback-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-addback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-addback:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Checkout exact ODS main candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: d7a3d16e61887f77a547ac0c7cd3fcba2ab54460
          path: product
      - name: Record installed source and Docker capacity
        run: |
          test "$(git -C product rev-parse HEAD)" = d7a3d16e61887f77a547ac0c7cd3fcba2ab54460
          docker version
          df -h / "$RUNNER_TEMP"
      - name: Exercise installed voice Library add-back
        run: |
          ODS_ACCEPTANCE_PRODUCT_ROOT="$GITHUB_WORKSPACE/product/ods" \
            bash ods/tests/acceptance/voice-addback-journey.sh

name: Windows native

# ODS as a native Windows app: no Docker, no WSL. See ods/docs/WINDOWS-NATIVE-PLAN.md.
on:
  pull_request:
    paths:
      - '.github/workflows/windows-native.yml'
      - 'ods/installers/windows/native/**'
      - 'ods/installers/windows/lib/native-llama-runtime.ps1'
      - 'ods/config/backends/cpu.json'
      - 'ods/tests/contracts/test-windows-native-llama-runtime.ps1'
      - 'ods/extensions/services/dashboard-api/**'
      - 'ods/extensions/services/dashboard/**'
  push:
    branches:
      - 'feat/windows-native'
      - 'wn/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supervisor:
    name: Supervisor tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install 'pytest==9.1.1'
      - name: Run the supervisor tests
        working-directory: ods/installers/windows/native
        run: python -m pytest -q tests

  dashboard-e2e:
    name: Native dashboard and chat proxy end to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - name: Install the locked dashboard-api dependencies
        run: python -m pip install --require-hashes -r ods/extensions/services/dashboard-api/requirements.lock
      - name: Build the dashboard, run dashboard-api and the chat proxy natively, check the gate
        run: python ods/installers/windows/native/tests/e2e_dashboard_native.py

  powershell:
    name: Native PowerShell (lint and contracts)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ods
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force -ForceBootstrap
          }
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          Import-Module PSScriptAnalyzer -ErrorAction Stop
      - name: Analyze the native scripts
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -Path installers/windows/native -Filter *.ps1 -Recurse) +
                     @(Get-Item installers/windows/lib/native-llama-runtime.ps1)
          $failed = $false
          foreach ($script in $scripts) {
            $results = Invoke-ScriptAnalyzer -Path $script.FullName -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
            if ($results) { $results | Format-Table -AutoSize | Out-String | Write-Host; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Native runtime contracts (PowerShell 7)
        shell: pwsh
        run: ./tests/contracts/test-windows-native-llama-runtime.ps1
      - name: Native runtime contracts (Windows PowerShell)
        shell: powershell
        run: ./tests/contracts/test-windows-native-llama-runtime.ps1

  runtime-smoke:
    name: llama-server.exe starts and answers (CPU)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MODEL_URL: https://huggingface.co/ggml-org/test-model-stories260K/resolve/479896ec924af6d40fd419ab8f4d1eb2101de00d/stories260K-f32.gguf
      MODEL_SHA256: 270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Download the pinned test model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $model = Join-Path $env:RUNNER_TEMP 'stories260K-f32.gguf'
          curl.exe --fail --location --silent --show-error --output $model $env:MODEL_URL
          $actual = (Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant()
          if ($actual -ne $env:MODEL_SHA256) { throw "Model hash $actual, expected $env:MODEL_SHA256" }
      - name: Install, verify and smoke-start the CPU runtime (native-app profile)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Join-Path $env:RUNNER_TEMP 'ods-state'
          $result = ./ods/installers/windows/native/fetch-runtime.ps1 `
            -StateRoot $state `
            -Destination (Join-Path $env:RUNNER_TEMP 'ods-app\llama') `
            -ModelPath (Join-Path $env:RUNNER_TEMP 'stories260K-f32.gguf') `
            -NativeApp -StopAfterProof
          $result | Write-Host
          $proof = $result | Select-Object -Last 1 | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $proof.ExecutablePath)) { throw "No llama-server.exe at $($proof.ExecutablePath)" }
          if ($proof.Running) { throw 'llama-server was still running after -StopAfterProof' }
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-native-runtime-logs
          path: ${{ runner.temp }}/ods-state/native-runtime
          if-no-files-found: ignore

  installer:
    name: Installer round trip (build, silent install, start, uninstall)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MODEL_URL: https://huggingface.co/ggml-org/test-model-stories260K/resolve/479896ec924af6d40fd419ab8f4d1eb2101de00d/stories260K-f32.gguf
      MODEL_SHA256: 270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - name: Pester tests for the native helpers
        shell: pwsh
        run: Invoke-Pester -Path ods/installers/windows/native/tests -CI
      - name: Build the bundle
        shell: pwsh
        run: ./ods/installers/windows/native/build-bundle.ps1 -OutputDir (Join-Path $env:RUNNER_TEMP 'bundle')
      - name: Compile the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DBundleDir=$(Join-Path $env:RUNNER_TEMP 'bundle')" '/DAppVersion=0.0.0-ci' "/O$(Join-Path $env:RUNNER_TEMP 'out')" ods\installers\windows\native\installer\ODS.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
      - name: Install silently, per-user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'out') -Filter 'ODS-Setup-*.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART',"/LOG=$(Join-Path $env:RUNNER_TEMP 'setup.log')" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exited $($p.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\ODS\ods-native.ps1")) { throw 'App files missing after install' }
      - name: Start with a small model and check the dashboard answers on loopback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $model = Join-Path $env:RUNNER_TEMP 'stories260K-f32.gguf'
          curl.exe --fail --location --silent --show-error --output $model $env:MODEL_URL
          if ((Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant() -ne $env:MODEL_SHA256) { throw 'Model hash mismatch' }
          $ctl = "$env:LOCALAPPDATA\Programs\ODS\ods-native.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File $ctl stop
          if ($LASTEXITCODE -ne 0) { throw "stop exited $LASTEXITCODE" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $ctl install-state -ModelPath $model -CtxSize 2048
          if ($LASTEXITCODE -ne 0) { throw "install-state exited $LASTEXITCODE" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $ctl start
          if ($LASTEXITCODE -ne 0) { throw "start exited $LASTEXITCODE" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $ctl open -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "open exited $LASTEXITCODE" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $ctl status
          $health = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3002/health
          if ($health.StatusCode -ne 200) { throw "dashboard-api /health answered $($health.StatusCode)" }
          $llama = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/health
          if ($llama.StatusCode -ne 200) { throw "llama-server /health answered $($llama.StatusCode)" }
          # Every ODS listener is loopback-only.
          $ods = Get-NetTCPConnection -State Listen | Where-Object { $_.LocalPort -in 3002, 3004, 8080 }
          $ods | Format-Table LocalAddress, LocalPort, OwningProcess | Out-String | Write-Host
          if ($ods | Where-Object { $_.LocalAddress -notin '127.0.0.1', '::1' }) { throw 'An ODS service listens beyond loopback' }
      - name: Chat works through the proxy and the key stays on the server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = (Get-Content -Raw "$env:LOCALAPPDATA\ODS\Native\secrets\llama-server-api-key").Trim()
          # llama-server itself refuses a request without its key.
          $direct = curl.exe --silent --output NUL --write-out '%{http_code}' http://127.0.0.1:8080/v1/models
          if ($direct -ne '401') { throw "llama-server answered $direct without its key" }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3004/
          if ($page.StatusCode -ne 200) { throw "chat UI answered $($page.StatusCode)" }
          $body = '{"messages":[{"role":"user","content":"Once upon a time"}],"max_tokens":8}'
          $chat = Invoke-WebRequest -UseBasicParsing -Method Post -ContentType 'application/json' -Body $body http://127.0.0.1:3004/v1/chat/completions
          $reply = ($chat.Content | ConvertFrom-Json).choices[0].message.content
          Write-Host "Chat reply: $reply"
          if ($null -eq $reply) { throw 'No chat reply through the proxy' }
          $dash = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3002/
          foreach ($served in $page.Content, $chat.Content, $dash.Content) {
            if ($served.Contains($key)) { throw 'The llama-server key reached the browser' }
          }
      - name: A killed service is restarted by the supervisor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $owner = (Get-NetTCPConnection -State Listen -LocalPort 8080 | Select-Object -First 1).OwningProcess
          Stop-Process -Id $owner -Force
          $deadline = (Get-Date).AddSeconds(120)
          do {
            Start-Sleep -Seconds 2
            $now = Get-NetTCPConnection -State Listen -LocalPort 8080 -ErrorAction SilentlyContinue | Select-Object -First 1
          } until (($now -and $now.OwningProcess -ne $owner) -or (Get-Date) -ge $deadline)
          if (-not $now -or $now.OwningProcess -eq $owner) { throw 'llama-server was not restarted' }
          # /health answers 503 while the model loads.
          do {
            $code = curl.exe --silent --output NUL --write-out '%{http_code}' http://127.0.0.1:8080/health
            if ($code -ne '200') { Start-Sleep -Seconds 1 }
          } until ($code -eq '200' -or (Get-Date) -ge $deadline)
          if ($code -ne '200') { throw "restarted llama-server answered $code" }
          Write-Host "llama-server restarted as PID $($now.OwningProcess)"
      - name: Uninstall silently and check nothing is left
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process "$env:LOCALAPPDATA\Programs\ODS\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/REMOVEDATA' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall exited $($p.ExitCode)" }
          Start-Sleep -Seconds 5
          $left = @()
          foreach ($path in "$env:LOCALAPPDATA\Programs\ODS", "$env:LOCALAPPDATA\ODS\Native",
                            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\ods-native.vbs") {
            if (Test-Path -LiteralPath $path) { $left += $path }
          }
          if (Get-ScheduledTask -TaskName 'ODS' -ErrorAction SilentlyContinue) { $left += 'scheduled task ODS' }
          if (Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 3002, 3004, 8080 }) { $left += 'listener on 3002/3004/8080' }
          if ($left) { throw "Left behind after uninstall: $($left -join ', ')" }
      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-native-installer-logs
          path: |
            ${{ runner.temp }}/setup.log
            ~/AppData/Local/ODS/Native/logs
          if-no-files-found: ignore

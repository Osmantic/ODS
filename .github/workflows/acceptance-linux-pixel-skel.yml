name: Acceptance Linux Pixel broker clean home

on:
  push:
    branches:
      - codex/ods-pixel-skel-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-skel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-broker-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Checkout exact broker-home candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: dfdc5fd56715339867e2010cba15adbdeaef3a40
          path: product
      - name: Exercise fresh broker home on installed ODS
        env:
          ODS_ACCEPTANCE_PRODUCT_ROOT: ${{ github.workspace }}/product/ods
        run: bash ods/tests/acceptance/pixel-skel-fresh-journey.sh

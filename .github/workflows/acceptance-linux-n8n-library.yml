name: Acceptance Linux bundled n8n Library

on:
  push:
    branches:
      - codex/ods-n8n-library-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8n-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  n8n-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Checkout exact n8n Library candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 2780f511327fa2462ee537482390ef0f004616dd
          path: product
      - name: Exercise bundled n8n Add and Disable on installed ODS
        env:
          ODS_ACCEPTANCE_PRODUCT_ROOT: ${{ github.workspace }}/product/ods
        run: bash ods/tests/acceptance/n8n-library-journey.sh

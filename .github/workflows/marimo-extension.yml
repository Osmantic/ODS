name: marimo extension
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/marimo/**'
      - 'ods/tests/test_marimo.py'
      - 'ods/tests/fixtures/marimo-http.py'
      - '.github/workflows/marimo-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest ods/tests/test_marimo.py -q -s
        env:
          ODS_TEST_MARIMO: '1'

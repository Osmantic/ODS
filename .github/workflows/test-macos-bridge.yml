permissions:
  contents: read

jobs:
  socket-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7' 'Pillow==12.3.0'
      - name: Install backup tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rsync jq
      - name: Install backup tools on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install rsync jq
      - name: Verify private dashboard store migration and backup recovery
        run: python -m pytest -q ods/tests/test_macos_dashboard_private_state.py ods/tests/test_macos_private_store_native_integration.py
      - name: Install modern Bash for macOS CLI fixtures
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install bash
      - name: Verify protected macOS bootstrap promotion and retained-state refusal
        run: >-
          python -m pytest -q
          ods/tests/test_macos_bootstrap_promote.py
          ods/tests/test_macos_bootstrap_dispatch.py
      - name: Verify saved macOS bootstrap resume arguments
        run: bash ods/tests/test-macos-bootstrap-resume.sh
      - name: Verify mode application refreshes only a stale host agent
        run: bash ods/tests/test-mode-restart-agent.sh
      - name: Verify native parent finishes before host-agent mode refresh
        run: bash ods/tests/test-macos-native-mode-refresh.sh
      - name: Verify the one-line bootstrap runs under the system Bash
        run: python -m pytest -q ods/tests/test_bootstrap_system_bash.py
      - name: Verify native retirement precedes destructive uninstall
        run: bash ods/tests/test-macos-uninstall-launchagents.sh
      - name: Verify bridge admission and real HTTP forwarding
        run: python -m pytest -q ods/tests/test_bridge_denied_admission.py ods/tests/test_macos_llm_bridge.py
      - name: Verify private environment rollback custody
        run: python -m pytest -q ods/tests/test_macos_upsert_env_value.py
      - name: Verify saved Python selection from a fresh macOS CLI shell
        run: |
          bash ods/tests/test-macos-cli-saved-python.sh
          bash ods/tests/test-macos-env-quote-strip.sh
      - name: Verify private ingress and held native lifecycle contracts
        run: >-
          ODS_LIFECYCLE_TEST_BASH="$(command -v bash)" python -m pytest -q
          ods/tests/test_macos_pixel_ingress_config.py
          ods/tests/test_macos_pixel_config_volume.py
          ods/tests/test_macos_pixel_ingress_refresh.py
          ods/tests/test_macos_pixel_ingress_cli.py
          ods/tests/test_macos_pixel_ingress_probe.py
          ods/tests/test_macos_pixel_ingress_recipe.py
          ods/tests/test_macos_pixel_lifecycle.py
          ods/tests/test_macos_pixel_lifecycle_stack.py
      - name: Verify full native recipe hashes and zero-scaled targets without a daemon
        if: runner.os == 'Linux'
        run: ODS_LIFECYCLE_COMPOSE_CONTROL=1 python -m pytest -q ods/tests/test_macos_pixel_lifecycle_recipe.py
      - name: Verify native installer, update and startup contracts
        run: >-
          python -m pytest -q
          ods/tests/test_macos_pixel_native_install.py
          ods/tests/test_macos_pixel_native_uninstall.py
          ods/tests/test_macos_pixel_ops_account.py
          ods/tests/test_macos_pixel_native_update.py
          ods/tests/test_macos_pixel_migration_source_proof.py
          ods/tests/test_pixel_workspace_guidance.py
          ods/tests/test_macos_pixel_controller_repair.py
          ods/tests/test_macos_pixel_controller_held_proof.py
          ods/tests/test_macos_pixel_native_finalize.py
          ods/tests/test_macos_pixel_native_recover.py
          ods/tests/test_macos_pixel_access_install.py
          ods/tests/test_macos_pixel_runtime_upgrade.py
          ods/tests/test_pixel_startup_reproof.py
          ods/tests/test_macos_memory_budget.py
          ods/tests/test_macos_pixel_ops_state.py

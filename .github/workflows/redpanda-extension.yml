name: Redpanda extension
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/redpanda/**'
      - 'ods/tests/test_redpanda.py'
      - '.github/workflows/redpanda-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest PyYAML 'confluent-kafka==2.11.1'
      - run: python -m pytest ods/tests/test_redpanda.py -q
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest PyYAML 'confluent-kafka==2.11.1'
      - run: sudo --preserve-env=PATH env ODS_TEST_REDPANDA=1 python -m pytest ods/tests/test_redpanda.py -q -s

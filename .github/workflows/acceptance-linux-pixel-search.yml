name: Acceptance Linux Pixel search binding

on:
  push:
    branches:
      - codex/ods-pixel-search-port-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-search-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixel-search-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Checkout exact conditional-search candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: d82d4820530d1b513c1ee208eda6dfb8efaef248
          path: product
      - name: Record exact source and runner capacity
        run: |
          test "$(git -C product rev-parse HEAD)" = d82d4820530d1b513c1ee208eda6dfb8efaef248
          docker version
          df -h / "$RUNNER_TEMP"
          cat /proc/1/comm
      - name: Exercise unselected and selected SearXNG on installed Pixel
        env:
          ODS_ACCEPTANCE_PRODUCT_ROOT: ${{ github.workspace }}/product/ods
        run: bash ods/tests/acceptance/pixel-search-selection-journey.sh

name: Release tree portability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  committed-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.4.2' 'PyYAML==6.0.3'
      # Every committed path matters, even when the packaging code is unchanged.
      # Cross-platform producer contracts retain their narrower path filter.
      - run: python -m pytest .github/scripts/test_release_source.py -q -k real_repository_source

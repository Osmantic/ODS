name: Memory Shepherd remote read regression

on:
  pull_request:
    paths:
      - 'ods/memory-shepherd/**'
      - 'ods/tests/test-memory-shepherd-remote-read.sh'
      - '.github/workflows/test-memory-remote-read.yml'
  push:
    branches: [main, public-beta]
    paths:
      - 'ods/memory-shepherd/**'
      - 'ods/tests/test-memory-shepherd-remote-read.sh'
      - '.github/workflows/test-memory-remote-read.yml'

permissions:
  contents: read

jobs:
  remote-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Preserve memory when its SCP read fails
        run: sudo bash ods/tests/test-memory-shepherd-remote-read.sh

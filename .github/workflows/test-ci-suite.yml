name: Extended contract suite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Install PyYAML to read workflow steps
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Self-test the inventory
        run: python -m unittest discover -s .github/scripts -p test_list_unwired_tests.py
      - name: Test tool preparation contracts
        run: python -m unittest discover -s .github/scripts -p test_ci_tool_setup.py
      - name: Every test runs in CI or is recorded as not run
        run: python .github/scripts/list-unwired-tests.py --check

  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ods
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - name: Install test tools
        timeout-minutes: 10
        run: |
          python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7' 'jsonschema>=4,<5' 'httpx>=0.27,<1' 'requests>=2,<3'
          missing=()
          for tool in jq shellcheck; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing+=("$tool")
            fi
          done
          if (( ${#missing[@]} )); then
            sudo timeout 180 apt-get -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
              -o APT::Update::Error-Mode=any update
            sudo env DEBIAN_FRONTEND=noninteractive timeout 180 apt-get \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 install -y "${missing[@]}"
          fi
          jq --version
          shellcheck --version
      - name: Run tests/ci-suite.txt
        run: bash tests/run-ci-suite.sh

name: Extended contract suite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Install PyYAML to read workflow steps
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Self-test the inventory
        run: python -m unittest discover -s .github/scripts -p test_list_unwired_tests.py
      - name: Every test runs in CI or is recorded as not run
        run: python .github/scripts/list-unwired-tests.py --check

  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ods
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7' 'jsonschema>=4,<5' 'httpx>=0.27,<1' 'requests>=2,<3'
          sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck > /dev/null
      - name: Run tests/ci-suite.txt
        run: bash tests/run-ci-suite.sh

name: Portal project build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  managed-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ods
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - run: python -m pip install 'pytest>=8,<9'
      - name: Project contracts and actual Docker execution
        env:
          ODS_TEST_PROJECT_NODE: '1'
          ODS_TEST_PROJECT_PYTHON: '1'
          ODS_TEST_PROJECT_DIAGNOSTIC: '1'
        run: >-
          python -m pytest -q extensions/services/pixel-agent/tests/test_project_*.py
          tests/test_pixel_project_install.py tests/test_pixel_runtime_budget.py
      - name: Portal registration and transport
        run: node --test extensions/services/pixel-agent/tests/project_*.test.mjs
      - name: Diagnose failed Docker execution
        if: failure()
        continue-on-error: true
        run: |
          # Keep the original test failure and deadlines. These observations
          # distinguish engine/runner stalls from project execution failures.
          python - <<'PY'
          import json, os, shutil, subprocess, time
          from pathlib import Path
          result = {'loadavg': os.getloadavg(), 'disk': {}}
          for directory in ('/', '/tmp', '/var/lib/docker'):
              try:
                  result['disk'][directory] = shutil.disk_usage(directory)._asdict()
              except OSError as error:
                  result['disk'][directory] = {'error': type(error).__name__}
          result['memory'] = [line for line in Path('/proc/meminfo').read_text().splitlines()
                              if line.startswith(('MemTotal:', 'MemAvailable:', 'SwapFree:'))]
          result['pressure'] = {name: Path('/proc/pressure/' + name).read_text()
                                for name in ('cpu', 'memory', 'io')}
          result['engine_info_samples'] = []
          for _ in range(3):
              started = time.monotonic()
              sample = {}
              try:
                  process = subprocess.run(['docker', 'info', '--format', '{{.MemTotal}}'],
                                           capture_output=True, text=True, timeout=5)
                  sample.update(return_code=process.returncode,
                                memory_bytes=int(process.stdout.strip()) if process.stdout.strip().isdigit() else None,
                                stderr_bytes=len(process.stderr.encode()))
              except (OSError, subprocess.SubprocessError) as error:
                  sample['error'] = type(error).__name__
              sample['elapsed_seconds'] = round(time.monotonic() - started, 3)
              result['engine_info_samples'].append(sample)
          print(json.dumps(result, indent=2))
          PY
          timeout 10s sudo journalctl -u docker.service -u containerd.service --since '-10 min' --no-pager -n 120 || true

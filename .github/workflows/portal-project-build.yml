name: Portal project build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  managed-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ods
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - run: python -m pip install 'pytest>=8,<9'
      - name: Project contracts and actual Docker execution
        env:
          ODS_TEST_PROJECT_NODE: '1'
          ODS_TEST_PROJECT_PYTHON: '1'
        run: >-
          python -m pytest -q extensions/services/pixel-agent/tests/test_project_*.py
          tests/test_pixel_project_install.py tests/test_pixel_runtime_budget.py
      - name: Portal registration and transport
        run: node --test extensions/services/pixel-agent/tests/project_*.test.mjs

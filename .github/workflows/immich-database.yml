name: Immich database contract

on:
  pull_request:
    paths:
      - '.github/workflows/immich-database.yml'
      - 'ods/extensions/library/services/immich/**'
      - 'ods/tests/test_immich_database.py'
  push:
    branches: [main, public-beta]
    paths:
      - '.github/workflows/immich-database.yml'
      - 'ods/extensions/library/services/immich/**'
      - 'ods/tests/test_immich_database.py'

permissions:
  contents: read

jobs:
  immich-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<9'
      - name: Rendered identity, TCP authentication, and database recreation
        working-directory: ods
        env:
          ODS_TEST_IMMICH_POSTGRES: '1'
        run: python -m pytest -q tests/test_immich_database.py

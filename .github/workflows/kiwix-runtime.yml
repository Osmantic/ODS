name: Kiwix archive runtime contract

on:
  pull_request:
    paths:
      - '.github/workflows/kiwix-runtime.yml'
      - 'ods/extensions/library/services/kiwix/**'
      - 'ods/tests/test_kiwix_extension.py'
  push:
    branches: [main, public-beta]
    paths:
      - '.github/workflows/kiwix-runtime.yml'
      - 'ods/extensions/library/services/kiwix/**'
      - 'ods/tests/test_kiwix_extension.py'

permissions:
  contents: read

jobs:
  kiwix-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7' 'httpx>=0.27,<0.29' 'libzim==3.13.0'
      - name: Local ZIM catalog, article, full-text search and recreation
        working-directory: ods
        env:
          ODS_TEST_KIWIX_LIVE: '1'
        run: python -m pytest -q tests/test_kiwix_extension.py

name: Glances monitoring contract

on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/glances/**'
      - 'ods/tests/test_glances_extension.py'
      - '.github/workflows/glances-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glances-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest PyYAML
      - name: Verify Glances extension contract
        run: python -m pytest -q ods/tests/test_glances_extension.py

name: Remote egress header contracts
on:
  pull_request:
    paths:
      - 'ods/bin/remote_provider/**'
      - 'ods/extensions/services/remote-provider-egress/**'
      - 'ods/tests/test_egress_connection_headers.py'
      - '.github/workflows/test-egress-headers.yml'
permissions:
  contents: read
jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r ods/extensions/services/remote-provider-egress/requirements.txt pytest
      - run: python -m pytest -q ods/tests/test_egress_connection_headers.py
      - run: python ods/tests/contracts/test-remote-provider-egress-service.py

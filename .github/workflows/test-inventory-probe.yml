name: Unexecuted test probe (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/test-inventory-probe.yml'
      - '.github/probe-tests.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7' 'jsonschema>=4,<5' 'httpx>=0.27,<1' 'requests>=2,<3'
          sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck bats > /dev/null
      - name: Run every listed test once
        run: |
          : > results.tsv
          while IFS= read -r rel; do
            [[ -z "$rel" ]] && continue
            start=$(date +%s)
            case "$rel" in
              *.sh)   cmd=(bash "$rel") ;;
              *.bats) cmd=(bats "$rel") ;;
              *.mjs)  cmd=(node --test "$rel") ;;
              */test_*.py) cmd=(python -m pytest -q -p no:cacheprovider "$rel") ;;
              *.py)   cmd=(python3 "$rel") ;;
            esac
            set +e
            (cd ods && timeout 120 "${cmd[@]}") > out.log 2>&1 < /dev/null
            code=$?
            set -e
            secs=$(( $(date +%s) - start ))
            last="$(tail -c 400 out.log | tr '\n\t' '  ' | tail -c 200)"
            printf '%s\t%s\t%s\t%s\n' "$code" "$secs" "$rel" "$last" >> results.tsv
            echo "::group::$code ${secs}s $rel"; tail -60 out.log; echo "::endgroup::"
          done < .github/probe-tests.txt
          awk -F'\t' '$1==0' results.tsv | wc -l | xargs echo "passing:"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: probe-results
          path: results.tsv

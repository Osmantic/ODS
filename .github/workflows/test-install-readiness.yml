name: Test install readiness

on:
  pull_request:
  push:
    branches: [main, master, public-beta]

jobs:
  readiness:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest ods/tests/test_readiness_short_circuit.py -q
      - run: bash ods/tests/test-install-readiness-summary.sh
      - run: bash ods/tests/test-install-readiness-model-route.sh
      - run: bash ods/tests/test-install-switchboard-completion.sh
      - run: python ods/tests/test-switchboard-install-proof.py

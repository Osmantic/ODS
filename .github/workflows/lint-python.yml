name: Python Lint

on:
  push:
    branches: [main, public-beta]
  pull_request:
    branches: [main, public-beta]

permissions:
  contents: read

jobs:
  ruff:
    name: Lint Python with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.15.12

      - name: Run Ruff on ods Python files
        run: |
          ruff check ods/ \
            --select E,F,W \
            --ignore E501,E701,E731,E741,E402

      # This job runs Python 3.12, but the code does not: the host agent and
      # installer helpers run on the host's python3 from 3.9, and service images
      # use 3.11 or newer. Ruff reports syntax the target version cannot parse,
      # such as a backslash inside an f-string expression (3.12 only).
      - name: Check Python syntax against Python 3.9
        run: ruff check ods/ --target-version py39 --select E9

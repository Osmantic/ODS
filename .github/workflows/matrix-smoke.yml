name: Matrix Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ods
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: AMD Path Smoke
        run: bash tests/smoke/linux-amd.sh

      - name: NVIDIA Path Smoke
        run: bash tests/smoke/linux-nvidia.sh

      - name: WSL Logic Smoke
        run: bash tests/smoke/wsl-logic.sh

      - name: Pixel Execution Cancellation
        run: python3 tests/test_pixel_cancellable_exec.py

      - name: Mobile Dispatch Smoke
        run: bash tests/smoke/mobile-dispatch.sh

  # Multi-distro installer detection tests (dry-run, no GPU required)
  distro-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-26.04
            container: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
            expected_pkg: apt
          - distro: ubuntu-24.04
            container: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
            expected_pkg: apt
          - distro: ubuntu-22.04
            container: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
            expected_pkg: apt
          - distro: debian-12
            container: debian:12@sha256:f37a335e82bca302e955fa39f9dfe28f1be618f016f8a2b56318e5a5111afc26
            expected_pkg: apt
          - distro: linux-mint-21.3
            container: linuxmintd/mint21.3-amd64:latest@sha256:c21780951eb8b1a626078d06e761047d21b3479aa242c11569e141581f012d11
            expected_pkg: apt
          - distro: fedora-41
            container: fedora:41@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d
            expected_pkg: dnf
          - distro: rocky-9
            container: rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6
            expected_pkg: dnf
          - distro: archlinux
            container: archlinux:latest@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
            expected_pkg: pacman
          - distro: manjaro
            container: manjarolinux/base:latest@sha256:bbf1f1d746f28e138eea610e140d2f28cbb5b7c5da2fbff034b883527aa604e9
            expected_pkg: pacman
          - distro: cachyos
            container: cachyos/cachyos:latest@sha256:8b4b0f636bef9e5d091be5f753725e3309b9d8e20e23ed4cc3b61e626ab78428
            expected_pkg: pacman
          - distro: opensuse-tw
            container: opensuse/tumbleweed:latest@sha256:4a2d9146d8565555a85d212f36009b1631ef63bbe1bf2eaf2c9f5b666f661e31
            expected_pkg: zypper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ matrix.container }}
    defaults:
      run:
        working-directory: ods
    name: "distro: ${{ matrix.distro }}"
    steps:
      - name: Install checkout prerequisites (distro-aware)
        working-directory: /
        shell: bash
        run: |
          retry() {
            attempt=1
            max=3
            delay=15
            until "$@"; do
              status=$?
              if [ "$attempt" -ge "$max" ]; then
                return "$status"
              fi
              echo "Command failed (attempt ${attempt}/${max}): $*"
              echo "Retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          bounded() {
            seconds="$1"
            shift
            if command -v timeout >/dev/null 2>&1; then
              timeout "$seconds" "$@"
            else
              "$@"
            fi
          }

          prepare_pacman_keyrings() {
            command -v pacman-key >/dev/null 2>&1 || return 0
            pacman-key --init || true
            for ring in archlinux manjaro cachyos; do
              if [ -f "/usr/share/pacman/keyrings/${ring}.gpg" ]; then
                pacman-key --populate "$ring" || true
              fi
            done
          }

          configure_zypper_ci_network() {
            mkdir -p /etc/zypp/zypp.conf.d
            {
              printf '%s\n' '[main]'
              printf '%s\n' 'download.transfer_timeout = 180'
              printf '%s\n' 'download.connect_timeout = 30'
              printf '%s\n' 'download.min_download_speed = 0'
              printf '%s\n' 'download.max_silent_tries = 3'
              printf '%s\n' 'download.max_concurrent_connections = 2'
            } >/etc/zypp/zypp.conf.d/99-ods-ci-network.conf
          }

          if command -v apt-get &>/dev/null; then
            apt-get update -qq && apt-get install -y -qq ca-certificates git curl
          elif command -v dnf &>/dev/null; then
            dnf install -y -q ca-certificates git curl-minimal
          elif command -v pacman &>/dev/null; then
            prepare_pacman_keyrings
            retry pacman -Syyu --noconfirm --needed ca-certificates git curl
          elif command -v zypper &>/dev/null; then
            configure_zypper_ci_network
            echo "Skipping zypper checkout prerequisites; packaging.sh install behavior is tested after checkout."
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Verify /etc/os-release
        working-directory: /
        shell: bash
        run: |
          echo "=== /etc/os-release ==="
          cat /etc/os-release
          . /etc/os-release
          echo "ID=$ID"
          echo "ID_LIKE=${ID_LIKE:-none}"

      - name: Test packaging.sh detection
        shell: bash
        run: |
          # Source the packaging library and verify detection
          export LOG_FILE=/dev/null
          log() { echo "[INFO] $1"; }
          warn() { echo "[WARN] $1"; }
          error() { echo "[ERROR] $1"; exit 1; }
          source installers/lib/packaging.sh
          detect_pkg_manager

          echo "Detected: PKG_MANAGER=$PKG_MANAGER"
          echo "Expected: ${{ matrix.expected_pkg }}"

          if [[ "$PKG_MANAGER" != "${{ matrix.expected_pkg }}" ]]; then
            echo "FAIL: expected ${{ matrix.expected_pkg }}, got $PKG_MANAGER"
            exit 1
          fi
          echo "PASS: package manager detection correct"

      - name: Test pkg_install (install jq + rsync)
        shell: bash
        run: |
          export LOG_FILE="$RUNNER_TEMP/ods-packaging.log"
          trap 'cat "$LOG_FILE" >&2' EXIT
          log() { echo "[INFO] $1"; }
          warn() { echo "[WARN] $1"; }
          error() { echo "[ERROR] $1"; exit 1; }
          source installers/lib/packaging.sh
          detect_pkg_manager
          pkg_update
          pkg_install curl jq rsync

          # Verify the core tools used by installer phases.
          if command -v curl &>/dev/null; then
            echo "PASS: curl available"
          else
            echo "FAIL: curl not available after pkg_install"
            exit 1
          fi
          if command -v rsync &>/dev/null; then
            echo "PASS: rsync available"
          else
            echo "FAIL: rsync not available after pkg_install"
            exit 1
          fi

      - name: Test installer bash syntax
        run: |
          bash -n install-core.sh
          bash -n installers/lib/packaging.sh
          # A step exits with the status of its last command, so the loop
          # must carry a failed check out instead of ending on an echo.
          status=0
          for f in installers/phases/*.sh; do
            if bash -n "$f"; then
              echo "  OK: $f"
            else
              echo "  FAIL: $f"
              status=1
            fi
          done
          exit "$status"

  macos-smoke:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ods
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: macOS Dispatch Smoke
        run: bash tests/smoke/macos-dispatch.sh

      - name: macOS Installer Presentation Contract
        run: /bin/bash tests/contracts/test-macos-installer-presentation.sh

      - name: Native Model Store Restart Tests
        run: /bin/bash tests/test-macos-native-model-store.sh

      - name: Pixel Execution Cancellation
        run: python3 tests/test_pixel_cancellable_exec.py

      - name: Unix Peer Identity Tests
        run: python3 extensions/services/pixel-agent/tests/test_unix_peer.py

      - name: Set Up Pixel Edge Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Native Pixel Edge Tests
        env:
          # Short, canonical paths satisfy both Unix socket length and custody checks.
          TMPDIR: /private/tmp
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ../.github/requirements/pixel-edge-tests.txt
          python -m pytest -q extensions/services/pixel-edge/tests

      - name: Native Pixel Installer And Recovery Tests
        env:
          TMPDIR: /private/tmp
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ../.github/requirements/test-tools.txt
          python -m pytest -q tests/test_macos_pixel_*.py tests/test_macos_runtime_*.py tests/test_macos_upgrade_process_crash.py tests/test_macos_protected_replace.py tests/test_pixel_startup_reproof.py tests/test_pixel_native_compose.py
          python -m unittest discover -s tests -p 'test_pixel_*.py' -q

      - name: Atomic Environment Write Tests
        run: /bin/bash tests/test-atomic-env-writes.sh

      - name: Bash 3.2 syntax check (catches declare -g, associative arrays, etc.)
        run: |
          echo "=== Checking installer scripts for Bash 3.2 compatibility ==="
          FAIL=0
          for f in install-core.sh installers/phases/*.sh installers/lib/*.sh; do
            if [[ -f "$f" ]]; then
              # macOS ships Bash 3.2 at /bin/bash — use it for syntax check
              if /bin/bash -n "$f" 2>/dev/null; then
                echo "  OK: $f"
              else
                echo "  FAIL: $f"
                FAIL=1
              fi
            fi
          done
          # Also check macOS-specific scripts
          for f in installers/macos/**/*.sh; do
            if [[ -f "$f" ]]; then
              if /bin/bash -n "$f" 2>/dev/null; then
                echo "  OK: $f"
              else
                echo "  FAIL: $f"
                FAIL=1
              fi
            fi
          done
          if [[ $FAIL -eq 1 ]]; then
            echo ""
            echo "FAIL: Some scripts have Bash 3.2 syntax errors."
            echo "Common issues: declare -g, associative arrays (declare -A),"
            echo "  &>> redirection, |& pipes, [[ with regex =~"
            exit 1
          fi
          echo "PASS: All installer scripts parse under Bash 3.2"

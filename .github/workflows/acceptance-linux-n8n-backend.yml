name: Acceptance Linux bundled n8n backend

on:
  push:
    branches:
      - codex/ods-n8n-backend-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8n-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  n8n-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Checkout exact current-main product
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 21797f99c255b4a847fc05615f15c3a8ac3476e4
          path: product
      - name: Exercise bundled n8n enable API on installed ODS
        env:
          ODS_ACCEPTANCE_PRODUCT_ROOT: ${{ github.workspace }}/product/ods
        run: bash ods/tests/acceptance/n8n-backend-journey.sh

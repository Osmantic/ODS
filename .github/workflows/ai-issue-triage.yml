name: AI Issue Triage

# Paid work requires an explicit request by a user with repository write access.
# Model jobs receive no GitHub write permission, shell tools, or repository code.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open issue number to label'
        required: true
        type: string

permissions: {}

# Shared across triage and review so budget checks cannot race paid work.
concurrency:
  group: bounded-ai-maintainer-requests
  cancel-in-progress: false

env:
  TARGET_NUMBER: ${{ inputs.issue_number }}

jobs:
  prepare:
    name: Validate maintainer, budget and target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Prepare bounded input from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/bounded_ai.py prepare triage

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ai-request
          path: ai-data/request.json
          if-no-files-found: error
          retention-days: 1

  infer:
    name: One bounded model request
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-request
          path: ai-data

      - name: Request JSON without agent tools or GitHub credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .github/scripts/bounded_ai.py infer triage

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ai-result
          path: ai-data/result.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Apply validated labels to exact target
    needs: infer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-result
          path: ai-data

      - name: Validate target again and publish through fixed API operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/bounded_ai.py publish triage

name: Open Interpreter connection contract

on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/open-interpreter/**'
      - 'ods/tests/test_open_interpreter_connection.py'
      - '.github/workflows/open-interpreter-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Install the wrapper's HTTP dependencies and test runner
        run: python -m pip install fastapi==0.111.0 pydantic==2.12.5 httpx==0.28.1 pytest==8.3.5
      - name: Verify authenticated routes and subprocess connection settings
        run: python -m pytest -q ods/tests/test_open_interpreter_connection.py

name: Test Linux

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  pixel-advice-host-stdlib:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Host import and runtime status require no optional dependencies
        working-directory: ods
        run: python -I -S tests/pixel_inference/check_advice_stdlib.py

  pixel-inference-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: ods
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated inference test dependencies
        run: python -m pip install -r extensions/services/pixel-inference/requirements.txt 'pytest>=8,<9'
      - name: Sharing credential and owner control tests
        run: python -m pytest tests/pixel_inference -q
      - name: Inference perimeter and cancellation tests
        run: python -m pytest extensions/services/pixel-inference/tests -q
      - name: Model router compatibility and route pins
        run: python -m pytest extensions/services/model-router/tests -q
      - name: Settings transaction and access preservation contracts
        run: |
          python -m pytest -q tests/pixel_settings/test_contract.py tests/pixel_settings/test_projection.py \
            tests/pixel_settings/test_runtime.py tests/pixel_settings/test_coordinator.py \
            tests/pixel_settings/test_public_runtime.py tests/pixel_settings/test_host_http.py \
            extensions/services/pixel-agent/tests/test_settings_transaction.py \
            extensions/services/pixel-agent/tests/test_settings_worker_protocol.py \
            extensions/services/pixel-agent/tests/test_access_bridge.py \
            extensions/services/pixel-agent/tests/test_access_deadlines.py \
            extensions/services/pixel-agent/tests/test_settings_control_transport.py \
            extensions/services/pixel-agent/tests/test_pixel_access_mode.py \
            extensions/services/pixel-agent/tests/test_access_mode_config.py

  token-spy-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tokenspy
          POSTGRES_USER: tokenspy
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenspy -d tokenspy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ods/extensions/services/token-spy
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: tokenspy
      DB_USER: tokenspy
      DB_PASSWORD: testpass
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install "psycopg2-binary>=2.9.9,<3.0.0" "pytest>=8,<9"

      - name: Test Postgres SSE cursor
        run: python -m pytest tests/test_recent_events_cursor_postgres.py -v

  integration-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ods
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python for manifest validation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install manifest validator dependencies
        run: python3 -m pip install "PyYAML>=6.0,<7.0" "jsonschema>=4.21,<5.0"

      - name: Docs Link Checks
        run: bash tests/test-doc-links.sh

      - name: Install Documentation Contract
        run: |
          bash tests/test-install-docs.sh
          bash tests/test-hosted-bootstrap-verifier.sh

      - name: Fleet Host Lock Contract
        run: bash tests/test-fleet-host-lock.sh

      - name: Integration Smoke
        run: bash tests/integration-test.sh

      - name: Extension Audit
        run: |
          python3 scripts/audit-extensions.py --project-dir .
          bash tests/test-extension-audit.sh

      - name: Extension Runtime Check Tests
        run: bash tests/test-extension-runtime-check.sh

      - name: Phase C P1 Static Checks
        run: bash tests/test-phase-c-p1.sh

      - name: Manifest Compatibility Checks
        run: |
          bash scripts/check-compatibility.sh
          bash scripts/check-release-claims.sh

      - name: BATS Unit Tests
        run: bash tests/run-bats.sh

      - name: Tier Map Unit Tests
        run: bash tests/test-tier-map.sh

      - name: Active Model Preservation Tests
        run: python3 tests/test-preserve-active-model.py

      - name: Pixel Agent Model Selection Tests
        run: python3 tests/test-pixel-model-selector.py

      - name: Pixel Provider and Access Contracts
        run: python3 -m unittest discover -s tests -p 'test_pixel_*.py' -v

      - name: Service Registry Tests
        run: bash tests/test-service-registry.sh

      - name: Switchboard Bypass Inventory
        run: python3 tests/test-switchboard-bypass-inventory.py

      - name: Local Image Build Coverage
        run: python3 tests/test-local-image-build-coverage.py

      - name: Validate Manifests Tests
        run: |
          bash tests/test-validate-manifests.sh
          bash tests/test-validate-manifest-schema.sh

      - name: Health Check Tests
        run: bash tests/test-health-check.sh

      - name: QR Code Helper Tests
        run: bash tests/test-qrcode-helper.sh

      - name: n8n Cookie Policy Tests
        run: bash tests/test-n8n-cookie-policy.sh

      - name: brave-search searxng Compat Tests
        run: bash tests/test-brave-search-searxng-compat.sh

      - name: ODS Doctor Tests
        run: bash tests/test-ods-doctor.sh

      - name: Windows Report Command Tests
        run: bash tests/test-windows-report-command.sh

      - name: Compose Failure Report Tests
        run: bash tests/test-compose-failure-report.sh

      - name: Uninstall Compose Flags Tests
        run: bash tests/test-uninstall-compose-flags.sh

      - name: Windows Compose Failure Report Tests
        run: bash tests/test-windows-compose-failure-report.sh

      - name: Windows CLI Enable/Disable Tests
        run: bash tests/test-windows-cli-enable-disable.sh

      - name: CLI Enable Compose Reconciliation Tests
        run: bash tests/test-cli-enable-compose-reconciliation.sh

      - name: CLI Link Refresh Tests
        run: bash tests/test-cli-link-refresh.sh

      - name: Installer Mode Preservation Tests
        run: bash tests/test-installer-mode-preservation.sh

      - name: Windows Missing Service Hint Tests
        run: bash tests/test-windows-missing-service-hints.sh

      - name: Install Readiness Summary Tests
        run: bash tests/test-install-readiness-summary.sh

      - name: Windows Install Readiness Summary Tests
        run: bash tests/test-windows-readiness-summary.sh

      - name: Windows Service Plan Tests
        run: bash tests/test-windows-service-plan.sh

      - name: Windows Installer Flag Tests
        run: bash tests/test-windows-installer-flags.sh

      - name: Windows Bootstrap Download Handoff Tests
        run: bash tests/test-windows-bootstrap-download-handoff.sh

      - name: Validate Env Tests
        run: bash tests/test-validate-env.sh

      - name: Safe Env Loading Tests
        run: bash tests/test-safe-env.sh

      - name: Dotenv Serializer Tests
        run: bash tests/test-dotenv-serializer.sh

      - name: Mode Switch Tests
        run: bash tests/test-mode-switch-status.sh

      - name: CLI Install Directory Resolution Tests
        run: bash tests/test-cli-install-dir-resolution.sh

      - name: Validate Simulation Summary Tests
        run: bash tests/test-validate-sim-summary.sh

      - name: Golden Path Contract Tests
        run: bash tests/test-golden-paths.sh

      - name: Generated Config Contract Tests
        run: bash tests/test-generated-config-contracts.sh

      - name: Dependency Pin Contract Tests
        run: python3 tests/test-dependency-pins.py

      - name: Offline Model Validation Tests
        run: python3 tests/test-offline-model-validation.py

      - name: Runtime Config Renderer Tests
        run: python3 tests/test-render-runtime-configs.py

      - name: Runtime Config Wiring Tests
        run: python3 tests/test-runtime-config-wiring.py

      - name: Perplexica Entrypoint Contract Tests
        run: python3 tests/test-perplexica-entrypoint.py

      - name: CPU-Only Path Tests
        run: bash tests/test-cpu-only-path.sh

      - name: Hermes Slash Worker Prune Tests
        run: |
          bash tests/test-hermes-slash-worker-prune.sh
          python3 tests/contracts/test-hermes-worker-guardrails.py

      - name: Installer Contract Checks
        run: |
          bash tests/contracts/test-installer-contracts.sh
          bash tests/test-external-services.sh
          bash tests/test-resolve-compose-resilient.sh
          bash tests/test-phase03-multigpu-tty.sh
          bash tests/contracts/test-preflight-fixtures.sh
          bash tests/test-preflight-resolver-bug.sh
          bash tests/test-desktop-agent-host-env.sh
          bash tests/test-pixel-uninstall.sh
          python3 tests/contracts/test-network-exposure-contracts.py
          python3 tests/contracts/test-remote-provider-egress-policy.py
          python3 tests/contracts/test-remote-provider-egress-service.py

      - name: Pixel Default Agent Contract Tests
        run: |
          bash tests/test-pixel-integration.sh
          bash tests/test-pixel-host-install.sh
          python3 -m unittest -v tests/test_pixel_native_search.py
          bash tests/test-pixel-compose-wiring.sh
          python3 tests/test_pixel_timeout_contract.py
          python3 -m unittest -v extensions/services/pixel-agent/tests/test_artifact_promoter.py
          node --test extensions/services/pixel-agent/tests/*.test.mjs

      - name: Linux install preflight tests
        run: |
          bash tests/test-linux-install-preflight.sh
          bash tests/test-preflight-dashboard-port.sh
          bash tests/test-wsl-broken-docker-shim.sh

      - name: Installer Simulation Harness
        run: |
          bash scripts/simulate-installers.sh
          test -f artifacts/installer-sim/summary.json
          test -f artifacts/installer-sim/SUMMARY.md
          python3 scripts/validate-sim-summary.py artifacts/installer-sim/summary.json

      - name: Update Rollback Contract
        run: bash tests/test-update-rollback-contract.sh

      - name: Backup Data Coverage Contract
        run: bash tests/test-backup-data-coverage.sh

      - name: Bootstrap Upgrade Compose Flags Recovery Tests
        run: bash tests/test-bootstrap-upgrade-compose-flags-recovery.sh

      - name: Support Bundle Evidence Tests
        run: bash tests/test-support-bundle.sh

      - name: Config Migration Tests
        run: bash tests/test-migrate-config.sh

      - name: Atomic Environment Write Tests
        run: bash tests/test-atomic-env-writes.sh

      - name: Issue-to-PR Security Contract Tests
        run: bash tests/test-issue-to-pr-security.sh

      - name: NVIDIA Multi-GPU Visibility Contract Tests
        run: bash tests/test-multigpu-nvidia-visibility.sh

      - name: Upload Installer Simulation Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-sim
          path: |
            ods/artifacts/installer-sim/summary.json
            ods/artifacts/installer-sim/SUMMARY.md
            ods/artifacts/installer-sim/golden-paths.json
            ods/artifacts/installer-sim/linux-dryrun.log
            ods/artifacts/installer-sim/macos-installer.log
            ods/artifacts/installer-sim/windows-preflight-sim.json
            ods/artifacts/installer-sim/macos-preflight.json
            ods/artifacts/installer-sim/macos-doctor.json
            ods/artifacts/installer-sim/doctor.json
            ods/artifacts/update-rollback/evidence.json

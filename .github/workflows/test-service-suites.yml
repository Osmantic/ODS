name: Service test suites

# Runs each listed service's whole tests/ directory with that service's locked
# dependencies and the Python version of its image. Other services' tests run in
# dashboard.yml, test-linux.yml and portal-runtime.yml.
# .github/scripts/list-unwired-tests.py counts a service listed here as covered.
on:
  pull_request:
    paths:
      - "ods/extensions/services/ape/**"
      - "ods/extensions/services/pixel-model-relay/**"
      - "ods/extensions/services/privacy-shield/**"
      - "ods/extensions/services/token-spy/**"
      - ".github/workflows/test-service-suites.yml"
  push:
    branches: [main]
    paths:
      - "ods/extensions/services/ape/**"
      - "ods/extensions/services/pixel-model-relay/**"
      - "ods/extensions/services/privacy-shield/**"
      - "ods/extensions/services/token-spy/**"
      - ".github/workflows/test-service-suites.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ape
            python: "3.12"
          - service: pixel-model-relay
            python: "3.11"
          - service: privacy-shield
            python: "3.11"
          - service: token-spy
            python: "3.12"
    defaults:
      run:
        shell: bash
        working-directory: ods/extensions/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python }}

      # Token Spy's dashboard escaping tests execute the served JavaScript.
      - if: matrix.service == 'token-spy'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install the locked dependencies and test tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install 'pytest>=8,<9'
          if [[ -f tests/requirements-test.txt ]]; then
            python -m pip install -r tests/requirements-test.txt
          fi

      - name: Run the service's tests
        run: python -m pytest -q tests

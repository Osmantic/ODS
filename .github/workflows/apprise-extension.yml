name: Apprise extension
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/apprise/**'
      - 'ods/tests/test_apprise.py'
      - '.github/workflows/apprise-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest bcrypt==5.0.0
      - run: python -m pytest ods/tests/test_apprise.py -q
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest bcrypt==5.0.0
      - run: sudo --preserve-env=PATH env ODS_TEST_APPRISE=1 python -m pytest ods/tests/test_apprise.py -q -s

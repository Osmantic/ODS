name: External documentation links

on:
  pull_request:
    branches: [main, public-beta]
    paths:
      - '**/*.md'
      - '.github/lychee*'
      - '.github/external-link-exceptions.json'
      - '.github/scripts/*external_links.py'
      - '.github/scripts/install_lychee.py'
      - '.github/workflows/check-external-doc-links.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-doc-http-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-http:
    name: Anonymous public HTTP links
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Install checksum-pinned Lychee 0.24.2
        run: python .github/scripts/install_lychee.py --destination "$RUNNER_TEMP/lychee"
      - name: Test classification, integrity and local retry behavior
        env:
          LYCHEE_BINARY: ${{ runner.temp }}/lychee/lychee
        run: python -m unittest discover -s .github/scripts -p test_external_links.py -v
      - name: Check every public Markdown file with a twenty-minute deadline
        run: python .github/scripts/check_external_links.py --lychee "$RUNNER_TEMP/lychee/lychee"
      - name: Preserve anonymous results and reviewed exceptions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: external-documentation-links
          path: output/external-links/
          retention-days: 14
          if-no-files-found: warn

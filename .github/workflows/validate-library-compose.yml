name: Validate extension library compose

# The Dashboard's Extensions page installs these recipes on users' machines.
# validate-compose.yml covers the core stack and bundled services; this runs
# `docker compose config` on every library recipe and its GPU overlays.
on:
  push:
    branches: [main]
    paths:
      - "ods/extensions/library/services/**"
      - "ods/docker-compose.base.yml"
      - "ods/extensions/services/*/compose.yaml"
      - ".github/scripts/validate-library-compose.py"
      - ".github/workflows/validate-library-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "ods/extensions/library/services/**"
      - "ods/docker-compose.base.yml"
      - "ods/extensions/services/*/compose.yaml"
      - ".github/scripts/validate-library-compose.py"
      - ".github/workflows/validate-library-compose.yml"

permissions:
  contents: read

jobs:
  library-compose:
    name: Validate library recipes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install PyYAML to read recipe manifests
        run: python -m pip install 'PyYAML>=6,<7'

      - name: docker compose config for every recipe on the core stack
        run: python .github/scripts/validate-library-compose.py

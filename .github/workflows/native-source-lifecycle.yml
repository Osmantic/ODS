name: Native Source lifecycle mechanics

on:
  pull_request:
    paths:
      - 'ods/bin/**'
      - 'ods/installers/macos/lib/**'
      - 'ods/tests/test_native_source_*.py'
      - 'ods/tests/test_connection_deployment_paths.py'
      - 'ods/vendor/pixel.bundle'
      - 'ods/vendor/pixel/**'
      - '.github/workflows/native-source-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-source-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Linux mechanics / ${{ matrix.packet }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - packet: owned-child-and-repeat-runs
            filter: real_owned_child or repeated_sync
          - packet: sibling-and-refusal
            filter: sibling_invocation or effect_oneshots or non_dispatch_phases
          - packet: interrupted-publication
            filter: lost_reply
          - packet: rearm-and-abort
            filter: rearm_requires or direct_rearm or rearm_recovery or revocation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - name: Run isolated files, children and simulated Darwin metadata controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PACKET_FILTER: ${{ matrix.filter }}
        run: python -m pytest -q -p no:cacheprovider ods/tests/test_native_source_lifecycle.py -k "$PACKET_FILTER"

  compatibility:
    name: Linux mechanics / existing publisher and custody
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - name: Preserve cold publication, inert jobs, deadlines and child ownership
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -m pytest -q -p no:cacheprovider
          ods/tests/test_native_source_active_publication.py
          ods/tests/test_native_source_publisher_operation_cache.py
          ods/tests/test_native_source_root_deadline.py
          ods/tests/test_native_source_barrier.py
          ods/tests/test_native_source_child.py
          ods/tests/test_native_source_jobs.py
          ods/tests/test_connection_deployment_paths.py

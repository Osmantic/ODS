name: Signed release source

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Osmantic/ODS' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact: ods-source-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Verify signed tag and archive only its committed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_source.py prepare --output "$RUNNER_TEMP/ods-release"
      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/ods-release/source
          format: spdx-json
          output-file: ${{ runner.temp }}/ods-release/source.spdx.json
          syft-version: v1.52.0
          upload-artifact: false
          upload-release-assets: false
      - name: Bind source identity, archive hashes and SBOM
        run: python .github/scripts/release_source.py finalize --output "$RUNNER_TEMP/ods-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ods-source-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 2
          path: |
            ${{ runner.temp }}/ods-release/ODS-*-source.zip
            ${{ runner.temp }}/ods-release/ODS-*-source.tar.gz
            ${{ runner.temp }}/ods-release/source.spdx.json
            ${{ runner.temp }}/ods-release/release-manifest.json
            ${{ runner.temp }}/ods-release/SHA256SUMS

  attest:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact: ods-attested-source-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/ods-release
      - name: Check transferred package hashes
        working-directory: ${{ runner.temp }}/ods-release
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest source packages and inventory with GitHub OIDC
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/ods-release/ODS-*-source.zip
            ${{ runner.temp }}/ods-release/ODS-*-source.tar.gz
            ${{ runner.temp }}/ods-release/source.spdx.json
            ${{ runner.temp }}/ods-release/release-manifest.json
            ${{ runner.temp }}/ods-release/SHA256SUMS
      - name: Preserve the exact attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE" "$RUNNER_TEMP/ods-release/provenance.sigstore.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ods-attested-source-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 2
          path: ${{ runner.temp }}/ods-release/*

  draft:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    # Only this fresh job can create a release. It runs no third-party action,
    # checked-out source or scripts from the downloaded artifact.
    steps:
      - name: Create a new draft; never overwrite or publish an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT: ${{ needs.attest.outputs.artifact }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          gh run download "$GITHUB_RUN_ID" --repo Osmantic/ODS \
            --name "$SOURCE_ARTIFACT" --dir "$RUNNER_TEMP/ods-release"
          cd "$RUNNER_TEMP/ods-release"
          sha256sum --check --strict SHA256SUMS
          test -s provenance.sigstore.jsonl
          python3 -c 'import json,os; m=json.load(open("release-manifest.json")); assert (m["repository"],m["tag"],m["commit"]) == ("Osmantic/ODS",os.environ["GITHUB_REF"].removeprefix("refs/tags/"),os.environ["GITHUB_SHA"])'
          args=()
          if [[ "$tag" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$tag" --repo Osmantic/ODS --verify-tag --draft \
            --title "$tag" --notes 'Signed source candidate. Maintainer validation and publication required. The SBOM covers source dependencies, not container OS layers or model weights.' \
            "${args[@]}" "ODS-$tag-source.zip" "ODS-$tag-source.tar.gz" \
            source.spdx.json release-manifest.json SHA256SUMS provenance.sigstore.jsonl

name: Config migration version ceiling

on:
  pull_request:
    paths:
      - 'ods/scripts/migrate-config.sh'
      - 'ods/migrations/**'
      - 'ods/tests/test-migration-version-ceiling.py'
      - '.github/workflows/test-migration-ceiling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Exercise shipped migration commands in temporary installs
        run: python ods/tests/test-migration-version-ceiling.py

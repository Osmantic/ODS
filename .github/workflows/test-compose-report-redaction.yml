name: Compose report redaction
on:
  pull_request:
    paths:
      - 'ods/installers/lib/compose-failure-report.sh'
      - 'ods/tests/test_compose_report_redaction_progress.py'
      - 'ods/tests/test-compose-failure-report.sh'
      - '.github/workflows/test-compose-report-redaction.yml'
  push:
    branches: [public-beta]
    paths:
      - 'ods/installers/lib/compose-failure-report.sh'
      - 'ods/tests/test_compose_report_redaction_progress.py'
      - 'ods/tests/test-compose-failure-report.sh'
      - '.github/workflows/test-compose-report-redaction.yml'
permissions:
  contents: read
jobs:
  report:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest -q ods/tests/test_compose_report_redaction_progress.py
      - run: bash ods/tests/test-compose-failure-report.sh

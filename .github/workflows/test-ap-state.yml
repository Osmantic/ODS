name: AP state serialization
on:
  pull_request:
    paths:
      - 'ods/scripts/ap-mode.sh'
      - 'ods/tests/test_ap_state_serialization.py'
      - 'ods/tests/test-ap-mode.sh'
      - '.github/workflows/test-ap-state.yml'
permissions:
  contents: read
jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q ods/tests/test_ap_state_serialization.py
      - run: bash ods/tests/test-ap-mode.sh

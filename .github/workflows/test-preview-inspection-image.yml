name: Preview inspector private-context build

on:
  pull_request:
    paths:
      - '.github/workflows/test-preview-inspection-image.yml'
      - 'ods/installers/lib/pixel-preview-inspection.py'
      - 'ods/extensions/services/pixel-agent/host/Dockerfile.inspection'
      - 'ods/extensions/services/pixel-agent/host/preview-inspection.requirements.lock'
      - 'ods/extensions/services/pixel-agent/host/preview_inspection*.py'
      - 'ods/tests/test_preview_inspection_permissions.py'
      - 'ods/tests/test_preview_required_resources.py'
      - 'ods/extensions/services/pixel-agent/tests/inspection_resources.test.mjs'
      - 'ods/extensions/services/pixel-agent/plugin/workspace-preview-inspect.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-preview-inspection-image.yml'
      - 'ods/installers/lib/pixel-preview-inspection.py'
      - 'ods/extensions/services/pixel-agent/host/Dockerfile.inspection'
      - 'ods/extensions/services/pixel-agent/host/preview-inspection.requirements.lock'
      - 'ods/extensions/services/pixel-agent/host/preview_inspection*.py'
      - 'ods/tests/test_preview_inspection_permissions.py'
      - 'ods/tests/test_preview_required_resources.py'
      - 'ods/extensions/services/pixel-agent/tests/inspection_resources.test.mjs'
      - 'ods/extensions/services/pixel-agent/plugin/workspace-preview-inspect.mjs'

permissions:
  contents: read

jobs:
  private-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Build via installer under umask 077 and inspect as capsule user
        env:
          ODS_INSPECTION_BUILD_TESTS: '1'
        run: python -m pytest -q ods/tests/test_preview_inspection_permissions.py
      - name: Verify required resources with isolated Chromium
        run: |
          docker build --iidfile "$RUNNER_TEMP/resource-inspection-image" -f ods/extensions/services/pixel-agent/host/Dockerfile.inspection ods/extensions/services/pixel-agent/host
          docker run --rm --network none --entrypoint python -e ODS_PREVIEW_BROWSER_TESTS=1 -v "$PWD:/repo:ro" "$(cat "$RUNNER_TEMP/resource-inspection-image")" /repo/ods/tests/test_preview_required_resources.py
          node --test ods/extensions/services/pixel-agent/tests/inspection_resources.test.mjs

name: Release source contracts

on:
  pull_request:
    paths:
      - '.github/scripts/release_source.py'
      - '.github/scripts/test_release_source.py'
      - '.github/workflows/release-provenance.yml'
      - '.github/workflows/release-source-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/release_source.py'
      - '.github/scripts/test_release_source.py'
      - '.github/workflows/release-provenance.yml'
      - '.github/workflows/release-source-tests.yml'

permissions:
  contents: read

jobs:
  source-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.4.2' 'PyYAML==6.0.3'
      - run: python -m pytest .github/scripts/test_release_source.py -q

name: Acceptance Linux SearXNG Library add-back

on:
  push:
    branches:
      - codex/ods-searxng-library-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: searxng-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  searxng-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Checkout exact SearXNG Library candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: f6ae076c77a0d3422c2917bb4109b09f1a4c3dc6
          path: product
      - name: Exercise SearXNG add-back on installed ODS
        env:
          ODS_ACCEPTANCE_PRODUCT_ROOT: ${{ github.workspace }}/product/ods
        run: bash ods/tests/acceptance/searxng-library-journey.sh

name: PostgREST extension
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/postgrest/**'
      - 'ods/tests/test_postgrest.py'
      - '.github/workflows/postgrest-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest psycopg[binary]==3.2.10
      - run: python -m pytest ods/tests/test_postgrest.py -q
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest psycopg[binary]==3.2.10
      - run: sudo --preserve-env=PATH env ODS_TEST_POSTGREST=1 python -m pytest ods/tests/test_postgrest.py -q -s

name: Windows Desktop

# The Windows Desktop profile runs dashboard-api as a native Windows process
# (no Docker, no WSL). Only changes that can affect it run these jobs.
on:
  pull_request:
    paths:
      - "ods/extensions/services/dashboard-api/**"
      - "ods/installers/windows-desktop.ps1"
      - "ods/installers/windows/lib/desktop-*.ps1"
      - "ods/installers/windows/lib/native-llama-runtime.ps1"
      - "ods/installers/windows/lib/private-file.ps1"
      - "ods/config/windows-desktop.json"
      - "ods/tests/test-windows-desktop-launch.ps1"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "ods/extensions/services/dashboard-api/**"
      - "ods/installers/windows-desktop.ps1"
      - "ods/installers/windows/lib/desktop-*.ps1"
      - "ods/installers/windows/lib/native-llama-runtime.ps1"
      - "ods/installers/windows/lib/private-file.ps1"
      - "ods/config/windows-desktop.json"
      - "ods/tests/test-windows-desktop-launch.ps1"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  dashboard-api:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ods/extensions/services/dashboard-api
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      # Wheels only, every one hash-checked: the same install the Desktop
      # installer performs, so a lock without Windows wheels fails here.
      - name: Install the locked dependencies on Windows
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install -r tests/requirements-test.txt

      - name: Desktop profile, Windows metrics and lock policy
        run: >-
          python -m pytest -v
          tests/test_runtime_profile.py
          tests/test_windows_metrics.py
          tests/test_requirements_lock_policy.py
          tests/test_windows_desktop_startup.py

  # The whole native launch on a clean Windows, with no Python, Node or Git
  # on PATH: pinned embeddable Python, hash-locked wheels, the published app
  # and the real sign-in launcher. No model download; setup itself refuses
  # the runner's elevated session, so its task registration is not run here.
  desktop-launch:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ods
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Launch end to end (Windows PowerShell)
        shell: powershell
        run: ./tests/test-windows-desktop-launch.ps1

      - name: Launch end to end (PowerShell 7)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/test-windows-desktop-launch.ps1

name: Windows Desktop

# The Windows Desktop profile runs dashboard-api as a native Windows process
# (no Docker, no WSL). Only changes that can affect it run this job.
on:
  pull_request:
    paths:
      - "ods/extensions/services/dashboard-api/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "ods/extensions/services/dashboard-api/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  dashboard-api:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ods/extensions/services/dashboard-api
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      # Wheels only, every one hash-checked: the same install the Desktop
      # installer performs, so a lock without Windows wheels fails here.
      - name: Install the locked dependencies on Windows
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install -r tests/requirements-test.txt

      - name: Desktop profile, Windows metrics and lock policy
        run: >-
          python -m pytest -v
          tests/test_runtime_profile.py
          tests/test_windows_metrics.py
          tests/test_requirements_lock_policy.py
          tests/test_windows_desktop_startup.py

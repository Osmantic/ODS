name: Installer

# The GUI installer's workflow used to live at installer/.github/workflows/,
# which GitHub Actions does not read — only the repo root .github/workflows is
# scanned. It had never run once, so nothing built or tested this app.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/installer.yml"

permissions:
  contents: write

jobs:
  # Fast gate. The bundle matrix below takes tens of minutes across four
  # runners; this catches a broken type or a failing unit test in a couple.
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: installer/package-lock.json

      # The tauri crate links against webkit2gtk, so even `cargo test` needs
      # these present on Linux.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Dependencies (strict lock file check)
        run: npm ci

      # `build` is `tsc && vite build`, so this type-checks the front end too.
      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        working-directory: installer/src-tauri
        run: cargo test --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ods-installer-windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: ods-installer-macos-arm64
          - platform: macos-13
            target: x86_64-apple-darwin
            artifact: ods-installer-macos-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: ods-installer-linux

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Dependencies (strict lock file check)
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ODS_REPO_URL: https://github.com/${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}.git
          ODS_INSTALL_REF: ${{ github.ref_type == 'tag' && github.ref_name || github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        with:
          # tauri-action runs from the repo root regardless of the job default,
          # so it needs the app directory spelled out.
          projectPath: installer
          tagName: ${{ github.ref_name }}
          releaseName: "ODS Installer ${{ github.ref_name }}"
          releaseBody: "Cross-platform installer for ODS."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          # Artifact paths resolve from the repo root, not the job default.
          path: |
            installer/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            installer/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            installer/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            installer/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            installer/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            installer/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: ignore

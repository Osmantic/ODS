name: Acceptance Linux Portal retained WebUI upgrade

on:
  push:
    branches:
      - codex/ods-portal-upgrade-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retained-webui-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Checkout exact pre-lean baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 9b95d08ae9e9f79af8410dfcea442df6b99db0ba
          path: baseline
      - name: Checkout exact current-main Portal integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: c5bf679be9fa0da794d2307bc264cdcb0727e25d
          path: candidate
      - name: Record exact source and runner capacity
        run: |
          test "$(git -C baseline rev-parse HEAD)" = 9b95d08ae9e9f79af8410dfcea442df6b99db0ba
          test "$(git -C candidate rev-parse HEAD)" = c5bf679be9fa0da794d2307bc264cdcb0727e25d
          docker version
          df -h / "$RUNNER_TEMP"
          cat /proc/1/comm
      - name: Install baseline and upgrade without changing WebUI choice
        env:
          ODS_ACCEPTANCE_BASELINE_ROOT: ${{ github.workspace }}/baseline/ods
          ODS_ACCEPTANCE_CANDIDATE_ROOT: ${{ github.workspace }}/candidate/ods
        run: bash ods/tests/acceptance/portal-retained-webui-upgrade.sh

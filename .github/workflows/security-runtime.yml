name: Runtime security contracts

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [ape, dashboard-api, model-router, pixel-edge, pixel-inference, pixel-model-relay, privacy-shield, remote-provider-egress, token-spy]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ (matrix.service == 'ape' || matrix.service == 'token-spy') && '3.12' || '3.11' }}
      - name: Install the exact production environment
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --require-hashes -r "ods/extensions/services/$SERVICE/requirements.lock"
          "$RUNNER_TEMP/runtime/bin/python" -m pip check
      - name: Verify dependency inputs and Docker build enforcement
        run: |
          python -m pip install 'uv==0.12.19'
          uv pip compile "ods/extensions/services/$SERVICE/requirements.txt" --universal --python-version 3.10 --generate-hashes --no-header --no-annotate --index-url https://pypi.org/simple -o "ods/extensions/services/$SERVICE/requirements.lock"
          git diff --exit-code -- "ods/extensions/services/$SERVICE/requirements.lock"
          python .github/scripts/test_runtime_locks.py
      - name: Audit the locked production distributions
        run: |
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit --require-hashes -r "ods/extensions/services/$SERVICE/requirements.lock"
      - name: Build the production Dockerfile and check its installed environment
        run: |
          context="ods/extensions/services/$SERVICE"
          case "$SERVICE" in
            pixel-inference|remote-provider-egress) context=ods ;;
          esac
          # Reproduce source staged by a privacy-preserving umask. Docker COPY
          # keeps these modes, while each image runs its Python code as non-root.
          case "$SERVICE" in
            pixel-inference)
              chmod -R go-rwx ods/extensions/services/pixel-inference ods/bin/pixel_provider
              test "$(stat -c %a ods/extensions/services/pixel-inference/app)" = 700 ;;
            remote-provider-egress)
              chmod -R go-rwx ods/extensions/services/remote-provider-egress ods/bin/remote_provider
              test "$(stat -c %a ods/extensions/services/remote-provider-egress/app)" = 700 ;;
            *)
              chmod -R go-rwx "$context"
              test "$(stat -c %a "$context/Dockerfile")" = 600
              test "$(stat -c %a "$context")" = 700 ;;
          esac
          docker build --pull --tag "ods-security-$SERVICE:ci" \
            --file "ods/extensions/services/$SERVICE/Dockerfile" "$context"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint python \
            "ods-security-$SERVICE:ci" -m pip check
          case "$SERVICE" in
            ape) entry=/app/main.py; uid= ;;
            dashboard-api) entry=/app/main.py; uid=1000 ;;
            model-router) entry=/srv/model-router/app/main.py; uid=10777 ;;
            pixel-edge) entry=/app/edge_entrypoint.py; uid=1000 ;;
            pixel-inference) entry=/srv/pixel-inference/app/main.py; uid=1000 ;;
            pixel-model-relay) entry=/app/relay.py; uid=1000 ;;
            privacy-shield) entry=/app/proxy.py; uid=1000 ;;
            remote-provider-egress) entry=/srv/remote-provider-egress/app/main.py; uid=10778 ;;
            token-spy) entry=/app/main.py; uid=1000 ;;
          esac
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint sh \
            "ods-security-$SERVICE:ci" -c \
            "test \"\$(id -u)\" -ne 0 && test -r '$entry' && test -x '${entry%/*}'"
          if [ -n "$uid" ]; then
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --entrypoint sh \
              "ods-security-$SERVICE:ci" -c "test \"\$(id -u)\" -eq $uid"
          fi
          if [ "$SERVICE" = model-router ]; then
            scratch="$(mktemp -d)"
            (
              umask 077
              mkdir -p "$scratch/config/model-router"
              printf '{"endpoints": []}\n' > "$scratch/config/model-router/endpoints.json"
            )
            test "$(stat -c %a "$scratch/config/model-router")" = 700
            test "$(stat -c %a "$scratch/config/model-router/endpoints.json")" = 600
            python ods/scripts/render-runtime-configs.py \
              --surface model-router-endpoints --output-root "$scratch" --write
            test "$(stat -c %a "$scratch/config/model-router")" = 711
            test "$(stat -c %a "$scratch/config/model-router/endpoints.json")" = 644
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges \
              --mount "type=bind,src=$scratch/config/model-router,dst=/config,readonly" \
              --entrypoint python "ods-security-$SERVICE:ci" -c \
              'import json,os; assert os.geteuid()==10777; assert json.load(open("/config/endpoints.json"))["endpoints"][0]["id"] == "llama-server-default"'
          fi

  non-python-image-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [brave-search, dashboard, remote-provider-ssh-tunnel]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Build production image from restrictive source modes
        run: |
          context="ods/extensions/services/$SERVICE"
          if [ "$SERVICE" = remote-provider-ssh-tunnel ]; then
            context=ods
            chmod -R go-rwx ods/extensions/services/remote-provider-ssh-tunnel ods/bin/remote_provider
            test "$(stat -c %a ods/extensions/services/remote-provider-ssh-tunnel/app)" = 700
          else
            chmod -R go-rwx "$context"
            test "$(stat -c %a "$context")" = 700
          fi
          docker build --pull --tag "ods-security-$SERVICE:ci" \
            --file "ods/extensions/services/$SERVICE/Dockerfile" "$context"
          case "$SERVICE" in
            brave-search) entry=/app/proxy.mjs; uid=1000 ;;
            dashboard) entry=/entrypoint.sh; uid=1000 ;;
            remote-provider-ssh-tunnel) entry=/srv/remote-provider-ssh-tunnel/app/main.py; uid=10778 ;;
          esac
          entry_dir="$(dirname "$entry")"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint sh \
            "ods-security-$SERVICE:ci" -c \
            "test \"\$(id -u)\" -eq $uid && test -r '$entry' && test -x '$entry_dir'"
          if [ "$SERVICE" = dashboard ]; then
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --entrypoint sh \
              "ods-security-$SERVICE:ci" -c 'test -x /entrypoint.sh && test -r /etc/nginx/conf.d/default.conf.template'
          fi

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3' 'pytest==8.4.2'
      - run: python .github/scripts/test_security_workflows.py
      - run: python -m pytest .github/scripts/test_release_source.py -q
      - run: python ods/tests/contracts/test-private-service-ports.py
      - run: python ods/scripts/check-dependency-pins.py
      - run: python ods/tests/test-dependency-pins.py

  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
      - name: Audit Dashboard runtime dependencies
        working-directory: ods/extensions/services/dashboard
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

  saved-stack-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3' 'pytest==8.4.2'
      - run: python -m pytest ods/tests/test-compose-cache-policy.py ods/tests/test-model-store-compose-flags.py -q
      - run: python -m pytest ods/tests/test-verified-release-bootstrap.py -q
      - run: python -m pytest ods/tests/test-stop-owned-containers.py -q
      - run: python -m pytest ods/tests/test_extension_selection.py -q
      - if: runner.os == 'Linux'
        run: bash ods/tests/test-cli-user-extension-deps.sh
      - run: python -m pytest ods/tests/test-webui-library-addback.py -q
      - if: runner.os != 'Windows'
        run: python -m pytest ods/tests/test-macos-private-opencode-route.py -q
      - if: runner.os != 'Windows'
        name: Validate native migration recipe authorization and recovery
        run: python -m pytest ods/tests/test_macos_pixel_native_activate.py ods/tests/test_macos_pixel_native_docker_migrate.py ods/tests/test_macos_pixel_native_prepare.py ods/tests/test_macos_pixel_native_finalize.py -q
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./ods/tests/test-windows-compose-model-stores.ps1
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./ods/tests/test-windows-container-recovery.ps1

  source-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
      - name: Verify source confinement with real containers
        env:
          ODS_RUN_DOCKER_SECURITY_TESTS: '1'
        run: python3 ods/tests/contracts/test-source-sandbox-runtime.py
      - name: Verify rejected-runtime recovery with real containers
        env:
          ODS_RUN_DOCKER_SECURITY_TESTS: '1'
        run: |
          python -m pip install 'pytest==8.4.2'
          python -m pytest ods/tests/test-stop-owned-containers.py -q
      - name: Verify library image selection and forced local builds
        env:
          ODS_RUN_DOCKER_SECURITY_TESTS: '1'
        run: |
          python -m pip install 'PyYAML==6.0.3'
          python -m pytest ods/tests/test-library-image-policy.py -q

name: Runtime security contracts

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [ape, dashboard-api, model-router, pixel-edge, pixel-inference, pixel-model-relay, privacy-shield, remote-provider-egress, token-spy]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ (matrix.service == 'ape' || matrix.service == 'token-spy') && '3.12' || '3.11' }}
      - name: Install the exact production environment
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --require-hashes -r "ods/extensions/services/$SERVICE/requirements.lock"
          "$RUNNER_TEMP/runtime/bin/python" -m pip check
      - name: Verify dependency inputs and Docker build enforcement
        run: |
          python -m pip install 'uv==0.12.19'
          uv pip compile "ods/extensions/services/$SERVICE/requirements.txt" --universal --python-version 3.10 --generate-hashes --no-header --no-annotate --index-url https://pypi.org/simple -o "ods/extensions/services/$SERVICE/requirements.lock"
          git diff --exit-code -- "ods/extensions/services/$SERVICE/requirements.lock"
          python .github/scripts/test_runtime_locks.py
      - name: Audit the locked production distributions
        run: |
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit --require-hashes -r "ods/extensions/services/$SERVICE/requirements.lock"

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: python .github/scripts/test_security_workflows.py
      - run: python ods/tests/contracts/test-private-service-ports.py
      - run: python ods/scripts/check-dependency-pins.py

  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
      - name: Audit Dashboard runtime dependencies
        working-directory: ods/extensions/services/dashboard
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

  saved-stack-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3' 'pytest==8.4.2'
      - run: python -m pytest ods/tests/test-compose-cache-policy.py ods/tests/test-model-store-compose-flags.py -q
      - if: runner.os != 'Windows'
        run: python -m pytest ods/tests/test-macos-private-opencode-route.py -q
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./ods/tests/test-windows-compose-model-stores.ps1

  source-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
      - name: Verify source confinement with real containers
        env:
          ODS_RUN_DOCKER_SECURITY_TESTS: '1'
        run: python3 ods/tests/contracts/test-source-sandbox-runtime.py

name: Weaviate telemetry contract
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/weaviate/**'
      - 'ods/tests/test_weaviate_telemetry.py'
      - '.github/workflows/weaviate-telemetry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest ods/tests/test_weaviate_telemetry.py -q -s
        env:
          ODS_TEST_WEAVIATE_TELEMETRY: '1'

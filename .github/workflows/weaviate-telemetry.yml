name: Weaviate telemetry contract
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/weaviate/**'
      - 'ods/tests/test_weaviate_telemetry.py'
      - '.github/workflows/weaviate-telemetry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/test-tools.txt
      - run: python -m pytest ods/tests/test_weaviate_telemetry.py -q -s
        env:
          ODS_TEST_WEAVIATE_TELEMETRY: '1'

name: Pixel tool grammar

on:
  pull_request:
    paths:
      - 'ods/extensions/services/pixel-agent/plugin/**'
      - 'ods/extensions/services/pixel-agent/tests/tool*grammar*'
      - 'ods/extensions/services/pixel-agent/tests/extension_proposal.test.mjs'
      - 'ods/extensions/services/pixel-agent/tests/runtime_tool_surface.integration.mjs'
      - 'ods/extensions/services/pixel-agent/tests/runtime_image_envelope.integration.mjs'
      - 'ods/extensions/services/pixel-agent/tests/test_openclaw_tool_recovery.py'
      - 'ods/extensions/services/pixel-agent/host/openclaw-image-envelope.json'
      - 'ods/extensions/services/pixel-agent/host/openclaw_tool_recovery.py'
      - 'ods/docker-compose.base.yml'
      - '.github/workflows/test-pixel-tool-grammar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the exact reviewed OpenClaw package without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/pixel-grammar-openclaw"
          mkdir -p "$runtime"
          npm pack openclaw@2026.6.33 --silent --pack-destination "$runtime"
          archive="$runtime/openclaw-2026.6.33.tgz"
          echo "96880d5a9fe3ef6b3d2ec0ac016e48f99fff7b1af4e22b7c814db6357c163952  $archive" | sha256sum --check
          # Install as a dependency: npm ci in the unpacked upstream package
          # incorrectly validates its unpublished dev dependency lock entries.
          npm install --prefix "$runtime" --omit=dev --ignore-scripts --no-audit --no-fund "$archive"
          package="$runtime/node_modules/openclaw"
          python ods/extensions/services/pixel-agent/host/openclaw_tool_recovery.py \
            --openclaw-bin "$package/openclaw.mjs" --state-dir "$runtime/repair-state" --image-envelope
          echo "OPENCLAW_TOOL_SEARCH_MODULE=$package/dist/tool-search-BInRpkE3.js" >> "$GITHUB_ENV"
          echo "OPENCLAW_STATE_DIR=$runtime/state" >> "$GITHUB_ENV"
          echo "ODS_TEST_GRAMMAR_WORKSPACE=$runtime/workspace" >> "$GITHUB_ENV"
          mkdir -p "$runtime/state" "$runtime/workspace"
          python -m pip install pytest
      - name: Fetch the default Compose runtime's exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ggml-org/llama.cpp
          # b9014, matching ods/docker-compose.base.yml
          ref: d4b0c22f9e67f0295e91dc1ab4f17c0fb2557fa4
          path: .llama-grammar-source
          persist-credentials: false
      - name: Build the native schema and grammar test bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ghcr.io/ggml-org/llama.cpp:server-b9014' ods/docker-compose.base.yml
          source_dir="$PWD/.llama-grammar-source"
          build_dir="$RUNNER_TEMP/pixel-llama-grammar"
          cmake -S "$source_dir" -B "$build_dir" -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF
          cmake --build "$build_dir" --target llama-common -j 2
          g++ -std=c++17 -O2 ods/extensions/services/pixel-agent/tests/tool-schema-grammar.cpp \
            -I "$source_dir/src" -I "$source_dir/common" -I "$source_dir/include" \
            -I "$source_dir/vendor" -I "$source_dir/ggml/include" \
            -L "$build_dir/bin" -Wl,-rpath,"$build_dir/bin" \
            -lllama-common -lllama -lggml-base -o "$RUNNER_TEMP/pixel-tool-schema-grammar"
      - name: Compile offered schemas and verify execution limits
        shell: bash
        run: |
          set -euo pipefail
          export ODS_TEST_LLAMA_SCHEMA="$RUNNER_TEMP/pixel-tool-schema-grammar"
          export ODS_TEST_LLAMA_CHAT_TEMPLATE="$PWD/.llama-grammar-source/models/templates/Qwen3.5-4B.jinja"
          test -x "$ODS_TEST_LLAMA_SCHEMA"
          node --test --test-timeout=180000 \
            ods/extensions/services/pixel-agent/tests/tool_schema_grammar.test.mjs \
            ods/extensions/services/pixel-agent/tests/tool_grammar_surface.integration.mjs \
            ods/extensions/services/pixel-agent/tests/extension_proposal.test.mjs \
            ods/extensions/services/pixel-agent/tests/runtime_tool_surface.integration.mjs \
            ods/extensions/services/pixel-agent/tests/runtime_image_envelope.integration.mjs
          python -m pytest -q ods/extensions/services/pixel-agent/tests/test_openclaw_tool_recovery.py

name: Secret Scan

on:
  pull_request:
    branches: [main, public-beta]
  push:
    branches: [main, public-beta]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      # gitleaks-action@v2 now requires a paid license key for GitHub org repos.
      # Use the OSS CLI instead to keep secret scanning enabled without paid secrets.
      - name: Install gitleaks (OSS)
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl --fail --silent --show-error --location --output "${ASSET}" "${BASE_URL}/${ASSET}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${ASSET}" | sha256sum -c -
          tar -xzf "${ASSET}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Verify secret scanning coverage
        run: |
          python3 .github/scripts/check-secret-scan.py
          python3 .github/scripts/test_scan_git_bundles.py

      - name: Run gitleaks
        run: |
          set -euo pipefail
          gitleaks detect \
            --redact \
            --verbose \
            --source . \
            --config .gitleaks.toml \
            --log-opts HEAD \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1

      - name: Scan bundled Git histories
        if: success() || failure()
        run: python3 .github/scripts/scan-git-bundles.py

      - name: Upload gitleaks report (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            gitleaks-bundles-report.json
        continue-on-error: true

name: Neo4j extension
on:
  pull_request:
    paths:
      - 'ods/extensions/library/services/neo4j/**'
      - 'ods/config/extensions-catalog.json'
      - 'ods/tests/test_neo4j.py'
      - '.github/workflows/neo4j-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest ods/tests/test_neo4j.py -q -s
        env:
          ODS_TEST_NEO4J: '1'
